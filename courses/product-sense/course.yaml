slug: product-sense
repositoryPublish: true
title: "Product Sense for Engineers: UI, UX and Work People Remember"
description: "Anyone can build an app in a weekend now, and most of those apps look the same. Learn the product sense that makes work stand out: start from the problem and the job, shape screens so the important thing is seen first, design the moments when things go wrong, build taste you can explain, remove the generic AI-made look, use AI design tools as opinions you check, and present your work in a demo and a case study people remember."
projectGoal: "Redesign one of your own projects, or the provided Wasel print-shop app, from the generic look to work people remember: before and after screenshots, a critique log with a reason for every change, a case study page that passes a 10-second skim, and a 60 to 90 second demo. Then defend your changes with the AI interviewer or in writing."
difficulty: Medium
estimatedHours: 26
category: tech
modules:
  - dir: 01-think-product-first
    title: "Think product first"
    summary: "Start from the problem and the job a person hires your app for, cut the scope to fit your time, and decide how you will know it worked."
    lessons:
      - file: 01.01-set-the-scene.md
        title: "Set the scene: fourteen features, three users"
        goal: "Introduce the course through Maryam's study-group app, which does everything and is used by almost nobody."
      - file: 01.02-start-from-the-problem.md
        title: "Start from the problem, not the feature"
        goal: "Turn a feature request into the problem underneath it, and check the problem before building."
      - file: 01.03-the-job-people-hire-it-for.md
        title: "The job people hire your app for"
        goal: "Write the job a person is trying to get done in a situation, and see how the same app changes for a different job."
      - file: 01.04-fit-the-scope-to-the-time.md
        title: "Fit the scope to the time, say no to the rest"
        goal: "Set the time first, then cut the scope to fit it, and say no to a feature with a reason."
      - file: 01.05-know-if-it-worked.md
        title: "Know if it worked"
        goal: "Pick one goal and one signal you can watch a person do, and check it with three to five people."
      - file: 01.06-practice-a-one-page-brief.md
        title: "Practice: a one-page product brief"
        goal: "Write a one-page brief for your project or the provided Wasel app: the job, the time, the cut list, the goal and the signal."
      - file: 01.07-quiz.md
        title: "Thinking product first"
        goal: "Graded cases on problems, jobs, scope and signals."
      - file: 01.08-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: what changed in how you choose what to build."
  - dir: 02-see-it-first
    title: "See it first: hierarchy, type, space and colour"
    summary: "Decide what a person sees first, set type that reads on a phone, let space do the grouping, and give colour a job with contrast you can measure."
    lessons:
      - file: 02.01-set-the-scene.md
        title: "Set the scene: ten links, one morning"
        goal: "Introduce the module through a reviewer who skims ten project pages and remembers none."
      - file: 02.02-one-thing-first.md
        title: "One thing first: visual hierarchy"
        goal: "Use size, weight, contrast and position to make one thing come first, and check it with the squint test."
      - file: 02.03-type-that-reads-on-a-phone.md
        title: "Type that reads on a phone"
        goal: "Choose body size, line height, line length and a small set of sizes that read on a phone."
      - file: 02.04-space-does-the-grouping.md
        title: "Space does the grouping"
        goal: "Use less space inside a group than between groups, from one consistent spacing step."
      - file: 02.05-colour-with-a-job.md
        title: "Colour with a job, contrast you can measure"
        goal: "Give colour a job, measure contrast against WCAG 2.2 AA, and never use colour alone."
      - file: 02.06-practice-fix-one-screen.md
        title: "Practice: fix one screen"
        goal: "Fix one screen of your project or Wasel, before and after, with a reason for every change."
      - file: 02.07-quiz.md
        title: "Hierarchy, type, space and colour"
        goal: "Graded cases on hierarchy, type, spacing and contrast."
      - file: 02.08-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: what you now see first when you look at a screen."
  - dir: 03-kind-to-use
    title: "Kind to use: states, forms, access, motion and the first run"
    summary: "Design the moments when things go wrong or are not there yet, forms people finish, screens everyone can use on a small phone, motion with a reason, and a first run that reaches value fast."
    lessons:
      - file: 03.01-set-the-scene.md
        title: "Set the scene: a blank screen on weak data"
        goal: "Introduce the module through a blank screen that could mean loading, empty or broken."
      - file: 03.02-empty-loading-error.md
        title: "Empty, loading, error: the states nobody draws"
        goal: "Design the empty, loading and error states of a screen, and say what is happening in each."
      - file: 03.03-forms-people-finish.md
        title: "Forms people finish"
        goal: "Keep labels visible, put errors next to their cause in words, and check a field after the person leaves it."
      - file: 03.04-everyone-can-use-it.md
        title: "Everyone can use it: access and small screens"
        goal: "Size targets for fingers, keep focus visible, give images text alternatives, start from the small screen and support right to left."
      - file: 03.05-motion-with-a-reason.md
        title: "Motion with a reason"
        goal: "Use motion only to show a change, and respect the reader's reduced-motion setting."
      - file: 03.06-the-first-run.md
        title: "The first run and the moment it clicks"
        goal: "Bring a new person to the valuable moment fast, and teach inside the screen instead of in a tour."
      - file: 03.07-practice-the-unhappy-paths.md
        title: "Practice: the unhappy paths of one flow"
        goal: "Design the states, form errors and first run of one flow in your project or Wasel."
      - file: 03.08-quiz.md
        title: "States, forms, access, motion and the first run"
        goal: "Graded cases on states, forms, accessibility, motion and onboarding."
      - file: 03.09-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: which unhappy path you will never skip again."
  - dir: 04-taste
    title: "Taste: know average from remarkable"
    summary: "Judge work on a scale with criteria, see why defaults look generic, study real products and write critiques, and check popular design rules against the evidence."
    lessons:
      - file: 04.01-set-the-scene.md
        title: "Set the scene: it looks fine"
        goal: "Introduce the module through two fellows who disagree about a screen and cannot say why."
      - file: 04.02-four-levels.md
        title: "Average, good, best, remarkable"
        goal: "Place work on a four-level scale using criteria you can check, and give a reason for the top level."
      - file: 04.03-why-defaults-look-generic.md
        title: "Why defaults look generic"
        goal: "Explain why unchanged framework defaults look like everyone else, and change something on purpose."
      - file: 04.04-study-real-products.md
        title: "Study real products: collect, compare, critique"
        goal: "Collect screens, compare them on the same task and write a critique that names what you see, the rule and the evidence."
      - file: 04.05-rules-that-fail-a-check.md
        title: "Popular rules that fail a check"
        goal: "Check popular design rules against their evidence before you repeat them."
      - file: 04.06-practice-a-critique-log.md
        title: "Practice: a critique log of three products"
        goal: "Write a dated critique log of three real products on one task, with the rule and the evidence for each point."
      - file: 04.07-quiz.md
        title: "Judging quality"
        goal: "Graded cases on the four levels, defaults, critique and evidence."
      - file: 04.08-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: how you now tell average from good."
  - dir: 05-make-the-slop-go-away
    title: "Make the AI slop go away"
    summary: "Spot the generic AI-made look in screens and words, and replace it with real content, an editorial layout and a point of view."
    lessons:
      - file: 05.01-set-the-scene.md
        title: "Set the scene: a shop page made in one evening"
        goal: "Introduce the module through a print shop's page that could sell anything."
      - file: 05.02-the-generic-look.md
        title: "The generic look: defaults you did not choose"
        goal: "Spot the parts of a screen that carry the generic AI-made look, and ask what each one does for the person using it."
      - file: 05.03-words-anyone-could-write.md
        title: "Words anyone could write"
        goal: "Cut sentences a hundred products could say, and replace them with something specific."
      - file: 05.04-a-point-of-view.md
        title: "Real content, an editorial layout, a point of view"
        goal: "Make real content the visual, lay the page out like an editor, and spend your boldness in one place."
      - file: 05.05-practice-de-slop-a-page.md
        title: "Practice: de-slop one page"
        goal: "Remove the generic look from one page of your project or Wasel, screen and words, with a reason for every element."
      - file: 05.06-quiz.md
        title: "Spotting and removing the generic look"
        goal: "Graded cases on generic defaults in screens and copy."
      - file: 05.07-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: which default you will now choose on purpose."
  - dir: 06-ai-design-tools
    title: "AI design tools under your judgment"
    summary: "Use design skills and AI tools that build screens with a specific brief, and use AI critique as several opinions you check before you decide."
    lessons:
      - file: 06.01-set-the-scene.md
        title: "Set the scene: three AIs, three opinions"
        goal: "Introduce the module through three AI critiques of one screen that disagree."
      - file: 06.02-design-skills-and-agents.md
        title: "Design skills and agents that build screens"
        goal: "Write a design brief and a skill checklist, use two tools per job with a fallback, and check whether each tool opens for you."
      - file: 06.03-ai-as-a-critic.md
        title: "AI as a critic: several opinions, then you decide"
        goal: "Ask several AI tools for questions, not verdicts, check each point against a rule or a person, and decide."
      - file: 06.04-practice-a-three-opinion-critique.md
        title: "Practice: a three-opinion critique"
        goal: "Give one screen and one rubric to three AI tools, check every point, and write your decisions."
      - file: 06.05-quiz.md
        title: "Using AI design tools well"
        goal: "Graded cases on briefs, skills, tool access and AI critique."
      - file: 06.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: where an AI opinion stops and your judgment starts."
  - dir: 07-present-the-work
    title: "Present the work, and capstone"
    summary: "Show the core of your work in a short demo that works with the sound off, a case study page that passes a 10-second skim and one-click access, then redesign and defend a project."
    lessons:
      - file: 07.01-set-the-scene.md
        title: "Set the scene: the link nobody opened"
        goal: "Introduce the module through a strong project hidden behind a login wall and a silent video."
      - file: 07.02-a-demo-that-shows-the-core.md
        title: "A demo that shows the core in 60 to 90 seconds"
        goal: "Plan a short demo as one story that shows the result early, works muted and has captions."
      - file: 07.03-a-case-study-that-passes-the-skim.md
        title: "A case study page that passes the skim"
        goal: "Put the result first, then the problem, your role, your choices and what you gave up."
      - file: 07.04-show-it-where-people-look.md
        title: "Show it where people look, open in one click"
        goal: "Give reviewers one-click access with a fallback, place the work where people look, and check hosting terms."
      - file: 07.05-quiz.md
        title: "Mixed review: which fix first?"
        goal: "Fresh graded cases from every module."
      - file: 07.06-capstone-part-1.md
        title: "Capstone, part 1: before and after, and the critique log"
        goal: "Redesign your project or Wasel: before and after screenshots of at least three screens and a critique log with a reason and a cost for every change."
      - file: 07.07-capstone-part-2.md
        title: "Capstone, part 2: the case study page and the demo"
        goal: "Present the redesign: a case study page that passes a 10-second skim, one-click access with a fallback, and a 60 to 90 second demo that works with the sound off."
      - file: 07.08-checklist.md
        title: "Course checklist and your defence"
        goal: "Final checks, and a defence of your changes with the AI interviewer or in writing."
