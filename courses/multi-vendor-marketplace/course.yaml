  - slug: services
    modules:
      - key: services-introduction
        dir: 01-introduction
        title: SkillSlot introduction
        lessons:
          - key: services-intro-01-01
            file: 01.01-what-youre-building.md
            title: '1.1 What you are building: SkillSlot'
            goal: >-
              Meet a marketplace where clients book paid time from independent providers, and identify the promise that
              every booking must keep.
          - key: services-intro-01-02
            file: 01.02-how-to-use-this-course.md
            title: 1.2 How to use this course
            goal: >-
              Follow the SkillSlot build in order, keep small evidence commits and a learning log, and use each gate to
              prove a working product.
          - key: services-intro-01-03
            file: 01.03-product-and-people.md
            title: 1.3 The product and its people
            goal: >-
              Trace provider and client journeys from discovery to a finished session, then mark which data each person
              owns.
          - key: services-intro-01-04
            file: 01.04-scope.md
            title: 1.4 Keep the booking product in scope
            goal: >-
              Choose the features that prove safe paid booking, and defer integrations that do not strengthen the core
              promise.
          - key: services-intro-01-05
            file: 01.05-prerequisites-and-date-repair.md
            title: 1.5 Check the entry skills and repair date basics
            goal: >-
              Check JavaScript, HTTP and database basics, then repair the difference between a Date instant and a local
              calendar rule.
          - key: services-intro-01-06
            file: 01.06-course-outline.md
            title: 1.6 Course outline and demo targets
            goal: Name the four weekly SkillSlot demos and the evidence each one needs before the next phase begins.
          - key: services-intro-01-07
            file: 01.07-why-time-is-hard.md
            title: 1.7 Why time is the hard part
            goal: >-
              Predict and explain three booking failures: a double booking, a wrong local hour, and a refund after an
              expired hold.
          - key: services-intro-01-08
            file: 01.08-working-rhythm-and-checklist.md
            title: 1.8 Working rhythm and introduction gate
            goal: >-
              Show a product brief, a learning-log plan, four demo targets, and a clear explanation of SkillSlot's three
              booking failures.
      - key: services-time-and-time-zones
        dir: 05-time-and-time-zones
        title: Time and time zones
        lessons:
          - key: services-time-05-01
            file: 05.01-set-the-scene.md
            title: 5.1 A booking has two clocks
            goal: >-
              Separate a provider's local working rule from the exact instant a client books, then identify the evidence
              needed before building the slot engine.
          - key: services-time-05-02
            file: 05.02-instants-and-wall-clocks.md
            title: 5.2 An instant is not a wall-clock rule
            goal: >-
              Model a repeating provider rule and a confirmed booking with different time representations, then
              calculate one cross-zone display.
          - key: services-time-05-03
            file: 05.03-zones-offsets-and-changes.md
            title: 5.3 A zone is a rule set, not one offset
            goal: >-
              Distinguish an IANA zone from one dated UTC offset and decide how SkillSlot handles changes in time-zone
              data.
          - key: services-time-05-04
            file: 05.04-gaps-and-overlaps.md
            title: 5.4 When 02:30 happens zero or two times
            goal: >-
              Detect skipped and repeated local times and choose an explicit policy before a booking boundary becomes a
              UTC instant.
          - key: services-time-05-05
            file: 05.05-your-time-their-time.md
            title: 5.5 Your time, their time
            goal: >-
              Trace one provider rule through two dated weeks and two viewer zones, then explain why a confirmed booking
              does not move.
          - key: services-time-05-06
            file: 05.06-time-zone-quiz.md
            title: 5.6 Time-zone decisions
            goal: Apply the rule, instant and display distinction to booking, daylight-saving and reminder scenarios.
          - key: services-time-05-07
            file: 05.07-build-the-time-module.md
            title: 5.7 Put time conversion behind one module
            goal: Build one validated local-to-UTC converter and one UTC-to-viewer formatter for SkillSlot.
          - key: services-time-05-08
            file: 05.08-an-injectable-clock.md
            title: 5.8 Give the server one testable clock
            goal: >-
              Inject the current instant into slot eligibility and notice-period decisions so cutoff tests do not depend
              on the wall clock.
          - key: services-time-05-09
            file: 05.09-clock-and-zone-tests.md
            title: 5.9 Prove the clock and zone boundaries
            goal: >-
              Test ordinary, skipped and repeated local times, cross-zone formatting, and exact notice boundaries before
              using time in booking routes.
          - key: services-time-05-10
            file: 05.10-recap-and-checklist.md
            title: 5.10 Time module gate
            goal: >-
              Demonstrate that a dated local rule becomes one validated UTC instant and that viewer-zone changes cannot
              move a paid booking.
      - key: services-calendar-database
        dir: 03-why-mongodb-for-a-calendar
        title: Why MongoDB for a calendar
        lessons:
          - key: services-calendar-rules-slots-bookings
            file: 03.01-set-the-scene.md
            title: 'Set the scene: rules, slots and bookings'
            goal: Separate repeating availability rules, dated slot offers and durable bookings
          - key: services-calendar-relational-document
            file: 03.02-relational-and-document-schedules.md
            title: Relational and document schedules
            goal: Compare PostgreSQL range exclusion with MongoDB block claims
          - key: services-calendar-mongodb-decision
            file: 03.03-the-skill-slot-decision.md
            title: The SkillSlot database decision
            goal: Defend MongoDB with unique SlotClaim keys and transaction boundaries
          - key: services-calendar-booking-identity
            file: 03.04-embedding-and-booking-identity.md
            title: Why a booking is its own document
            goal: Choose references for booking identity and embedded purchase snapshots
          - key: services-calendar-model-quiz
            file: 03.05-calendar-model-quiz.md
            title: Calendar data-model check
            goal: Apply the rule, claim, booking and snapshot distinctions
          - key: services-calendar-erd
            file: 03.06-map-actors-to-collections.md
            title: Map the calendar actors to collections
            goal: Draft the eight-collection ERD and testable invariants
          - key: services-calendar-checklist
            file: 03.07-checklist.md
            title: Calendar data-model gate
            goal: Commit and review docs/erd-draft.md
      - key: services-calendar-data-model
        dir: 06-calendar-data-model-and-seed
        title: Calendar data model and seed
        lessons:
          - key: services-data-01
            file: 06.01-set-the-scene.md
            title: 6.1 The overlap trap
            goal: >-
              Explain why reading for overlapping bookings before inserting does not protect one
              provider's time.
          - key: services-data-02
            file: 06.02-ownership-chain.md
            title: 6.2 Follow the ownership chain
            goal: >-
              Trace User, Provider, Service, Order and Booking relationships before writing authorization
              queries.
          - key: services-data-03
            file: 06.03-rules-and-instances.md
            title: 6.3 Rules are local; appointments are instants
            goal: >-
              Choose local wall-clock fields for weekly rules and resolved UTC instants for dated
              commitments.
          - key: services-data-04
            file: 06.04-quiz.md
            title: 6.4 Calendar model check
            goal: Apply ownership, local-rule, snapshot and unique-claim decisions before creating schemas.
          - key: services-data-05
            file: 06.05-user-and-profile-models.md
            title: 6.5 Put identity and display zone in the right models
            goal: >-
              Create User and Profile models with one profile per account and a validated viewer IANA
              zone.
          - key: services-data-06
            file: 06.06-provider-model.md
            title: 6.6 Give each provider one working identity
            goal: Create one Provider per account with a required working zone and a location type.
          - key: services-data-07
            file: 06.07-service-model.md
            title: 6.7 Make a Service a priced time promise
            goal: >-
              Model provider-owned services with whole-block duration, buffer, minor-unit price and
              policy.
          - key: services-data-08
            file: 06.08-rules-and-time-off-models.md
            title: 6.8 Store weekly rules and dated time off
            goal: Keep recurring wall-clock hours separate from resolved UTC exceptions.
          - key: services-data-09
            file: 06.09-slot-claim-index.md
            title: 6.9 Make a block claim unique in MongoDB
            goal: >-
              Create one scalar SlotClaim per provider UTC block and prove the database rejects a
              duplicate key.
          - key: services-data-10
            file: 06.10-booking-model-and-states.md
            title: 6.10 Give Booking an independent lifecycle
            goal: >-
              Store one dated appointment with participants, purchase snapshots and an auditable state
              history.
          - key: services-data-11
            file: 06.11-cart-item-and-order.md
            title: 6.11 Separate a requested slot from a provider order
            goal: Model CartItem as an unreserved proposal and Order as one provider's paid share.
          - key: services-data-12
            file: 06.12-seed-real-calendar-people.md
            title: 6.12 Seed people, rules and a dated appointment
            goal: Create a repeatable development seed with five Gaza providers and clients in three zones.
          - key: services-data-13
            file: 06.13-run-seed-and-inspect.md
            title: 6.13 Inspect the seed as a calendar model
            goal: >-
              Run the repeatable seed and explain two stored UTC instants in the provider and client
              zones.
          - key: services-data-14
            file: 06.14-checklist.md
            title: 6.14 Calendar model and seed gate
            goal: >-
              Commit the final ERD, repeatable seed and database evidence for ownership, UTC and exclusive
              claims.
      - key: services-provider-dashboard-hours
        dir: 13-provider-dashboard-and-hours
        title: Provider dashboard and weekly hours
        lessons:
          - key: services-hours-01
            file: 13.01-set-the-scene.md
            title: 13.1 Run the practice in local time
            goal: >-
              Explain why a provider edits weekly hours in their own zone while paid appointments remain
              fixed UTC instants.
          - key: services-hours-02
            file: 13.02-error-mapping.md
            title: 13.2 Turn schedule errors into useful actions
            goal: Map authorization, conflict and local-time validation codes to specific dashboard feedback.
          - key: services-hours-03
            file: 13.03-services-table-and-forms.md
            title: 13.3 Manage services without changing old bookings
            goal: >-
              Build an owned Services table with create, edit and archive forms that preserve purchase
              snapshots.
          - key: services-hours-04
            file: 13.04-availability-rules-api.md
            title: 13.4 Publish nonoverlapping weekly rules
            goal: >-
              Create owned rule CRUD with provider-local validation, effective dates and serialized
              overlap checks.
          - key: services-hours-05
            file: 13.05-time-off-api.md
            title: 13.5 Block a dated interval and show conflicts
            goal: >-
              Resolve provider-local TimeOff to UTC and list existing held or confirmed bookings without
              cancelling them.
          - key: services-hours-06
            file: 13.06-weekly-hours-editor.md
            title: 13.6 Edit weekly hours in the provider zone
            goal: >-
              Build a weekday grid that displays local working windows and handles overlap and
              stale-version errors.
          - key: services-hours-07
            file: 13.07-time-off-editor.md
            title: 13.7 Block the rest of today safely
            goal: >-
              Create a dated TimeOff editor with a server-clock emergency action and protected booking
              conflicts.
          - key: services-hours-08
            file: 13.08-listing-readiness.md
            title: 13.8 List a provider only when clients can book
            goal: >-
              Compute listing readiness from Provider status, an active Service and valid active local
              hours.
          - key: services-hours-09
            file: 13.09-provider-schedule-quiz.md
            title: 13.9 Provider schedule check
            goal: Apply ownership, local-rule, TimeOff and publication decisions to provider scenarios.
          - key: services-hours-10
            file: 13.10-checklist.md
            title: 13.10 Provider schedule gate
            goal: >-
              Prove owned Service editing, local weekly rules, dated TimeOff, visible booking conflicts
              and listing readiness.
      - key: services-availability-engine
        dir: 15-availability-engine-api
        title: Availability engine API
        lessons:
          - key: services-availability-01
            file: 15.01-set-the-scene.md
            title: From provider rules to bookable starts
            goal: Explain why dated slot offers are computed from rules and current constraints.
          - key: services-availability-02
            file: 15.02-the-availability-algorithm.md
            title: The availability algorithm
            goal: Turn weekly local windows into UTC candidates and filter exceptions, claims, and notice.
          - key: services-availability-03
            file: 15.03-block-claims-canvas.md
            title: See the blocks behind a slot
            goal: Identify every service and buffer claim collision.
          - key: services-availability-04
            file: 15.04-quiz.md
            title: Availability engine check
            goal: Apply local-rule expansion, occupied blocks, and notice boundaries.
          - key: services-availability-05
            file: 15.05-expand-dated-rules.md
            title: Expand rules into dated windows
            goal: Resolve provider-local rule boundaries through the tested zone converter.
          - key: services-availability-06
            file: 15.06-step-in-absolute-time.md
            title: Step through windows in UTC
            goal: Generate aligned UTC candidates across clock changes.
          - key: services-availability-07
            file: 15.07-load-blockers-once.md
            title: Load time off and claims once
            goal: Fetch one bounded range of TimeOff and SlotClaims.
          - key: services-availability-08
            file: 15.08-fit-service-and-buffer.md
            title: Fit the full service and buffer
            goal: Reject every candidate whose occupied interval intersects a blocker.
          - key: services-availability-09
            file: 15.09-notice-and-horizon.md
            title: Apply notice and booking horizon
            goal: Use one injected server instant and exact eligibility boundaries.
          - key: services-availability-10
            file: 15.10-availability-route.md
            title: Return the next seven days of starts
            goal: Expose a bounded, scoped UTC availability API.
          - key: services-availability-11
            file: 15.11-engine-tests.md
            title: Prove the engine on hard dates
            goal: Test clock changes, blockers, buffers, scoping, and route errors.
          - key: services-availability-12
            file: 15.12-checklist.md
            title: Availability engine gate
            goal: Commit green tests and a safe UTC sample response.
      - key: services-holds-checkout
        dir: 19-holds-and-checkout
        title: Holds and checkout
        lessons:
          - key: services-holds-01
            file: 19.01-set-the-scene.md
            title: 19.1 Two phones, one 15:00 slot
            goal: >-
              Describe the client-visible harm of a double booking and the boundary between an offer, a
              hold and a confirmed appointment.
          - key: services-holds-02
            file: 19.02-check-then-insert-race.md
            title: 19.2 Check-then-insert is a race
            goal: >-
              Trace why an availability read cannot serialize two checkout writers, even inside a
              transaction.
          - key: services-holds-03
            file: 19.03-claims-as-locks.md
            title: 19.3 Claims as database locks
            goal: Use unique provider and block keys to give one live Booking exclusive occupancy.
          - key: services-holds-04
            file: 19.04-holds-that-expire.md
            title: 19.4 Holds that expire
            goal: >-
              Model short held bookings, explicit expiry and a release transition that preserves purchase
              history.
          - key: services-holds-05
            file: 19.05-quiz.md
            title: 19.5 Claim and hold check
            goal: >-
              Check overlapping blocks, transaction atomicity, expired holds and checkout retries before
              building the route.
          - key: services-holds-06
            file: 19.06-all-lines-or-none.md
            title: 19.6 Checkout all lines or none
            goal: >-
              Build a transaction that revalidates every cart line and commits every occupied block or
              rejects the entire checkout.
          - key: services-holds-07
            file: 19.07-split-by-provider.md
            title: 19.7 Split the cart by provider
            goal: >-
              Create one pending Order per provider and one held Booking per line with stable commercial
              and time snapshots.
          - key: services-holds-08
            file: 19.08-idempotent-checkout.md
            title: 19.8 Make checkout retries idempotent
            goal: >-
              Use a client checkout ID and canonical request fingerprint to recover the same committed
              hold after a lost response.
          - key: services-holds-09
            file: 19.09-hold-limits.md
            title: 19.9 Limit calendar holds
            goal: >-
              Enforce bounded per-client active holds and distributed checkout rate limits without
              breaking idempotent recovery.
          - key: services-holds-10
            file: 19.10-hide-held-blocks.md
            title: 19.10 Hide held blocks from new offers
            goal: >-
              Make availability read committed held and confirmed claims while treating the unique write
              as final ownership.
          - key: services-holds-11
            file: 19.11-parallel-checkout-test.md
            title: 19.11 Prove one winner under parallel checkout
            goal: >-
              Run twenty real concurrent attempts and verify exactly one complete held purchase and
              nineteen truthful conflicts.
          - key: services-holds-12
            file: 19.12-checklist.md
            title: 19.12 Checkout and hold gate
            goal: >-
              Demonstrate atomic multi-provider holds, safe retries, expiry, quota and a twenty-client
              claim race with committed evidence.
      - key: services-payment-confirmation
        dir: 20-payment-and-confirmation
        title: Payment and confirmation
        lessons:
          - key: services-payment-01
            file: 20.01-set-the-scene.md
            title: 20.1 Pay before the hold ends
            goal: Explain how a short calendar hold, a card flow and an asynchronous payment result can race.
          - key: services-payment-02
            file: 20.02-one-payment-many-orders.md
            title: 20.2 One payment, many provider orders
            goal: >-
              Map one PaymentIntent to the checkout attempt, provider Orders, Bookings and refund
              allocations.
          - key: services-payment-03
            file: 20.03-stripe-test-mode.md
            title: 20.3 Set up Stripe test mode
            goal: >-
              Configure test keys, raw-body webhook verification and repeatable success, decline and
              authentication fixtures.
          - key: services-payment-04
            file: 20.04-quiz.md
            title: 20.4 Payment boundary check
            goal: Check snapshot totals, signed asynchronous events, duplicate delivery and expiry decisions.
          - key: services-payment-05
            file: 20.05-payment-intent-from-hold.md
            title: 20.5 Create payment from held snapshots
            goal: >-
              Create exactly one PaymentIntent for the held checkout using server snapshots and an
              external idempotency key.
          - key: services-payment-06
            file: 20.06-webhook-confirms-holds.md
            title: 20.6 Confirm holds from a signed webhook
            goal: >-
              Verify the raw-body Stripe signature and confirm all held provider shares once under
