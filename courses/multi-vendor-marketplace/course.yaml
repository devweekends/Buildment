    modules:
      - key: home-kitchens-introduction
        dir: 01-introduction
        title: Introduction to Sufra
        lessons:
          - key: home-kitchens-intro-01-01
            file: 01.01-what-youre-building.md
            title: '1.1 What you are building: Sufra'
            goal: Meet a home-kitchen marketplace where promises depend on dated windows and cooking capacity.
          - key: home-kitchens-intro-01-02
            file: 01.02-how-to-use-this-course.md
            title: 1.2 How to use this course
            goal: Use lesson steps, evidence notes, and module gates to build and verify Sufra in order.
          - key: home-kitchens-intro-01-03
            file: 01.03-product-and-people.md
            title: 1.3 The product and its people
            goal: Trace a cook's schedule and a diner's lunch purchase to identify actors and permissions.
          - key: home-kitchens-intro-01-04
            file: 01.04-scope.md
            title: '1.4 Scope: what is in and what is out'
            goal: Define the core around windows, capacity, split orders, and resumable status updates.
          - key: home-kitchens-intro-01-05
            file: 01.05-prerequisites-and-date-diagnostic.md
            title: 1.5 Prerequisites and the date diagnostic
            goal: Check JavaScript, HTTP, data-model, and UTC basics before the delivery-window work.
          - key: home-kitchens-intro-01-06
            file: 01.06-course-outline.md
            title: 1.6 Course outline
            goal: Name the four weekly Sufra demos and their evidence.
          - key: home-kitchens-intro-01-07
            file: 01.07-working-rhythm-and-checklist.md
            title: 1.7 Working rhythm and checklist
            goal: Set an offline work rhythm and demonstrate a dated lunch example and first evidence plan.
      - key: home-kitchens-data-model-and-seed
        dir: 05-data-model-and-seed
        title: Data model and seed
        lessons:
          - key: home-kitchens-model-05-01
            file: 05.01-set-the-scene.md
            title: 5.1 Time is the inventory
            goal: >-
              Explain why a home kitchen sells effort for a dated interval and identify the records that
              protect that promise.
          - key: home-kitchens-model-05-02
            file: 05.02-the-stock-trap.md
            title: 5.2 The stock trap
            goal: >-
              Reject a grocery-style dish stock counter by tracing preparation deadlines and shared
              kitchen load across two windows.
          - key: home-kitchens-model-05-03
            file: 05.03-the-ownership-chain.md
            title: 5.3 The ownership chain
            goal: >-
              Map cook and diner ownership through kitchens, dishes, dated windows, embedded claims,
              carts, and split orders.
          - key: home-kitchens-model-05-04
            file: 05.04-kitchen-and-dish-models.md
            title: 5.4 Kitchen and Dish models
            goal: >-
              Define owned kitchens and stockless dishes with validated zones, schedules, preparation,
              load, price, and allergen fields.
          - key: home-kitchens-model-05-05
            file: 05.05-delivery-window-and-capacity-claim-models.md
            title: 5.5 DeliveryWindow and CapacityClaim models
            goal: >-
              Create a unique dated kitchen window whose capacity counter and embedded claim identities
              can change atomically.
          - key: home-kitchens-model-05-06
            file: 05.06-cart-and-order-models.md
            title: 5.6 Cart and Order models
            goal: >-
              Model a one-interval diner cart and per-kitchen orders with purchase snapshots and an
              embedded status timeline.
          - key: home-kitchens-model-05-07
            file: 05.07-seed-three-kitchens-seven-days.md
            title: 5.7 Seed three kitchens and seven days
            goal: >-
              Seed three fictional kitchens, stockless dishes, seven dated sample windows, and two diner
              accounts without resetting claims on retry.
          - key: home-kitchens-model-05-08
            file: 05.08-data-model-quiz.md
            title: 5.8 Data model decisions
            goal: >-
              Choose the correct owner for capacity, dated-window uniqueness, and immutable purchase
              information.
          - key: home-kitchens-model-05-09
            file: 05.09-final-erd-and-checklist.md
            title: 5.9 Final ERD and gate
            goal: >-
              Commit and defend an ERD and idempotent seed that preserve ownership, dated capacity, and
              purchase snapshots.
      - key: home-kitchens-kitchen-api
        dir: 09-kitchen-api
        title: Kitchen API
        lessons:
          - key: home-kitchens-kitchen-09-01
            file: 09.01-set-the-scene.md
            title: 9.1 A kitchen is a schedule
            goal: >-
              Explain why a cook's service area, local weekly hours, capacity, and pauses define more than
              a kitchen address.
          - key: home-kitchens-kitchen-09-02
            file: 09.02-kitchen-profile-and-service-area.md
            title: 9.2 Kitchen profile and service area
            goal: >-
              Create owned kitchen profiles with normalized delivery neighborhoods and a public response
              that excludes private account data.
          - key: home-kitchens-kitchen-09-03
            file: 09.03-weekly-schedule-template.md
            title: 9.3 The weekly schedule template
            goal: >-
              Validate recurring local window rules and capacities without resetting any already dated
              window or paid promise.
          - key: home-kitchens-kitchen-09-04
            file: 09.04-iana-zone-on-the-kitchen.md
            title: 9.4 Time zone on the kitchen
            goal: >-
              Validate a named IANA kitchen zone and protect dated windows and paid orders from silent
              shifts after edits.
          - key: home-kitchens-kitchen-09-05
            file: 09.05-pause-the-kitchen.md
            title: 9.5 Pause the kitchen for today
            goal: >-
              Record a date-specific closure in the kitchen's own zone and stop new offers without
              deleting weekly rules or paid orders.
          - key: home-kitchens-kitchen-09-06
            file: 09.06-ownership-tests-and-checklist.md
            title: 9.6 Ownership tests and gate
            goal: >-
              Prove a cook can manage only their own kitchen while schedule, zone, service area, and dated
              pause stay coherent.
      - key: home-kitchens-delivery-windows
        dir: 14-delivery-windows-and-cutoffs
        title: Delivery windows and cutoffs
        lessons:
          - key: home-kitchens-window-14-01
            file: 14.01-set-the-scene.md
            title: 14.1 The 11:31 lunch order
            goal: Explain why a delivery window can have spare capacity while a slow dish is already too late to promise.
          - key: home-kitchens-window-14-02
            file: 14.02-windows-cutoffs-and-server-clock.md
            title: 14.2 Windows, cutoffs, and the server clock
            goal: >-
              Define dated windows and compute the earlier of a window cutoff and a dish's preparation cutoff using one
              server-owned instant.
          - key: home-kitchens-window-14-03
            file: 14.03-kitchen-zones-and-clock-changes.md
            title: 14.3 A dated window has a time zone
            goal: >-
              Resolve a kitchen's weekly local delivery window into UTC instants for each date and reject ambiguous or
              nonexistent boundaries.
          - key: home-kitchens-window-14-04
            file: 14.04-generate-seven-days.md
            title: 14.4 Generate the next seven days once
            goal: >-
              Expand kitchen weekly rules into dated windows with unique keys and idempotent inserts that preserve
              claims and paid promises.
          - key: home-kitchens-window-14-05
            file: 14.05-per-dish-cutoff.md
            title: 14.5 A slow dish closes first
            goal: >-
              Calculate a dish's effective cutoff from a dated UTC window, preparation time, travel buffer, and the
              kitchen's general cutoff.
          - key: home-kitchens-window-14-06
            file: 14.06-schedule-exceptions.md
            title: 14.6 Close or change one day safely
            goal: >-
              Add dated kitchen exceptions for closures and special windows while preserving the weekly template and
              paid order history.
          - key: home-kitchens-window-14-07
            file: 14.07-fake-clock-boundaries.md
            title: 14.7 Make the cutoff boundary fail on purpose
            goal: >-
              Use a fixed server clock to test one second before, exactly at, and after dish cutoff, plus a clock-change
              date and generator retry.
          - key: home-kitchens-window-14-08
            file: 14.08-window-cutoff-quiz.md
            title: 14.8 Window and cutoff decisions
            goal: Apply dated-window generation, per-dish cutoffs, exceptions, and retry safety to kitchen scenarios.
          - key: home-kitchens-window-14-09
            file: 14.09-recap-and-checklist.md
            title: 14.9 Delivery-window gate
            goal: >-
              Demonstrate a dated seven-day window list, per-dish cutoffs, exception handling, and exact-boundary tests
              without resetting held capacity.
      - key: home-kitchens-browse-by-window
        dir: 15-browse-by-window-api
        title: Browse by window API
        lessons:
          - key: home-kitchens-browse-15-01
            file: 15.01-set-the-scene.md
            title: 15.1 Window first
            goal: >-
              Explain why a diner chooses a dated delivery interval before seeing kitchens and dishes that
              can still serve it.
          - key: home-kitchens-browse-15-02
            file: 15.02-availability-query.md
            title: 15.2 The availability query
            goal: >-
              Filter dated windows by interval, current server time, capacity, closures, open kitchen
              status, and service area.
          - key: home-kitchens-browse-15-03
            file: 15.03-kitchens-and-dishes-without-n-plus-one.md
            title: 15.3 Kitchens and dishes without N+1
            goal: >-
              Join each candidate window to its own kitchen and active dishes in one aggregation without
              exposing private fields.
          - key: home-kitchens-browse-15-04
            file: 15.04-hide-dishes-past-cutoff.md
            title: 15.4 Hide dishes past their own cutoff
            goal: >-
              Calculate each dish's dated effective cutoff in the browse aggregation and retain only
              timely offers.
          - key: home-kitchens-browse-15-05
            file: 15.05-filters-and-pagination.md
            title: 15.5 Filters and pagination
            goal: >-
              Apply kitchen, dietary, and kitchen-local weekday filters before stable cursor pagination of
              timely offers.
          - key: home-kitchens-browse-15-06
            file: 15.06-query-plan-and-checklist.md
            title: 15.6 Query plan and gate
            goal: >-
              Demonstrate correct window-first offers and explain the aggregation's indexed plan, privacy
              boundary, and stale-result limit.
      - key: home-kitchens-cart-api
        dir: 17-cart-api
        title: Cart API
        lessons:
          - key: home-kitchens-cart-17-01
            file: 17.01-set-the-scene.md
            title: 17.1 One window per cart
            goal: >-
              Explain why a diner may combine kitchens only when their dated windows match one selected
              delivery interval.
          - key: home-kitchens-cart-17-02
            file: 17.02-add-to-cart-with-time-checks.md
            title: 17.2 Add to cart with time checks
            goal: >-
              Validate ownership, selected interval, kitchen service, quantity, and the dish's current
              deadline before adding a line.
          - key: home-kitchens-cart-17-03
            file: 17.03-change-the-window.md
            title: 17.3 Change the window
            goal: >-
              Preview every cart line against a new dated interval, then apply the change only after the
              diner reviews conflicts.
          - key: home-kitchens-cart-17-04
            file: 17.04-load-per-kitchen.md
            title: 17.4 Load per kitchen
            goal: >-
              Calculate each kitchen's requested cooking load from trusted dish settings and explain why
              the cart still has no capacity claim.
          - key: home-kitchens-cart-17-05
            file: 17.05-user-scoping-test.md
            title: 17.5 User scoping test
            goal: >-
              Prove that every cart read and mutation is scoped to the authenticated diner, including
              revision conflict and preview routes.
          - key: home-kitchens-cart-17-06
            file: 17.06-cart-api-checklist.md
            title: 17.6 Cart API gate
            goal: >-
              Show a private, revision-safe cart that accepts only timely dishes for one selected interval
              and reports load per kitchen.
      - key: home-kitchens-checkout-capacity-orders
        dir: 19-checkout-capacity-and-orders
        title: Checkout, capacity claims and orders
        lessons:
          - key: home-kitchens-checkout-19-01
            file: 19.01-set-the-scene.md
            title: 19.1 Two diners, one last spot
            goal: Trace a race for the last cooking units and define checkout's promise before payment.
          - key: home-kitchens-checkout-19-02
            file: 19.02-atomic-conditional-claim.md
            title: 19.2 Claim capacity in one window update
            goal: Reserve cooking units with a conditional MongoDB update and record the claim identity.
          - key: home-kitchens-checkout-19-03
            file: 19.03-all-or-nothing-across-kitchens.md
            title: 19.3 All or nothing across kitchens
            goal: Choose a durable compensating release for a multi-kitchen claim attempt.
          - key: home-kitchens-checkout-19-04
            file: 19.04-capacity-claims-as-holds.md
            title: 19.4 Capacity claims as holds
            goal: Create bounded held claims and implement idempotent release before payment confirmation.
          - key: home-kitchens-checkout-19-05
            file: 19.05-split-and-snapshot-orders.md
            title: 19.5 Split and snapshot orders
            goal: Snapshot one draft order per kitchen while keeping one checkout payment total.
          - key: home-kitchens-checkout-19-06
            file: 19.06-recheck-cutoff-at-claim.md
            title: 19.6 Recheck the cutoff at claim time
            goal: Reject a claim when the server clock reaches the general or dish cutoff.
          - key: home-kitchens-checkout-19-07
            file: 19.07-twenty-parallel-checkouts.md
            title: 19.7 Twenty parallel checkouts
            goal: Verify capacity, release, and payment invariants under concurrent claims and retries.
          - key: home-kitchens-checkout-19-08
            file: 19.08-checkout-decision-quiz.md
            title: 19.8 Checkout decisions
            goal: Apply capacity, expiry, partial-failure, and retry rules to checkout scenarios.
          - key: home-kitchens-checkout-19-09
            file: 19.09-recap-and-checklist.md
            title: 19.9 Capacity checkout gate
            goal: Demonstrate that checkout cannot overbook or charge for an incomplete multi-kitchen cart.
      - key: home-kitchens-payment-processing
        dir: 20-payment-processing
        title: Payment processing
        lessons:
          - key: home-kitchens-payment-20-01
            file: 20.01-set-the-scene.md
            title: 20.1 One payment, two kitchens
            goal: >-
              Trace one diner payment across separate kitchen holds and explain why a browser success
              message cannot place either order.
          - key: home-kitchens-payment-20-02
            file: 20.02-one-payment-intent.md
            title: 20.2 One PaymentIntent for a prepared attempt
            goal: >-
              Create or recover one Stripe PaymentIntent from the attempt's fixed server total and expose
              it only to that diner.
          - key: home-kitchens-payment-20-03
            file: 20.03-verify-and-record-webhooks.md
            title: 20.3 Verify and record webhooks
            goal: >-
              Verify Stripe's signature on the raw body and durably deduplicate payment events before
              reconciliation.
          - key: home-kitchens-payment-20-04
            file: 20.04-payment-decision-quiz.md
            title: 20.4 Payment decision check
            goal: >-
              Decide what may become payable or actionable when payment, capacity and kitchen order states
              disagree.
          - key: home-kitchens-payment-20-05
            file: 20.05-confirm-claims-and-orders.md
            title: 20.5 Confirm both kitchens after payment
            goal: >-
              Reconcile a verified paid intent into confirmed claims and placed kitchen orders without
              exposing a partial cart.
          - key: home-kitchens-payment-20-06
            file: 20.06-late-success-reconciliation.md
            title: 20.6 Reconcile a late payment success
            goal: >-
              Keep kitchens out of a paid attempt whose holds expired, and start a durable full-refund
              path.
          - key: home-kitchens-payment-20-07
            file: 20.07-one-kitchen-partial-refund.md
            title: 20.7 Refund one kitchen share
            goal: >-
              Refund a rejected kitchen's stored share of the single paid PaymentIntent without refunding
              or cancelling the other kitchen.
          - key: home-kitchens-payment-20-08
            file: 20.08-replay-and-race-tests.md
            title: 20.8 Replay and race tests
            goal: >-
              Exercise duplicate events, lost responses, expired holds, partial confirmation, and refund
              retries against the payment boundary.
          - key: home-kitchens-payment-20-09
            file: 20.09-payment-checklist.md
            title: 20.9 Payment processing gate
            goal: >-
              Prove one server-priced payment, signed event handling, two-kitchen confirmation,
              late-success recovery, and one-kitchen refunds.
      - key: home-kitchens-async-jobs
        dir: 21-async-jobs-and-queues
        title: Async jobs and queues
        lessons:
          - key: home-kitchens-jobs-21-01
            file: 21.01-set-the-scene.md
            title: 21.1 The checkout request that waited too long
            goal: >-
              Explain why dated-window generation, hold expiry and cook notification need durable work
              outside the checkout request.
          - key: home-kitchens-jobs-21-02
            file: 21.02-when-to-queue.md
            title: 21.2 When to queue
            goal: >-
              Choose synchronous decisions, durable delayed jobs, or notifications based on what the diner
              must know before paying.
          - key: home-kitchens-jobs-21-03
            file: 21.03-worker-process.md
            title: 21.3 Run a separate BullMQ worker
            goal: >-
              Connect a queue producer and worker to Redis while keeping job payloads small and domain
              state in MongoDB.
          - key: home-kitchens-jobs-21-04
            file: 21.04-queue-decisions-quiz.md
            title: 21.4 Queue decisions check
            goal: >-
              Choose the correct synchronous or queued boundary for capacity, generation, expiry and
              notification.
          - key: home-kitchens-jobs-21-05
            file: 21.05-nightly-window-generation.md
            title: 21.5 Generate the rolling window horizon
            goal: >-
              Schedule M14's idempotent dated-window generator and recover missed runs without resetting
              existing claims.
          - key: home-kitchens-jobs-21-06
            file: 21.06-expire-unpaid-holds.md
            title: 21.6 Expire unpaid holds
            goal: >-
              Wake at a claim deadline, release only still-held units, and recover missed delayed jobs
              with a database scan.
          - key: home-kitchens-jobs-21-07
            file: 21.07-notify-the-cook.md
            title: 21.7 Notify the cook after placement
            goal: >-
              Queue one kitchen-scoped notification after complete paid placement and keep retries from
              sending a second job promise.
          - key: home-kitchens-jobs-21-08
            file: 21.08-async-jobs-checklist.md
            title: 21.8 Async jobs gate
            goal: >-
              Show a separate worker, safe delayed release, repeatable window generation, and
              kitchen-scoped alert recovery.
      - key: home-kitchens-order-lifecycle
        dir: 22-kitchen-acceptance-and-lifecycle
        title: Kitchen acceptance and order lifecycle
        lessons:
          - key: home-kitchens-m22-01
            file: 22.01-set-the-scene.md
            title: '22.1 The cook who never answered'
            goal: Explain why every order needs an acceptance deadline and a visible state.
          - key: home-kitchens-m22-02
            file: 22.02-state-machine.md
            title: '22.2 The kitchen order state machine'
            goal: >-
              Draw the allowed transitions, the actor for each, and the terminal rejected and cancelled
              states.
          - key: home-kitchens-m22-03
            file: 22.03-transitions-with-preconditions.md
            title: '22.3: Transitions with preconditions'
            goal: >-
              Change status and append one sequenced timeline event in a single conditional update, and
              reject illegal moves with 409.
          - key: home-kitchens-m22-04
            file: 22.04-acceptance-deadline.md
            title: '22.4: The acceptance deadline'
            goal: >-
              Compute acceptBy in UTC from the kitchen rule and auto-reject an ignored order with a
              delayed job.
          - key: home-kitchens-m22-05
            file: 22.05-reject-release-and-refund.md
            title: '22.5: Reject, release and refund'
            goal: >-
              Release only this order's capacity claim and refund only this kitchen's paid share, once.
          - key: home-kitchens-m22-06
            file: 22.06-kitchen-board-actions.md
            title: '22.6: The kitchen board'
            goal: >-
              Show each kitchen its orders by window in its own time zone with the actions its state
              allows.
          - key: home-kitchens-m22-07
            file: 22.07-checklist.md
            title: '22.7: Lifecycle gate and timeline evidence'
            goal: >-
              Demonstrate an accepted order and an ignored order, including the release, refund and
              timeline evidence.
      - key: home-kitchens-why-mongodb
        dir: 03-why-mongodb-for-a-kitchen
        title: Why MongoDB for a kitchen
        lessons:
          - key: home-kitchens-why-mongodb-01
            file: 03.01-set-the-scene.md
            title: '3.1 Rules, windows and claims are three kinds of time data'
            goal: >-
              Separate a repeating kitchen rule, a dated delivery window and a capacity claim so each one answers a different question about time.
          - key: home-kitchens-why-mongodb-02
            file: 03.02-relational-vs-document.md
            title: '3.2 Relational and document shapes for a kitchen schedule'
            goal: >-
              Compare a table-and-constraint model with a document model for dated windows, per-dish cutoffs and claims, and name where each one wins.
          - key: home-kitchens-why-mongodb-03
            file: 03.03-decision-and-erd.md
            title: '3.3 The decision for Sufra and the first ERD'
            goal: >-
              Commit a defended database decision, then draft the Kitchen, Dish, DeliveryWindow, claim and order relationships in docs/erd-draft.md.
          - key: home-kitchens-why-mongodb-04
            file: 03.04-checklist.md
            title: '3.4 Data model decision gate'
            goal: >-
              Defend the store choice and the first ERD against three challenges, with a committed draft and a test that proves one database rule.
      - key: home-kitchens-authorization
        dir: 08-authorization-and-isolation
        title: Authorization and isolation
        lessons:
          - key: home-kitchens-authorization-01
            file: 08.01-set-the-scene.md
            title: '8.1 Whose kitchen, whose order?'
            goal: >-
              Separate a role check from an ownership check, and decide which fields each participant in an order may see.
          - key: home-kitchens-authorization-02
            file: 08.02-object-checks.md
            title: '8.2 Object checks on kitchens, dishes and orders'
            goal: >-
              Build a role guard and an ownership helper that follow kitchen, dish and order records to their owner before any read or write.
          - key: home-kitchens-authorization-03
            file: 08.03-matrix-and-tests.md
            title: '8.3 The authorization matrix and cross-kitchen tests'
            goal: >-
              Write the actor, resource and action matrix for Sufra, then prove it with two cooks, two diners and tests that fail without leaking data.
          - key: home-kitchens-authorization-04
            file: 08.04-checklist.md
            title: '8.4 Isolation gate'
            goal: >-
              Prove that a second cook and a second diner are refused without learning anything, and that each participant sees only their own fields.
      - key: home-kitchens-open-kitchen
        dir: 10-open-your-kitchen
        title: Open your kitchen
        lessons:
          - key: home-kitchens-open-kitchen-01
            file: 10.01-set-the-scene.md
            title: '10.1 The cook who has no kitchen page'
            goal: >-
              Resolve a cook's onboarding state from the server so a missing, unfinished or paused kitchen each leads somewhere useful.
          - key: home-kitchens-open-kitchen-02
            file: 10.02-kitchen-form-and-schedule.md
            title: '10.2 Kitchen form and the phone-width schedule grid'
            goal: >-
              Build the profile form, a weekday by window capacity editor that survives a 360 pixel screen, and the hygiene declaration step.
          - key: home-kitchens-open-kitchen-03
            file: 10.03-hygiene-and-checklist.md
            title: '10.3 Onboarding gate on a phone'
            goal: >-
              Demonstrate the onboarding path from a missing kitchen to a saved profile, weekly capacity and dated declaration at 360 pixels.
      - key: home-kitchens-dishes-api
        dir: 11-manage-dishes-api
        title: Manage dishes API
        lessons:
          - key: home-kitchens-dishes-api-01
            file: 11.01-set-the-scene.md
            title: '11.1 A dish is a promise of time'
            goal: >-
              Read preparation minutes and load units as two different promises, using maqluba and falafel in the same lunch window.
          - key: home-kitchens-dishes-api-02
            file: 11.02-dish-crud-and-validation.md
            title: '11.2 Dish fields, validation and ownership'
            goal: >-
              Validate preparation, load, order limit, allergen and weekday fields on a dish while the write path refuses any cook but the owner.
          - key: home-kitchens-dishes-api-03
            file: 11.03-fit-price-and-changes.md
            title: '11.3 A dish that cannot fit, and a price that can change'
            goal: >-
              Refuse a dish whose load exceeds the largest window, and edit prices without rewriting what a diner already paid.
          - key: home-kitchens-dishes-api-04
            file: 11.04-checklist.md
            title: '11.4 Dish API gate'
            goal: >-
              Prove dish writes are validated, owner scoped, refused when they cannot fit any window, and invisible to past order prices.
      - key: home-kitchens-dashboard
        dir: 12-kitchen-dashboard
        title: Kitchen dashboard
        lessons:
          - key: home-kitchens-dashboard-01
            file: 12.01-set-the-scene.md
            title: '12.1 The kitchen dashboard'
            goal: >-
              Compose one cook screen from dishes by status, today's windows with remaining units and cutoffs, and orders with server derived actions.
          - key: home-kitchens-dashboard-02
            file: 12.02-checklist.md
            title: '12.2 Kitchen dashboard gate'
            goal: >-
              Prove the dashboard and every route behind it serve one cook's kitchen only, including counts, identifiers and actions.
      - key: home-kitchens-find-a-meal
        dir: 16-find-a-meal
        title: Find a meal
        lessons:
          - key: home-kitchens-find-a-meal-01
            file: 16.01-set-the-scene.md
            title: '16.1 Lunch on a phone, in a window'
            goal: >-
              Explain how the diner browse screen turns server facts about windows, kitchens and dish cutoffs into a decision a hungry person can make on a phone in twenty seconds.
          - key: home-kitchens-find-a-meal-02
            file: 16.02-window-picker-and-kitchen-cards.md
            title: '16.2 Window picker, kitchen cards and dish lists'
            goal: >-
              Build the diner browse screen at 360 pixels from the browse response, with dated window targets, server-supplied deadlines and per-dish cutoff guards.
          - key: home-kitchens-find-a-meal-03
            file: 16.03-empty-states-and-checklist.md
            title: '16.3 Find-a-meal gate'
            goal: >-
              Demonstrate the diner browse screen at 360 pixels with a slow dish expiring, a full window suggesting the next one, and every deadline traceable to server data.
      - key: home-kitchens-cart-ui
        dir: 18-your-cart
        title: Your cart
        lessons:
          - key: home-kitchens-cart-ui-01
            file: 18.01-set-the-scene.md
            title: '18.1 One cart, one window, several kitchens'
            goal: >-
              Explain why the cart page groups lines by kitchen while keeping one delivery window, and why a window change is a review the diner must see.
          - key: home-kitchens-cart-ui-02
            file: 18.02-cart-page-and-revalidation.md
            title: '18.2 Cart rows, load totals and window changes'
            goal: >-
              Build grouped cart rows, per-kitchen load and money totals, and a change-window flow that previews conflicts, requires approval and survives a stale revision.
          - key: home-kitchens-cart-ui-03
            file: 18.03-checklist.md
            title: '18.3 Cart UI gate'
            goal: >-
              Demonstrate a grouped cart at 360 pixels, a deliberate line removal, a window change that drops one line after approval, and a clear error when the window moved under the diner.
      - key: home-kitchens-live-tracking
        dir: 23-live-order-tracking
        title: Live order tracking
        lessons:
          - key: home-kitchens-live-tracking-01
            file: 23.01-set-the-scene.md
            title: '23.1 Lunch on a weak connection'
            goal: >-
              Show what a diner misses when the phone drops signal while the meal cooks, and why a refresh button cannot close the gap.
          - key: home-kitchens-live-tracking-02
            file: 23.02-transport-decision.md
            title: '23.2 Polling, long polling, SSE and WebSockets'
            goal: >-
              Compare four ways to move an order update to a phone, then record why Sufra pushes with SSE and sends commands as normal requests.
          - key: home-kitchens-live-tracking-03
            file: 23.03-sse-stream-and-snapshot.md
            title: '23.3 One stream per user, snapshot then deltas'
            goal: >-
              Serve one authorized text/event-stream per diner with a retry hint and heartbeat, send a snapshot on connect, then deltas fanned out through Redis after each committed transition.
          - key: home-kitchens-live-tracking-04
            file: 23.04-fallback-and-tracking-ui.md
            title: '23.4 Polling fallback and the tracking screen'
            goal: >-
              Add a cursor-based timeline query with an ETag, back off and pause it while the tab is hidden, and build a tracking screen that stays honest and usable on a 360 pixel phone.
          - key: home-kitchens-live-tracking-05
            file: 23.05-checklist.md
            title: '23.5 Offline test and tracking gate'
            goal: >-
              Prove the tracking feature with a recorded sixty second offline test that catches up in order with no duplicates, and explain why a lost pub/sub message cannot lose an order status.
      - key: home-kitchens-cache-search
        dir: 24-cache-and-search
        title: Cache and search
        lessons:
          - key: home-kitchens-cache-search-01
            file: 24.01-set-the-scene.md
            title: '24.1 What may be cached, and what never is'
            goal: >-
              Separate the menu data Sufra may cache from the capacity and cutoff state it must read fresh, and explain why the clock and concurrent claims make a cached availability answer unsafe.
          - key: home-kitchens-cache-search-02
            file: 24.02-cache-and-search.md
            title: '24.2 Cache menus, bust on save, search dishes'
            goal: >-
              Implement a menu cache with write-through invalidation, a fragment test that keeps capacity out, a MongoDB text index on dish names in both scripts, and a measurement harness.
          - key: home-kitchens-cache-search-03
            file: 24.03-checklist.md
            title: '24.3 Cache and search gate'
            goal: >-
              Demonstrate menu invalidation on save, a fragment free of capacity, recorded before and after measurements, a working fallback with Redis stopped, and dish search in both scripts.
      - key: home-kitchens-deploy
        dir: 25-deploy
        title: Deploy
        lessons:
          - key: home-kitchens-deploy-01
            file: 25.01-set-the-scene.md
            title: '25.1 Deploy the API, worker and client'
            goal: >-
              Describe the production shape Sufra needs: three supervised processes, two managed services, HTTPS everywhere and a stream that a proxy must not hold.
          - key: home-kitchens-deploy-02
            file: 25.02-deploy-and-streams.md
            title: '25.2 HTTPS, secrets, and streams in production'
            goal: >-
              Deploy the API, worker and client on HTTPS with secrets in env, then prove the order stream passes the proxy unbuffered and survives an API restart.
          - key: home-kitchens-deploy-03
            file: 25.03-checklist.md
            title: '25.3 Deploy gate and restart survival'
            goal: >-
              Show a live HTTPS Sufra where secrets stay in env, the stream passes the proxy unbuffered, and an API restart heals a diner's tracking screen on its own.
      - key: home-kitchens-capacity-load
        dir: 26-capacity-under-load
        title: Capacity under load
        lessons:
          - key: home-kitchens-capacity-load-01
            file: 26.01-set-the-scene.md
            title: '26.1 The Friday lunch rush'
            goal: >-
              See a busy Friday window from the cook's phone and the diner's phone, and name the two failure families a rush exposes: double promises and stuck units.
          - key: home-kitchens-capacity-load-02
            file: 26.02-two-clocks-and-holds.md
            title: '26.2 Payment time, cutoff time and hold expiry'
            goal: >-
              Separate the kitchen cutoff from the payment clock, decide the late-payment case, and bound every hold so a held unit cannot outlive the window's usefulness.
          - key: home-kitchens-capacity-load-03
            file: 26.03-reconciliation-and-evidence.md
            title: '26.3 Reconcile claims and prove the race'
            goal: >-
              Build a reconciliation job that explains every window counter from its claims, then run parallel checkouts and a cutoff race on the deployed app.
          - key: home-kitchens-capacity-load-04
            file: 26.04-checklist.md
            title: '26.4 Capacity evidence gate'
            goal: >-
              Show a deployed window that fills exactly to capacity, a cutoff that refuses at the boundary, and a reconciliation report that explains every counter.
      - key: home-kitchens-closing
        dir: 99-closing
        title: Closing and capstone
        lessons:
          - key: home-kitchens-closing-01
            file: 99.01-ship-and-document.md
            title: '99.1 Ship and document Sufra'
            goal: >-
              Write the README, .env.example, architecture and lifecycle diagrams, evidence index and five-minute demo script that make the deployed Sufra reviewable.
          - key: home-kitchens-closing-02
            file: 99.02-demo-and-viva.md
            title: '99.2 Five-minute demo and capstone defense'
            goal: >-
              Record a five-minute two-device demo that survives a dropped connection, then defend seven architecture decisions without notes.
      - key: home-kitchens-dish-photos
        dir: 13-dish-photos
        title: Dish photos
        lessons:
          - key: home-kitchens-dish-photos-01
            file: 13.01-set-the-scene.md
            title: '13.1 A diner cannot smell the maqluba'
            goal: >-
              Read why a dish photo is a claim about real food, and why the bytes live in Cloudinary while the dish document keeps only a URL and a public id.
          - key: home-kitchens-dish-photos-02
            file: 13.02-upload-and-small-images.md
            title: '13.2 Upload dish photos and serve small ones'
            goal: >-
              Build the multipart photo route, the Dish photo fields, the conditional destroy and the delivery widths that keep a browse card small on a weak connection.
          - key: home-kitchens-dish-photos-03
            file: 13.03-checklist.md
            title: '13.3 Dish photo gate'
            goal: >-
              Prove photo writes are typed, size limited, capped at four, owner scoped, and that a replaced photo leaves an older order snapshot readable.
