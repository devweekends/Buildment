              Create repeatable fictional workshops, artisans, pieces and a private open request with
              useful boundary cases.
          - key: handmade-m5-13
            file: 05.13-final-erd-recap-and-checklist.md
            title: '5.13: Final ERD, recap and checklist'
            goal: >-
              Commit an ERD and evidence that makes seller ownership, maker credit and future commission
              state distinct.
      - key: handmade-custom-requests
        dir: 22-custom-requests
        title: Custom requests
        lessons:
          - key: handmade-custom-request-path
            file: 22.01-set-the-scene.md
