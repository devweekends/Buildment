        dir: 05-data-model-and-seed
        title: Digital product data model and seed
        lessons:
          - key: digital-goods-m5-01
            file: 05.01-set-the-scene.md
            title: '5.1: Two chains'
            goal: Draw creator ownership and buyer entitlement paths without exposing private files.
          - key: digital-goods-m5-02
            file: 05.02-the-purchase-is-a-link-trap.md
            title: '5.2: The purchase-is-a-link trap'
            goal: Explain why a download URL cannot enforce buyer identity, licence limits, expiry, or revocation.
          - key: digital-goods-m5-03
            file: 05.03-users-studios-and-products.md
            title: '5.3: Users, studios and products'
            goal: Create owned studios and products with priced, versioned licence options.
          - key: digital-goods-m5-04
            file: 05.04-productfile-versions.md
            title: '5.4: ProductFile versions'
            goal: Model private file versions and keep storage identifiers out of public JSON.
          - key: digital-goods-m5-05
            file: 05.05-cart-checkout-and-order.md
            title: '5.5: Cart, Checkout and Order'
            goal: Separate cart intent, one payment, and immutable per-creator order snapshots.
          - key: digital-goods-m5-06
            file: 05.06-license-and-downloadgrant.md
            title: '5.6: License and DownloadGrant'
            goal: Store durable entitlement separately from an auditable short-lived delivery attempt.
          - key: digital-goods-m5-07
            file: 05.07-recap-and-checklist.md
            title: '5.7: Seed, inspect and final ERD'
            goal: Seed two creators and buyers, verify isolation, and commit the public/private ERD.
      - key: digital-goods-checkout-orders
        dir: 18-checkout-and-orders
        title: Checkout and creator orders
        lessons:
          - key: digital-goods-m18-01
            file: 18.01-set-the-scene.md
            title: '18.1: Orders before payment'
            goal: >-
              Create pending seller orders under one Checkout without treating the browser redirect as
              paid fulfillment.
          - key: digital-goods-m18-02
            file: 18.02-the-snapshot-trap.md
            title: '18.2: The snapshot trap'
            goal: >-
              Freeze price, license type, limits and terms version on every OrderLine before payment
              begins.
          - key: digital-goods-m18-03
            file: 18.03-checkout-route.md
            title: '18.3: Checkout route'
            goal: Reprice on the server and create one Checkout with one pending Order per Studio.
          - key: digital-goods-m18-04
            file: 18.04-snapshot-lines-and-immutability.md
            title: '18.4: Snapshot lines and the immutability test'
            goal: Demonstrate that a creator price or terms edit cannot rewrite a pending or paid OrderLine.
          - key: digital-goods-m18-05
            file: 18.05-order-routes-and-checklist.md
            title: '18.5: Order routes and checklist'
            goal: >-
              Prove buyer and creator order isolation, pending-state honesty, server totals and immutable
              snapshots.
      - key: digital-goods-fulfilment
        dir: 20-instant-fulfilment
        title: Instant fulfilment and license keys
        lessons:
          - key: digital-goods-fulfilment-path
            file: 20.01-set-the-scene.md
            title: Fulfil a paid checkout exactly once
            goal: Use verified payment and unique per-line grants to survive replay and partial crashes
          - key: digital-goods-fulfilment-gate
            file: 20.02-checklist.md
            title: Fulfilment gate and replay evidence
            goal: Prove one grant per paid line, invalid-signature denial, privacy and replay recovery
      - key: digital-goods-library-downloads
        dir: 21-library-and-downloads
        title: Your library and signed downloads
        lessons:
          - key: digital-goods-download-path
            file: 21.01-set-the-scene.md
            title: Build the library and private download route
            goal: >-
              Authorize each download against active grant, purchased file version, refund block and persisted limit
              before issuing an expiring private URL
          - key: digital-goods-download-gate
            file: 21.02-checklist.md
            title: Library and download gate
            goal: Prove public/private serialization, cross-buyer denial, expiry, revocation and outage recovery
      - key: digital-goods-private-files
        dir: 13-previews-and-private-files
        title: Previews and private files
        lessons:
          - key: digital-goods-private-upload-path
            file: 13.01-set-the-scene.md
            title: Separate public previews from private deliverables
            goal: >-
              Upload public previews and authenticated versioned raw files with creator isolation and whitelist
              serialization
          - key: digital-goods-private-upload-gate
            file: 13.02-checklist.md
            title: Public-preview and private-file gate
            goal: >-
              Prove anonymous preview, denied unsigned private URL, creator isolation, publish rule and partial-failure
              recovery
      - key: digital-goods-payment-processing
        dir: 19-payment-processing
        title: Payment processing
        lessons:
          - key: digital-goods-19-01
            file: 19.01-set-the-scene.md
            title: '19.1: Test mode and Payment Intents'
            goal: >-
              Connect one server-priced Checkout to one test PaymentIntent without treating a browser
              redirect as proof.
          - key: digital-goods-19-02
            file: 19.02-webhooks-and-verified-events.md
            title: '19.2: Webhooks and verified events'
            goal: >-
              Explain signatures, raw bodies, retries and duplicate deliveries, and choose which event
              is safe to act on.
          - key: digital-goods-19-03
            file: 19.03-payment-intent-route.md
            title: '19.3: Price and create the PaymentIntent'
            goal: >-
              Create the intent from the frozen Checkout total with an idempotency key and refuse every
              client-supplied amount.
          - key: digital-goods-19-04
            file: 19.04-webhook-route.md
            title: '19.4: Verify and record the event'
            goal: >-
              Verify the signature before reading metadata, match the stored Checkout, and record the
              event without granting files.
          - key: digital-goods-19-05
            file: 19.05-checklist.md
            title: '19.5: Payment gate and test-mode evidence'
            goal: >-
              Prove success, decline, invalid signature, duplicate delivery and amount mismatch in test
              mode.
