slug: multi-vendor-marketplace
repositoryPublish: false
repositoryTargetSlug: freshmarket-multi-vendor-marketplace-v3
repositoryEditorialAudit: advisory
legacySourceAudit: true
title: Multi-vendor Marketplace
description: >-
  Build and deploy a multi-vendor marketplace through a product-specific track. Your assigned or selected track
  determines the data model, build steps, assessments, and capstone you see.
projectGoal: >-
  Ship a live marketplace with multiple independent sellers or providers, a customer journey, a safe checkout, and
  product-specific reliability checks. The chosen variant determines its inventory, booking, fulfilment, or access
  rules and the evidence required at the final gate.
difficulty: Medium
estimatedHours: 240
category: tech
coverUrl: https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80
family: multi-vendor-marketplace
availableVariantSlugs:
  - grocery
modules:
  - key: module-01-introduction
    dir: 01-introduction
    title: Introduction
    lessons:
      - key: lesson-01-01-what-youre-building
        file: 01.01-what-youre-building.md
        title: 1.1 — What you're building
        goal: >-
          Local buyers and sellers need one place to meet online. You'll build a multi-vendor grocery marketplace —
          sellers list products, buyers shop across shops in one cart, checkout once.
      - key: lesson-01-02-how-to-use-this-course
        file: 01.02-how-to-use-this-course.md
        title: 1.2 — How to use this course
        goal: >-
          This is not a tutorial you copy-paste from start to finish. It's a **guided build**: each chapter teaches an
          idea in depth, compares the approaches a professional would weigh, and then walks you through implementing it
          on **your own project**.
      - key: lesson-01-03-the-product-and-its-people
        file: 01.03-the-product-and-its-people.md
        title: 1.3 — The product and its people
        goal: >-
          Before you meet the vendors and customers, meet the **product** — the thing you're building, described the way
          a user would experience it.
      - key: lesson-01-04-scope
        file: 01.04-scope.md
        title: 1.4 — Scope
        goal: >-
          Scope is a contract between you and the course. **In scope** is what you must ship to finish. **Out of scope**
          is what you must not spend four weeks building instead — even if it sounds impressive on LinkedIn.
      - key: lesson-01-05-prerequisites
        file: 01.05-prerequisites.md
        title: 1.5 — Before you start
        goal: >-
          This table is the **floor** the course stands on — not a gauntlet, not a reading list of everything you'll
          learn anyway. It's the few things you should already be comfortable with so Chapter 2 doesn't stop on hour one
          to explain what `async/await` means.
      - key: lesson-01-06-course-outline
        file: 01.06-course-outline.md
        title: 1.6 — Course outline
        goal: A four-week path from a working app to a live marketplace, with one demo target for each week.
      - key: lesson-01-07-your-working-rhythm
        file: 01.07-your-working-rhythm.md
        title: 1.7 — Your working rhythm
        goal: Four weeks is long enough for good habits to matter. This page is the last read before the Chapter 1 gate.
      - key: lesson-01-08-visual-roadmap-and-demo-frames
        file: 01.08-visual-roadmap-and-demo-frames.md
        title: 1.8 — Visual roadmap and demo frames
        goal: >-
          Before coding, see exactly what each major milestone should look like in the browser and in architecture form.
          This removes guesswork and keeps your progress concrete.
      - key: lesson-01-09-beginner-questions-and-reading-roadmap
        file: 01.09-beginner-questions-and-reading-roadmap.md
        title: 1.9 — Beginner questions and reading roadmap
        goal: >-
          A deeper beginner-support layer: long-form answers to common doubts plus a production-focused reading roadmap
          for the full course.
      - key: lesson-01-10-engineering-thinking-playbook
        file: 01.10-engineering-thinking-playbook.md
        title: 1.10 — Engineering thinking playbook
        goal: >-
          A practical playbook for making decisions like an engineer while you build this course project: problem
          framing, trade-offs, verification, and production reasoning.
      - key: lesson-01-11-checklist
        file: 01.11-checklist.md
        title: 1.11 — Checklist and learning log
        goal: >-
          Gate for Chapter 1 — Introduction. Confirm you understand the product, scope, and rhythm before starting the
          repo in Chapter 2.
  - key: module-02-project-skeleton
    dir: 02-project-skeleton
    title: Project skeleton
    lessons:
      - key: lesson-02-01-set-the-scene
        file: 02.01-set-the-scene.md
        title: 2.1 — Set the scene
        goal: >-
          You cleared the introduction checklist. You know what you're building, how the course gates progress, and
          what's in scope. **Nothing in your marketplace repo exists yet** — or it shouldn't, if you're starting clean.
      - key: lesson-02-02-why-structure-matters
        file: 02.02-why-structure-matters.md
        title: 2.2 — Why structure matters
        goal: >-
          Folder structure feels like housekeeping. It isn't. It's **architecture written in paths** — the decision
          about where auth lives, where product routes live, and where shared database code lives. Get it wrong on day
          one and you'll either refactor under pressure mid-course or menta
      - key: lesson-02-03-what-youll-build
        file: 02.03-what-youll-build.md
        title: 2.3 — What you'll build
        goal: >-
          This sub-chapter is the blueprint. No code yet — just the **tree** you'll grow over the next twelve build
          steps. Read it once now; return after 2.16 and confirm your repo matches.
      - key: lesson-02-04-layer-vs-module
        file: 02.04-layer-vs-module.md
        title: 2.4 — Layer vs module
        goal: >-
          You need a **mandated decision** before creating folders. This sub-chapter compares the two mainstream
          Node/Express layouts honestly, then tells you which one this course requires — and why changing your mind
          later breaks the guide.
      - key: lesson-02-05-client-vs-server
        file: 02.05-client-vs-server.md
        title: 2.5 — Client vs server
        goal: >-
          Full-stack beginners often mix **what runs in the browser** with **what runs on your machine in Node**. This
          sub-chapter draws the line once, using **your** `client/` and `server/` folders — not a generic diagram you'll
          forget.
      - key: lesson-02-06-prime-your-thinking
        file: 02.06-prime-your-thinking.md
        title: 2.6 — Prime your thinking
        goal: >-
          Before you run `git init` and create folders, read **one** short piece on Node project structure so the
          module-based choice in 2.4 isn't only this course's opinion — it's a decision you've seen argued elsewhere
          too.
      - key: lesson-02-07-quiz
        file: 02.07-quiz.md
        title: Project skeleton
        goal: Quick check on project skeleton concepts before you create the repo.
      - key: lesson-02-08-create-the-repo
        file: 02.08-create-the-repo.md
        title: 2.8 — Create the repo
        goal: >-
          **Why this step matters:** Everything you build for FreshMarket lives in a repo you own — not in the course
          guides folder. This step creates that root with Git, ignore rules, and a learning log so every later
          sub-chapter has a committed home and secrets stay out of history from d
      - key: lesson-02-09-scaffold-server-folders
        file: 02.09-scaffold-server-folders.md
        title: 2.9 — Scaffold server folders
        goal: >-
          **Why this step matters:** Empty module folders are not busywork — they are **labeled shelves** for auth,
          stores, products, cart, and orders. Creating them now means Chapter 5–18 instructions always point at paths
          that already exist in your tree.
      - key: lesson-02-10-server-package-and-scripts
        file: 02.10-server-package-and-scripts.md
        title: 2.10 — Server package and scripts
        goal: >-
          **Why this step matters:** `npm run dev` is how you (and every reviewer) start the API. Installing Express and
          wiring scripts turns a folder tree into a **runnable server process** — the foundation for the health route in
          the next step.
      - key: lesson-02-11-the-health-route
        file: 02.11-the-health-route.md
        title: 2.11 — The health route
        goal: >-
          **Why this step matters:** `GET /health` is your first **proof the API works** — independent of React,
          MongoDB, or auth. Load balancers and Chapter 4's extended health both build on this route; Chapter 2's gate
          requires curl to return honest JSON.
      - key: lesson-02-12-scaffold-client-folders
        file: 02.12-scaffold-client-folders.md
        title: 2.12 — Scaffold client folders
        goal: >-
          **Why this step matters:** FreshMarket is a product customers see in a browser — not a headless API.
          Scaffolding Vite + React now establishes where login pages, shop screens, and API helpers live for the rest of
          the course.
      - key: lesson-02-13-client-shell-and-routing
        file: 02.13-client-shell-and-routing.md
        title: 2.13 — Client shell and routing
        goal: >-
          **Why this step matters:** A single Home route is enough for Chapter 2, but you need a **router shell** so
          Chapter 7 adds `/login` and `/register` without restructuring the app. This step replaces the Vite default
          with your marketplace entry point.
      - key: lesson-02-14-api-client-helper
        file: 02.14-api-client-helper.md
        title: 2.14 — API client helper
        goal: >-
          **Why this step matters:** Scattering `fetch('http://localhost:5000/...')` across components breaks the moment
          you deploy or change ports. One helper reading `VITE_API_URL` is how every professional SPA keeps API calls
          **configurable and consistent**.
      - key: lesson-02-15-connect-client-to-server
        file: 02.15-connect-client-to-server.md
        title: 2.15 — Connect client to server
        goal: >-
          **Why this step matters:** This is the chapter's **payoff** — the browser displays data from your API, not
          hardcoded text. Proving the full-stack loop (React → HTTP → Express) means every later feature reuses the same
          pattern with more routes.
      - key: lesson-02-16-verify-end-to-end
        file: 02.16-verify-end-to-end.md
        title: 2.16 — Verify end-to-end
        goal: >-
          **Why this step matters:** Informal "it works on my machine" is not a gate. This verification pass documents
          curl output, browser screenshot, and folder tree — evidence that Week 1's first demo brick is real before you
          open the database chapters.
      - key: lesson-02-17-practice
        file: 02.17-practice.md
        title: 2.17 — Practice (optional stretch)
        goal: >-
          This sub-chapter is **optional**. Clear the Chapter 2 gate in **2.19** without it. Complete it if you want
          extra practice wiring **server route → client display** before Chapter 3 adds concepts without new UI.
      - key: lesson-02-18-recap-and-whats-next
        file: 02.18-recap-and-whats-next.md
        title: 2.18 — Recap and what's next
        goal: >-
          You started Chapter 2 with an empty directory (or only a learning log). You finish with a **full-stack
          skeleton** — the foundation every later chapter bolts onto.
      - key: lesson-02-19-checklist
        file: 02.19-checklist.md
        title: 2.19 — Checklist and learning log
        goal: >-
          Gate for Chapter 2 — Project skeleton. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-03-why-mongodb
    dir: 03-why-mongodb
    title: Why MongoDB
    lessons:
      - key: lesson-03-01-set-the-scene
        file: 03.01-set-the-scene.md
        title: 3.1 — Set the scene
        goal: >-
          Your marketplace skeleton is running — Express API, React client, health check working. Now it's time to give
          your app a memory. Before installing MongoDB (Chapter 4) or writing schemas (Chapter 5), you need to decide
          what kind of database fits your grocery marketplace and sketch what collections you'll need.
      - key: lesson-03-02-why-it-matters-for-grocery
        file: 03.02-why-it-matters-for-grocery.md
        title: 3.2 — Why grocery data is different
        goal: >-
          A generic marketplace stores name, price, and image. A grocery marketplace stores how much of what — kilograms
          of rice, litres of milk, a bunch of coriander marked perishable. These fields change how you model your
          database.
      - key: lesson-03-03-what-youll-decide
        file: 03.03-what-youll-decide.md
        title: 3.3 — What you'll decide
        goal: >-
          By the end of this chapter you will have made three decisions that Chapter 4-5 implement: which database to
          use, which ODM, and how to model relationships (embed vs reference).
      - key: lesson-03-04-relational-vs-document
        file: 03.04-relational-vs-document.md
        title: 3.4 — Relational vs document models
        goal: >-
          Walk through the same marketplace entities in SQL tables and MongoDB collections so you can compare them side
          by side. This helps you understand why this course picks documents — and explain that choice in plain English.
      - key: lesson-03-05-the-decision-for-freshmarket
        file: 03.05-the-decision-for-freshmarket.md
        title: 3.5 — The decision for FreshMarket
        goal: >-
          MongoDB + Mongoose is mandated for this course. This chapter explains why — the pros, the accepted trade-offs,
          and how to explain your choice in an interview.
      - key: lesson-03-06-embedding-vs-referencing
        file: 03.06-embedding-vs-referencing.md
        title: 3.6 — Embedding vs referencing
        goal: >-
          MongoDB gives you two ways to relate data: reference another document by _id, or embed subdocuments inside a
          parent. This chapter teaches you the decision framework so you can model FreshMarket correctly.
      - key: lesson-03-07-prime-your-thinking
        file: 03.07-prime-your-thinking.md
        title: 3.7 — Prime your thinking
        goal: >-
          Before you create your ERD, read MongoDB's official data modelling guide so your design uses the right
          vocabulary — one-to-one, one-to-many, embedding, referencing.
      - key: lesson-03-08-audit-your-planned-schema
        file: 03.08-audit-your-planned-schema.md
        title: 3.8 — Design your data blueprint
        goal: >-
          Create docs/erd-draft.md — your data blueprint. Sketch the collections, relationships, and embed vs reference
          decisions before writing any Mongoose code.
      - key: lesson-03-09-map-actors-to-collections
        file: 03.09-map-actors-to-collections.md
        title: 3.9 — Map actors to collections
        goal: >-
          Extend your ERD with actor-driven narratives — what each role reads/writes in which collection. This becomes
          the foundation for your isolation tests in Chapter 8.
      - key: lesson-03-10-quiz
        file: 03.10-quiz.md
        title: Data-model decisions
        goal: >-
          Check that you can apply the module's data-modelling decisions — what stays referenced, what gets frozen, and
          how checkout splits a multi-vendor cart.
      - key: lesson-03-11-checklist
        file: 03.11-checklist.md
        title: 3.11 — Checklist and learning log
        goal: Gate for Chapter 3 — Why MongoDB. Tick every box and answer the learning log before continuing to Chapter 4.
  - key: module-04-config-and-database
    dir: 04-config-and-database
    title: Config and database
    lessons:
      - key: lesson-04-01-set-the-scene
        file: 04.01-set-the-scene.md
        title: 4.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 2 gave you a running skeleton — Express listens, React loads, `GET
          /health` returns `{ "status": "ok" }`. Chapter 3 gave you a **design** — collections, embed vs reference,
          `docs/erd-draft.md` committed. Nothing persists yet. Restart the serv
      - key: lesson-04-02-why-secrets-matter
        file: 04.02-why-secrets-matter.md
        title: 4.2 — Why secrets matter
        goal: >-
          You are about to create `server/.env` with a **MongoDB connection string** — a secret that grants read/write
          access to your database. One mistaken `git add` and that string lives in Git history forever, even if you
          delete the file later.
      - key: lesson-04-03-what-youll-build
        file: 04.03-what-youll-build.md
        title: 4.3 — What you'll build in this chapter
        goal: >-
          By the end of Chapter 4, your marketplace API connects to MongoDB on startup, reads config from environment
          variables with validation, and reports database status on /health.
      - key: lesson-04-04-env-vs-hardcoded
        file: 04.04-env-vs-hardcoded.md
        title: 4.4 — Environment variables vs hardcoded config
        goal: >-
          Learn why hardcoding config values will eventually break your app, and how the 12-factor config principle
          keeps your code portable across environments.
      - key: lesson-04-05-local-mongodb
        file: 04.05-local-mongodb.md
        title: 4.5 — Local MongoDB vs Atlas
        goal: >-
          Before sub-chapter 4.9 asks you to paste `MONGODB_URI` into `.env`, you need a **running MongoDB instance**
          and a connection string that works from your machine.
      - key: lesson-04-06-prime-your-thinking
        file: 04.06-prime-your-thinking.md
        title: 4.6 — Prime your thinking
        goal: >-
          Before you write `shared/db.js`, read how **Mongoose** expects connections to work in modern Node
          (async/await, connection events, disconnect). This sub-chapter is a **mandatory reading assignment** — not
          optional skimming.
      - key: lesson-04-07-quiz
        file: 04.07-quiz.md
        title: Config, secrets and startup
        goal: Check configuration, secrets, and database-startup decisions before the build cluster.
      - key: lesson-04-08-where-the-project-is-now
        file: 04.08-where-the-project-is-now.md
        title: 4.8 — Where the project is now
        goal: >-
          **Why this step matters:** The build cluster assumes Chapter 2's skeleton and Chapter 3's ERD still hold. This
          recap prevents wiring MongoDB into a repo that never passed the health demo or skipped the design gate —
          fixing foundation bugs now is cheaper than debugging `MONGODB_UR
      - key: lesson-04-09-create-env-files
        file: 04.09-create-env-files.md
        title: 4.9 — Create env files
        goal: >-
          **Why this step matters:** This is the first moment a real secret enters your project. Creating `.env` locally
          and `.env.example` for Git establishes the pattern every later chapter (JWT, Cloudinary) repeats — names in
          repo, values only on your machine.
      - key: lesson-04-10-config-module
        file: 04.10-config-module.md
        title: 4.10 — Config module
        goal: >-
          **Why this step matters:** One validated config object stops `process.env` sprawl across dozens of files.
          Fail-fast on missing `MONGODB_URI` here turns mysterious Mongoose errors into a clear message the first time
          you forget to copy `.env.example`.
      - key: lesson-04-11-db-module
        file: 04.11-db-module.md
        title: 4.11 — DB module
        goal: >-
          **Why this step matters:** Centralizing `connectDB()` means the API, Chapter 5 seed script, and future tests
          share one connection path. Inline `mongoose.connect` in `server.js` would duplicate URI logic and invite
          inconsistent behaviour.
      - key: lesson-04-12-wire-db-on-boot
        file: 04.12-wire-db-on-boot.md
        title: 4.12 — Wire DB on boot
        goal: >-
          **Why this step matters:** Boot order — config, connect, then listen — prevents the API from accepting traffic
          while the database is still disconnected. Production APIs fail startup rather than lie to health checks; you
          adopt that discipline on localhost first.
      - key: lesson-04-13-health-check-db-status
        file: 04.13-health-check-db-status.md
        title: 4.13 — Health check DB status
        goal: >-
          **Why this step matters:** Chapter 2's health proved the process was up; this extension proves **memory
          works**. The client Home page and ops tooling rely on honest `db` status — not a green `ok` when MongoDB is
          down.
      - key: lesson-04-14-client-env
        file: 04.14-client-env.md
        title: 4.14 — Client env
        goal: >-
          **Why this step matters:** Re-verifying `VITE_API_URL` while adding server secrets reinforces the
          client/server boundary — the browser still never sees `MONGODB_URI`, but it must display the new health field
          from your API.
      - key: lesson-04-15-verify-connection
        file: 04.15-verify-connection.md
        title: 4.15 — Verify connection
        goal: >-
          **Why this step matters:** Happy-path demos lie by accident unless you test failure — missing env, stopped
          MongoDB, wrong URI. This step produces evidence for the learning log that your app **fails honestly**, not
          silently.
      - key: lesson-04-16-recap-and-whats-next
        file: 04.16-recap-and-whats-next.md
        title: 4.16 — Recap and what's next
        goal: >-
          You entered Chapter 4 with a running API that forgot everything on restart. You leave with **validated
          configuration**, a **Mongoose connection on boot**, and a **health endpoint that reports database truth** —
          visible in curl and on your Home page.
      - key: lesson-04-17-checklist
        file: 04.17-checklist.md
        title: 4.17 — Checklist and learning log
        goal: >-
          Gate for Chapter 4 — Config and database. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-05-data-model-and-seed
    dir: 05-data-model-and-seed
    title: Data model and seed
    lessons:
      - key: lesson-05-01-set-the-scene
        file: 05.01-set-the-scene.md
        title: 5.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 4 gave you a connected MongoDB — `shared/config.js`, `shared/db.js`,
          boot order correct, `GET /health` reports `db: connected`. Compass shows an empty database.
          `docs/erd-draft.md` sketches collections but no Mongoose schemas exist yet.
      - key: lesson-05-02-the-denormalisation-trap
        file: 05.02-the-denormalisation-trap.md
        title: 5.2 — The denormalisation trap
        goal: >-
          Every junior marketplace tutorial tempts you to **copy display names onto child documents** so queries feel
          simple. *"Just put `vendorName` and `storeName` on every product — one query, no joins."*
      - key: lesson-05-03-what-youll-build
        file: 05.03-what-youll-build.md
        title: 5.3 — What you'll build
        goal: >-
          By the end of Chapter 5, your repo contains **six Mongoose models**, a **runnable seed script**, and a **final
          ERD** committed to `docs/erd.md`. No API routes yet — only schemas and test data.
      - key: lesson-05-04-ownership-chain
        file: 05.04-ownership-chain.md
        title: 5.4 — Ownership chain
        goal: >-
          Multi-vendor marketplaces fail in production when **object-level ownership** is unclear. Authentication
          answers *who are you?* Ownership answers *may you touch this document?*
      - key: lesson-05-05-grocery-domain-fields
        file: 05.05-grocery-domain-fields.md
        title: 5.5 — Grocery domain fields
        goal: >-
          A generic `{ name, price, description }` product schema could serve any marketplace. FreshMarket is
          **grocery** — bananas sell by the bunch, flour by the kilogram, milk expires. Your Product model must reflect
          how local shops actually sell food.
      - key: lesson-05-06-prime-your-thinking
        file: 05.06-prime-your-thinking.md
        title: 5.6 — Prime your thinking
        goal: >-
          Before you write `user.model.js`, read how Mongoose expects schemas, refs, and model registration to work.
          Twenty minutes here saves hours of "populate returned null" debugging.
      - key: lesson-05-07-quiz
        file: 05.07-quiz.md
        title: Ownership and snapshots
        goal: Check ownership, snapshots, and seed-data decisions before implementing the models.
      - key: lesson-05-08-where-the-project-is-now
        file: 05.08-where-the-project-is-now.md
        title: 5.8 — Where the project is now
        goal: >-
          **Why this step matters:** Before creating six models, confirm MongoDB connects, module folders exist, and
          your ERD is open beside you. Building schemas on a disconnected DB or without a blueprint is the fastest path
          to rework in Chapter 6.
      - key: lesson-05-09-scaffold-models-folder
        file: 05.09-scaffold-models-folder.md
        title: 5.9 — Scaffold models folder
        goal: >-
          **Why this step matters:** Model files belong inside feature modules — `users/`, `stores/`, `products/` — not
          a global `models/` junk drawer. This step creates the exact paths Chapter 5 sub-chapters fill one schema at a
          time.
      - key: lesson-05-10-user-and-profile-models
        file: 05.10-user-and-profile-models.md
        title: 5.10 — User and Profile models
        goal: >-
          **Why this step matters:** Every auth and ownership feature anchors on User — email, role, verification state
          — and Profile for display data. These schemas are prerequisites for register in Chapter 6; get field names
          right now.
      - key: lesson-05-11-store-model
        file: 05.11-store-model.md
        title: 5.11 — Store model
        goal: >-
          **Why this step matters:** The store is the hub of vendor ownership — one shop per vendor, linked by `userId`.
          Product and order isolation in later chapters walk this link; a weak Store schema breaks the whole chain.
      - key: lesson-05-12-product-model
        file: 05.12-product-model.md
        title: 5.12 — Product model
        goal: >-
          **Why this step matters:** Products carry FreshMarket's grocery identity — unit, stock, perishability — not
          generic e-commerce fields. This schema is what customers browse and vendors edit; catalogue and checkout
          chapters assume these shapes exist.
      - key: lesson-05-13-cart-and-order-models
        file: 05.13-cart-and-order-models.md
        title: 5.13 — Cart and Order models
        goal: >-
          **Why this step matters:** Cart references live products; orders embed **snapshot** lines — the hardest
          modelling choice in the marketplace. Getting embed field names right here makes Chapter 18 checkout a wiring
          task instead of a schema rescue.
      - key: lesson-05-14-seed-script-scaffold
        file: 05.14-seed-script-scaffold.md
        title: 5.14 — Seed script scaffold
        goal: >-
          **Why this step matters:** Empty schemas do not prove your design — two vendors, two stores, and sample
          products in Compass do. The seed script is how you (and Chapter 8 tests) get predictable data without manual
          Compass clicking every reset.
      - key: lesson-05-15-run-seed-and-inspect
        file: 05.15-run-seed-and-inspect.md
        title: 5.15 — Run seed and inspect
        goal: >-
          **Why this step matters:** Running seed and opening Compass is the Week 1 **"data is real"** moment.
          Inspecting every collection catches ref typos and missing grocery fields before you build auth against broken
          documents.
      - key: lesson-05-16-draw-final-erd
        file: 05.16-draw-final-erd.md
        title: 5.16 — Draw final ERD
        goal: >-
          **Why this step matters:** `docs/erd.md` is your portfolio artifact and viva reference — it must match what
          you actually implemented, not the Chapter 3 draft alone. Diffing draft vs final proves you learned from
          building schemas.
      - key: lesson-05-17-recap-and-whats-next
        file: 05.17-recap-and-whats-next.md
        title: 5.17 — Recap and what's next
        goal: >-
          You entered Chapter 5 with an empty MongoDB and a draft ERD. You leave with **six Mongoose models**, **seed
          data visible in Compass**, and a **final ERD** that matches your code.
      - key: lesson-05-18-checklist
        file: 05.18-checklist.md
        title: 5.18 — Checklist and learning log
        goal: >-
          Gate for Chapter 5 — Data model and seed. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-06-authentication-api
    dir: 06-authentication-api
    title: Authentication API
    lessons:
      - key: lesson-06-01-set-the-scene
        file: 06.01-set-the-scene.md
        title: 6.1 — Set the scene
        goal: >-
          **Where the project is now:** Week 1 complete — models and seed data in MongoDB. Every API request is
          **anonymous**. `GET /health` works; no `/api/auth` routes. User documents exist in Compass with password
          hashes from seed.
      - key: lesson-06-02-why-auth-matters
        file: 06.02-why-auth-matters.md
        title: 6.2 — Why auth matters
        goal: >-
          Authentication failures make headlines. For a marketplace handling vendor inventory and customer orders,
          **identity integrity** is not optional — it's the foundation every isolation check in Chapter 8 assumes.
      - key: lesson-06-03-what-youll-build
        file: 06.03-what-youll-build.md
        title: 6.3 — What you'll build
        goal: >-
          By the end of Chapter 6, your API supports **full authentication flow via curl** — register, verify OTP,
          login, refresh access token, and access a protected route with Bearer token. Passwords hashed; refresh tokens
          stored hashed in DB.
      - key: lesson-06-04-sessions-vs-jwt
        file: 06.04-sessions-vs-jwt.md
        title: 6.4 — Sessions vs JWT
        goal: >-
          Every authenticated API must answer: **how does the server remember who sent this request?** Two dominant
          patterns — **server-side sessions** and **JWT (JSON Web Tokens)**. This course mandates JWT for FreshMarket.
      - key: lesson-06-05-password-hashing
        file: 06.05-password-hashing.md
        title: 6.5 — Password hashing
        goal: >-
          Plain text passwords in a database are a firing offence. **Hashing** is one-way — you verify login by
          comparing bcrypt output, never by decoding. This sub-chapter specifies bcrypt usage for register and login in
          auth.service.
      - key: lesson-06-06-what-a-jwt-is
        file: 06.06-what-a-jwt-is.md
        title: 6.6 — What a JWT is
        goal: >-
          A JSON Web Token is three Base64 segments separated by dots: **header.payload.signature**. Understanding each
          part prevents you from treating JWT as magic or putting secrets in the payload.
      - key: lesson-06-07-prime-your-thinking
        file: 06.07-prime-your-thinking.md
        title: 6.7 — Prime your thinking
        goal: >-
          Before scaffolding auth routes, read how bcrypt and jsonwebtoken behave in Node — especially async APIs and
          error types. Thirty minutes prevents "invalid signature" loops.
      - key: lesson-06-08-quiz
        file: 06.08-quiz.md
        title: Passwords and tokens
        goal: Check password, token, and authentication-boundary decisions before building the API.
      - key: lesson-06-09-where-the-project-is-now
        file: 06.09-where-the-project-is-now.md
        title: 6.9 — Where the project is now
        goal: >-
          **Why this step matters:** Auth builds on seeded User documents with real fields — not imaginary users. This
          recap confirms Week 1 gate, test emails, and empty `modules/auth/` before you add routes that mutate identity
          data.
      - key: lesson-06-10-scaffold-auth-module
        file: 06.10-scaffold-auth-module.md
        title: 6.10 — Scaffold auth module
        goal: >-
          **Why this step matters:** Auth HTTP code lives in `modules/auth/` while User models stay in `modules/users/`
          — separation keeps login routes from bloating user schema files. Empty route and service files give Chapter 6
          build steps named targets.
      - key: lesson-06-11-wire-auth-routes
        file: 06.11-wire-auth-routes.md
        title: 6.11 — Wire auth routes
        goal: >-
          **Why this step matters:** Unmounted routers are dead code — Express must expose `/api/auth/*` before any
          handler runs. One mount line in `app.js` is how every future module (stores, products) attaches too.
      - key: lesson-06-12-register-handler
        file: 06.12-register-handler.md
        title: 6.12 — Register handler
        goal: >-
          **Why this step matters:** Register is the front door — it creates User + Profile, hashes nothing yet
          incorrectly, and starts the OTP verification story. Chapter 7's Register page calls exactly what you implement
          here.
      - key: lesson-06-13-login-handler
        file: 06.13-login-handler.md
        title: 6.13 — Login handler
        goal: >-
          **Why this step matters:** Login proves bcrypt compare works and gates unverified users — the daily path
          vendors and customers repeat. Tokens issued here feed every protected route and Chapter 7's browser session.
      - key: lesson-06-14-access-token
        file: 06.14-access-token.md
        title: 6.14 — Access token
        goal: >-
          **Why this step matters:** Short-lived access JWT is what `requireAuth` verifies on every protected call —
          payload must carry user id and role without leaking password hash or email you should not expose.
      - key: lesson-06-15-refresh-token
        file: 06.15-refresh-token.md
        title: 6.15 — Refresh token
        goal: >-
          **Why this step matters:** Refresh tokens let clients renew access without re-entering passwords — but only if
          stored hashed and revocable on logout. This step completes the session story Chapter 7's silent refresh
          depends on.
      - key: lesson-06-16-otp-verification
        file: 06.16-otp-verification.md
        title: 6.16 — OTP verification
        goal: >-
          **Why this step matters:** `isVerified` separates real accounts from spam registrations — vendors should not
          list products until email is confirmed. Chapter 7's Verify OTP page is useless without this endpoint returning
          clear success and failure.
      - key: lesson-06-17-auth-middleware
        file: 06.17-auth-middleware.md
        title: 6.17 — Auth middleware
        goal: >-
          **Why this step matters:** `requireAuth` turns anonymous HTTP into identified requests — every later ownership
          check starts with `req.user` from a **verified** JWT, not client-supplied ids. `/api/auth/me` is your smoke
          test before store and product routes use the same guard.
      - key: lesson-06-18-test-with-curl
        file: 06.18-test-with-curl.md
        title: 6.18 — Test with curl
        goal: >-
          **Why this step matters:** Browser bugs hide API bugs and vice versa. A full curl script — register, verify,
          login, me, refresh — is your Chapter 6 gate evidence and the contract Chapter 7 must not break.
      - key: lesson-06-19-recap-and-whats-next
        file: 06.19-recap-and-whats-next.md
        title: 6.19 — Recap and what's next
        goal: >-
          Chapter 6 turned an anonymous API into an **authenticated** one. Every protected route from here forward
          builds on `requireAuth` and the token contracts you tested with curl.
      - key: lesson-06-20-checklist
        file: 06.20-checklist.md
        title: 6.20 — Checklist and learning log
        goal: >-
          Gate for Chapter 6 — Authentication API. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-07-login-and-registration
    dir: 07-login-and-registration
    title: Login and registration
    lessons:
      - key: lesson-07-01-set-the-scene
        file: 07.01-set-the-scene.md
        title: 7.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 6 complete — auth API works via curl. React client still shows health
          check only. Humans cannot register or login in the browser.
      - key: lesson-07-02-why-token-storage-matters
        file: 07.02-why-token-storage-matters.md
        title: 7.2 — Why token storage matters
        goal: >-
          Where you store JWT in the browser determines **XSS resilience** and **session persistence**. Wrong choice —
          localStorage for access token — is the most common MERN auth mistake.
      - key: lesson-07-03-what-youll-build
        file: 07.03-what-youll-build.md
        title: 7.3 — What you'll build
        goal: >-
          Chapter 7 delivers **browser auth UX** wired to Chapter 6 API — register, verify, login, silent refresh,
          protected navigation.
      - key: lesson-07-04-where-tokens-live
        file: 07.04-where-tokens-live.md
        title: 7.4 — Where tokens live
        goal: Concrete storage map for FreshMarket client — implement in 7.10 and 7.14.
      - key: lesson-07-05-the-401-retry-loop
        file: 07.05-the-401-retry-loop.md
        title: 7.5 — The 401 retry loop
        goal: >-
          When access token expires mid-session, user should not see login screen if refresh is valid. The API client
          implements **refresh once, retry once, else logout**.
      - key: lesson-07-06-prime-your-thinking
        file: 07.06-prime-your-thinking.md
        title: 7.6 — Prime your thinking
        goal: Before building auth pages, skim React patterns for context, protected routes, and fetch credentials.
      - key: lesson-07-07-quiz
        file: 07.07-quiz.md
        title: Browser sign-in flow
        goal: Check browser token handling, refresh behavior, and protected navigation.
      - key: lesson-07-08-where-the-project-is-now
        file: 07.08-where-the-project-is-now.md
        title: 7.8 — Where the project is now
        goal: >-
          **Why this step matters:** Chapter 7 assumes curl auth already passes — if register or refresh fails in
          terminal, fix Chapter 6 before building forms. This recap aligns client file paths with the API contract you
          tested.
      - key: lesson-07-09-scaffold-auth-pages
        file: 07.09-scaffold-auth-pages.md
        title: 7.9 — Scaffold auth pages
        goal: >-
          **Why this step matters:** Empty page components and router entries give Register, Login, and Verify OTP
          **named homes** before you wire forms. Adding routes now prevents a single mega-component auth file later.
      - key: lesson-07-10-auth-context-or-hook
        file: 07.10-auth-context-or-hook.md
        title: 7.10 — Auth context or hook
        goal: >-
          **Why this step matters:** Login state shared across pages needs one source of truth — `useAuth` or Context —
          so Header, protected routes, and the API client all agree whether someone is signed in without prop drilling.
      - key: lesson-07-11-register-page
        file: 07.11-register-page.md
        title: 7.11 — Register page
        goal: >-
          Wire the register form to POST /auth/register. First UI touchpoint for new vendors and customers — must route
          to verify OTP on success.
      - key: lesson-07-12-verify-otp-page
        file: 07.12-verify-otp-page.md
        title: 7.12 — Verify OTP page
        goal: >-
          **Why this step matters:** Without this screen, `isVerified` stays false and login always fails — the
          registration story feels broken. This page closes the loop between register API and usable accounts.
      - key: lesson-07-13-login-page
        file: 07.13-login-page.md
        title: 7.13 — Login page
        goal: 'Wire the login form: call the Chapter 6 API, store tokens via useAuth, redirect vendor vs customer by role.'
      - key: lesson-07-14-api-interceptor
        file: 07.14-api-interceptor.md
        title: 7.14 — API interceptor
        goal: >-
          **Why this step matters:** Manually attaching Bearer tokens on every fetch does not scale — one interceptor
          adds auth headers and runs the 401 refresh loop so expired access feels invisible to users shopping the
          marketplace.
      - key: lesson-07-15-protected-route-wrapper
        file: 07.15-protected-route-wrapper.md
        title: 7.15 — Protected route wrapper
        goal: >-
          **Why this step matters:** Public Home and auth pages stay open; vendor stubs must reject strangers.
          `ProtectedRoute` is the client-side door check — authorization by role deepens in Chapter 8, but
          unauthenticated users should never see vendor screens.
      - key: lesson-07-16-verify-in-browser
        file: 07.16-verify-in-browser.md
        title: 7.16 — Verify in browser
        goal: >-
          **Why this step matters:** curl proved the API; this step proves **humans** can register, verify, login, and
          hit a protected page — Week 2's auth demo for portfolio and mentors. Screenshot or short recording belongs in
          your learning log.
      - key: lesson-07-17-recap-and-whats-next
        file: 07.17-recap-and-whats-next.md
        title: 7.17 — Recap and what's next
        goal: >-
          Chapter 7 paired with Chapter 6 — humans can **register, verify, login, and reach protected pages** in the
          browser with safe token storage and silent refresh.
      - key: lesson-07-18-checklist
        file: 07.18-checklist.md
        title: 7.18 — Checklist and learning log
        goal: >-
          Gate for Chapter 7 — Login and registration. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-08-authorization-and-isolation
    dir: 08-authorization-and-isolation
    title: Authorization and isolation
    lessons:
      - key: lesson-08-01-set-the-scene
        file: 08.01-set-the-scene.md
        title: 8.1 — Set the scene
        goal: >-
          **Where the project is now:** Users authenticate via JWT — `requireAuth` attaches `req.user.id` and
          `req.user.role`. Any authenticated vendor could still PATCH any store id if you wrote a naive route. **Logged
          in ≠ allowed.**
      - key: lesson-08-02-idor-and-marketplaces
        file: 08.02-idor-and-marketplaces.md
        title: 8.2 — IDOR and marketplaces
        goal: >-
          **Insecure Direct Object Reference (IDOR)** — also called **BOLA** (Broken Object Level Authorization) in
          OWASP API Top 10 — is the #1 marketplace breach pattern: change an id in the URL, access someone else's data.
      - key: lesson-08-03-what-youll-build
        file: 08.03-what-youll-build.md
        title: 8.3 — What you'll build
        goal: >-
          Chapter 8 adds **authorization infrastructure** and proves it with a stub store route and two-vendor IDOR
          test.
      - key: lesson-08-04-authn-vs-authz
        file: 08.04-authn-vs-authz.md
        title: 8.4 — Authentication vs authorization
        goal: Two words, two responsibilities. Conflating them causes either open APIs or 401 loops where 403 is correct.
      - key: lesson-08-05-rbac-and-ownership
        file: 08.05-rbac-and-ownership.md
        title: 8.5 — RBAC and ownership
        goal: >-
          FreshMarket uses **two-layer authorization**: role-based access control (RBAC) at the route, then **ownership
          chain lookup** at the object.
      - key: lesson-08-06-prime-your-thinking
        file: 08.06-prime-your-thinking.md
        title: 8.6 — Prime your thinking
        goal: >-
          Before writing middleware, read OWASP guidance on object-level authorization — same concept as IDOR/BOLA. This
          is the last **learn** step before the build cluster. The goal is not to memorize OWASP jargon — it is to
          internalize one habit: **every route that touches an object by i
      - key: lesson-08-07-quiz
        file: 08.07-quiz.md
        title: Roles and ownership
        goal: Check role and ownership enforcement before defining the authorization matrix.
      - key: lesson-08-08-authorization-matrix
        file: 08.08-authorization-matrix.md
        title: 8.8 — Authorization matrix
        goal: >-
          Writing middleware before you know the rules produces inconsistent guards — one route checks role, another
          forgets ownership. The matrix is your **spec**: every action, every role, every check type, committed before
          code. Chapters 9–18 will add rows; Chapter 8 sets the pattern.
      - key: lesson-08-09-where-the-project-is-now
        file: 08.09-where-the-project-is-now.md
        title: 8.9 — Where the project is now
        goal: >-
          **Where the project is now:** JWT auth from Ch 6–7; `requireAuth` exists; `docs/AUTHORIZATION.md` from 8.8; no
          `requireRole` or ownership helper; no store routes.
      - key: lesson-08-10-require-role-middleware
        file: 08.10-require-role-middleware.md
        title: 8.10 — Require role middleware
        goal: >-
          `requireAuth` tells you *who* called the API; `requireRole` tells you *what kind of user* they are. Without
          it, a customer token could hit vendor-only routes. This middleware is reused on every vendor feature through
          Week 2 — get the factory pattern right once.
      - key: lesson-08-11-ownership-helper
        file: 08.11-ownership-helper.md
        title: 8.11 — Ownership helper
        goal: >-
          Role checks are not enough — two vendors share the same role. Ownership helpers load the **object** and
          compare its owner field to `req.user.id`. This is the core IDOR defense. You'll clone the pattern for products
          in Chapter 11.
      - key: lesson-08-12-apply-to-store-routes
        file: 08.12-apply-to-store-routes.md
        title: 8.12 — Apply to store routes
        goal: >-
          Middleware in isolation is untested theory. A minimal `PATCH /stores/:id` proves your stack runs in the
          correct order — `requireAuth` → `requireRole` → `assertStoreOwner` → handler. Chapter 9 extends this file;
          Chapter 8 proves the guards work.
      - key: lesson-08-13-test-idor-with-two-vendors
        file: 08.13-test-idor-with-two-vendors.md
        title: 8.13 — Test IDOR with two vendors
        goal: >-
          Security features without a negative test are wishful thinking. Proving Vendor B gets **403** on Vendor A's
          store is the Chapter 8 gate — and the template you'll repeat for products in 11.13. Document the curl
          commands; you'll rerun them when refactoring.
      - key: lesson-08-14-recap-and-whats-next
        file: 08.14-recap-and-whats-next.md
        title: 8.14 — Recap and what's next
        goal: >-
          Chapter 8 closes the security gap between **authenticated** and **authorized**. Vendor B cannot mutate Vendor
          A's store — proven with curl and documented in `docs/AUTHORIZATION.md`.
      - key: lesson-08-15-checklist
        file: 08.15-checklist.md
        title: 8.15 — Checklist and learning log
        goal: >-
          Gate for Chapter 8 — Authorization and isolation. Tick every box and answer the learning log on this page
          before continuing.
  - key: module-09-vendor-store-api
    dir: 09-vendor-store-api
    title: Vendor store API
    lessons:
      - key: lesson-09-01-set-the-scene
        file: 09.01-set-the-scene.md
        title: 9.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapters 6–8 gave you identity and isolation — vendors register, log in, and
          your API knows who they are. `requireAuth` returns 401 without a valid token. `requireRole('vendor')` returns
          403 for customers. `assertStoreOwner` blocks cross-vendor store
      - key: lesson-09-02-one-store-per-vendor
        file: 09.02-one-store-per-vendor.md
        title: 9.2 — One store per vendor
        goal: >-
          A vendor who runs **Green Valley Organics** should not also appear as **Green Valley Organics (2)** because
          they clicked "create store" twice. Multi-store per vendor is a real product pattern — but **not** for this
          course. FreshMarket assumes **one local shop per vendor account**
      - key: lesson-09-03-what-youll-build
        file: 09.03-what-youll-build.md
        title: 9.3 — What you'll build
        goal: >-
          By the end of Chapter 9, a **vendor-authenticated** client (curl for now, browser in Chapter 10) can complete
          the full store lifecycle on the API. Customers and unauthenticated users cannot create stores. Vendor B cannot
          update Vendor A's store.
      - key: lesson-09-04-store-fields
        file: 09.04-store-fields.md
        title: 9.4 — Store fields
        goal: >-
          The Store document is the vendor's **shop card** — what customers see when browsing by store and what vendors
          edit in settings. Chapter 9 implements a focused field set aligned with your Chapter 5 schema. This
          sub-chapter specs **what each field means**, not the Mongoose code.
      - key: lesson-09-05-prime-your-thinking
        file: 09.05-prime-your-thinking.md
        title: 9.5 — Prime your thinking
        goal: >-
          Before scaffolding routes, read how other APIs expose **"my resource"** vs **"resource by id"** — your `GET
          /stores/me` and `PATCH /stores/:id` design benefits from five minutes of context.
      - key: lesson-09-06-quiz
        file: 09.06-quiz.md
        title: Store API contracts
        goal: Check store ownership, route ordering, and API-status decisions before implementation.
      - key: lesson-09-07-where-the-project-is-now
        file: 09.07-where-the-project-is-now.md
        title: 9.7 — Where the project is now
        goal: >-
          Chapter 9 is the first feature built on top of Chapter 8's guards. This snapshot confirms isolation middleware
          exists and two vendor tokens are ready — so your first real `POST /stores` does not ship on a broken
          foundation.
      - key: lesson-09-08-scaffold-stores-module
        file: 09.08-scaffold-stores-module.md
        title: 9.8 — Scaffold stores module
        goal: >-
          Scaffolding separates **structure** from **logic** — routes, service, and validation files exist and mount
          before you write create/fetch/update behavior. Same pattern as auth (Ch 6) and products (Ch 11). One folder,
          one responsibility per file.
      - key: lesson-09-09-create-store-route
        file: 09.09-create-store-route.md
        title: 9.9 — Create store route
        goal: >-
          Opening a shop is the vendor's first irreversible action on the platform. `POST /stores` must enforce
          one-store-per-vendor, bind `userId` from the JWT (never the body), and reject customers. Chapter 10's
          onboarding form calls this endpoint.
      - key: lesson-09-10-get-my-store-route
        file: 09.10-get-my-store-route.md
        title: 9.10 — Get my store route
        goal: >-
          Vendors should not hunt MongoDB ids in Compass. `GET /stores/me` resolves the store from the JWT — and returns
          **404** when no shop exists yet. That 404 is not an error; Chapter 10 turns it into the onboarding redirect
          signal.
      - key: lesson-09-11-update-store-route
        file: 09.11-update-store-route.md
        title: 9.11 — Update store route
        goal: >-
          Store settings — name, description, address — change over time. `PATCH /stores/:id` reuses Chapter 8's
          ownership assert so only the leaseholder edits their stall. Chapter 10's settings page calls this route on
          save.
      - key: lesson-09-12-test-with-curl
        file: 09.12-test-with-curl.md
        title: 9.12 — Test with curl
        goal: >-
          The store API must work without React before you build forms. curl proves create → fetch me → update →
          cross-vendor 403 in one session. If this step fails, Chapter 10 will hide the bugs behind loading spinners.
      - key: lesson-09-13-recap-and-whats-next
        file: 09.13-recap-and-whats-next.md
        title: 9.13 — Recap and what's next
        goal: >-
          You entered Chapter 9 with authenticated vendors and isolation middleware but no way to open a shop. You leave
          with a **complete vendor store API** — create once, fetch mine, update with ownership — tested with curl and
          ready for the browser in Chapter 10.
      - key: lesson-09-14-checklist
        file: 09.14-checklist.md
        title: 9.14 — Checklist and learning log
        goal: >-
          Gate for Chapter 9 — Vendor store API. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-10-open-your-shop
    dir: 10-open-your-shop
    title: Open your shop
    lessons:
      - key: lesson-10-01-set-the-scene
        file: 10.01-set-the-scene.md
        title: 10.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 9 gave vendors a **store API** — create, fetch mine, update — proven
          with curl. A logged-in vendor can open a shop programmatically. The React app still treats every vendor like
          any other authenticated user: no shop setup screen, no settings 
      - key: lesson-10-02-onboarding-as-a-gate
        file: 10.02-onboarding-as-a-gate.md
        title: 10.2 — Onboarding as a gate
        goal: >-
          A vendor without a store is a **signed-up user**, not a **marketplace participant**. Letting them reach "Add
          product" or "Orders" before they open a shop creates empty screens, API 403/404 errors, and support confusion.
          Chapter 10 treats **having a store** as a **hard gate**.
      - key: lesson-10-03-what-youll-build
        file: 10.03-what-youll-build.md
        title: 10.3 — What you'll build
        goal: >-
          By the end of Chapter 10, a vendor can **complete shop onboarding entirely in the browser** and edit shop
          details later. Storeless vendors are redirected to open-shop; vendors with a store reach the vendor shell
          (product pages stub OK until Ch 12).
      - key: lesson-10-04-prime-your-thinking
        file: 10.04-prime-your-thinking.md
        title: 10.4 — Prime your thinking
        goal: >-
          Onboarding forms are deceptively simple — one bad redirect loop wastes an afternoon. Skim UX patterns for
          **gated setup** before building `VendorLayout`.
      - key: lesson-10-05-where-the-project-is-now
        file: 10.05-where-the-project-is-now.md
        title: 10.5 — Where the project is now
        goal: >-
          Chapter 10 is client-only — it consumes Chapter 9's API. This snapshot confirms store endpoints work via curl
          before you touch React routing. Building forms against a broken API wastes time on UI bugs that are really
          401/404 contract mismatches.
      - key: lesson-10-06-scaffold-vendor-layout
        file: 10.06-scaffold-vendor-layout.md
        title: 10.6 — Scaffold vendor layout
        goal: >-
          Create VendorLayout, nested /vendor routes, and API helper stubs. Every vendor page in Week 2 builds inside
          this shell.
      - key: lesson-10-07-store-setup-page
        file: 10.07-store-setup-page.md
        title: 10.7 — Store setup page
        goal: >-
          Build the Open your shop form: collect name, description, address, POST to /stores. This is the first real
          vendor screen in Week 2.
      - key: lesson-10-08-store-settings-page
        file: 10.08-store-settings-page.md
        title: 10.8 — Store settings page
        goal: >-
          Build store settings: load from GET /stores/me, save with PATCH /stores/:id. Vendors edit shop details after
          opening.
      - key: lesson-10-09-onboarding-redirect
        file: 10.09-onboarding-redirect.md
        title: 10.9 — Onboarding redirect
        goal: >-
          Add the store gate in VendorLayout: GET /stores/me returns 404 → redirect to open-shop. Prevents storeless
          vendors from hitting product pages.
      - key: lesson-10-10-verify-onboarding-flow
        file: 10.10-verify-onboarding-flow.md
        title: 10.10 — Verify onboarding flow
        goal: >-
          Individual pages can work while the journey breaks — gate bypass, wrong redirect, stale cache after create.
          Run the full script with a **fresh vendor account** in the browser. This is the Chapter 10 gate before product
          APIs assume every vendor has a store.
      - key: lesson-10-11-recap-and-whats-next
        file: 10.11-recap-and-whats-next.md
        title: 10.11 — Recap and what's next
        goal: >-
          You entered Chapter 10 with a store API only curl could touch. You leave with **vendor onboarding in the
          browser** — open shop, edit settings, and a layout gate that keeps storeless vendors out of management routes
          until they belong on the marketplace.
      - key: lesson-10-12-quiz
        file: 10.12-quiz.md
        title: The store gate
        goal: >-
          Check how the store gate reads API state, where it must live, and how a duplicate shop is surfaced to the
          vendor.
      - key: lesson-10-13-checklist
        file: 10.13-checklist.md
        title: 10.13 — Checklist and learning log
        goal: >-
          Gate for Chapter 10 — Open your shop. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-11-manage-products-api
    dir: 11-manage-products-api
    title: Manage products API
    lessons:
      - key: lesson-11-01-set-the-scene
        file: 11.01-set-the-scene.md
        title: 11.1 — Set the scene
        goal: >-
          **Where the project is now:** Vendors have shops — API and UI from Chapters 9–10. A store document exists with
          `userId`. The Product model from Chapter 5 waits in `modules/products/` with grocery fields, but there is no
          **vendor product API** — no way to stock the shelves progr
      - key: lesson-11-02-two-views-of-products
        file: 11.02-two-views-of-products.md
        title: 11.2 — Two views of products
        goal: >-
          The same Product document serves **two audiences** with different routes, filters, and trust boundaries.
          Confusing them causes draft products on the public shop or vendor-only prices leaking — Chapter 11 builds only
          the **vendor inventory view**.
      - key: lesson-11-03-what-youll-build
        file: 11.03-what-youll-build.md
        title: 11.3 — What you'll build
        goal: >-
          By Chapter 11 gate, vendors **CRUD products on their store** via API; cross-vendor mutation returns **403**;
          list is scoped to authenticated vendor's inventory only.
      - key: lesson-11-04-public-vs-vendor-routes
        file: 11.04-public-vs-vendor-routes.md
        title: 11.4 — Public vs vendor routes
        goal: >-
          Route **naming and mount order** prevent accidental exposure of vendor inventory on public paths. This
          sub-chapter specs how Chapter 11 routes coexist with Chapter 14 stubs in `app.js`.
      - key: lesson-11-05-prime-your-thinking
        file: 11.05-prime-your-thinking.md
        title: 11.5 — Prime your thinking
        goal: >-
          Vendor product list may stay unpopulated in Chapter 11 — but **populate** appears in Chapter 14 and cart. Read
          now so your `storeId` refs stay consistent. This is the last learn step before the product API build cluster —
          the mental model you set here determines whether Chapter 1
      - key: lesson-11-06-quiz
        file: 11.06-quiz.md
        title: Product ownership
        goal: Check vendor product ownership and publication rules before implementing management routes.
      - key: lesson-11-07-where-the-project-is-now
        file: 11.07-where-the-project-is-now.md
        title: 11.7 — Where the project is now
        goal: >-
          Chapter 11 adds four HTTP verbs on a new resource. This snapshot confirms store routes work and the Product
          model has `storeId` — every product handler inherits that foundation. Five minutes here prevents an hour of
          opaque 500 errors on `POST /products`.
      - key: lesson-11-08-scaffold-products-module
        file: 11.08-scaffold-products-module.md
        title: 11.8 — Scaffold products module
        goal: >-
          Same scaffold pattern as stores and auth: routes, service, schema files mounted before handlers. Product CRUD
          spans four sub-chapters — structure first keeps each step focused on one verb.
      - key: lesson-11-09-create-product-route
        file: 11.09-create-product-route.md
        title: 11.9 — Create product route
        goal: 'Implement POST /products: vendor-only, storeId from JWT never from body, default draft until published.'
      - key: lesson-11-10-list-vendor-products
        file: 11.10-list-vendor-products.md
        title: 11.10 — List vendor products
        goal: >-
          Implement GET /vendor/products — returns only the authenticated vendor's products including drafts. Chapter
          12's dashboard table calls this.
      - key: lesson-11-11-update-product-route
        file: 11.11-update-product-route.md
        title: 11.11 — Update product route
        goal: >-
          Prices change, stock runs low, typos get fixed. `PATCH /products/:id` needs ownership assert on every call —
          the route Chapter 8's IDOR test foreshadowed. The publish toggle in Chapter 12 also uses this endpoint.
      - key: lesson-11-12-delete-product-route
        file: 11.12-delete-product-route.md
        title: 11.12 — Delete product route
        goal: >-
          Vendors discontinue items — hard delete in this course. `DELETE /products/:id` completes the CRUD set and
          reuses the same ownership chain. Optional in the UI (Ch 12) but required in the API for a complete inventory
          lifecycle.
      - key: lesson-11-13-test-cross-vendor-403
        file: 11.13-test-cross-vendor-403.md
        title: 11.13 — Test cross-vendor 403
        goal: >-
          Chapter 8 proved store isolation; this step proves **product** isolation — Vendor B cannot PATCH Vendor A's
          kale. Same curl template, new resource. The Chapter 11 gate depends on this negative test, not just happy-path
          create.
      - key: lesson-11-14-recap-and-whats-next
        file: 11.14-recap-and-whats-next.md
        title: 11.14 — Recap and what's next
        goal: >-
          Chapter 11 completes **vendor product CRUD on the API** — create on own store, scoped list, update, delete,
          with cross-vendor mutation blocked at 403. The shop has shelves; the browser dashboard comes next.
      - key: lesson-11-15-checklist
        file: 11.15-checklist.md
        title: 11.15 — Checklist and learning log
        goal: >-
          Gate for Chapter 11 — Manage products API. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-12-vendor-dashboard
    dir: 12-vendor-dashboard
    title: Vendor dashboard
    lessons:
      - key: lesson-12-01-set-the-scene
        file: 12.01-set-the-scene.md
        title: 12.1 — Set the scene
        goal: >-
          **Where the project is now:** Vendors have a shop (Ch 9–10) and a **product API** (Ch 11) — create, list,
          update, delete, publish flag via PATCH. curl proves it works. The vendor UI still has no **inventory screens**
          — `/vendor/products` may be a stub from Chapter 10.
      - key: lesson-12-02-table-plus-forms
        file: 12.02-table-plus-forms.md
        title: 12.2 — Table plus forms
        goal: >-
          Enterprise vendors use ERP dashboards. **FreshMarket MVP** uses a **table + separate create/edit pages** —
          enough to prove full-stack competency without component library complexity.
      - key: lesson-12-03-what-youll-build
        file: 12.03-what-youll-build.md
        title: 12.3 — What you'll build
        goal: >-
          By Chapter 12 gate, vendor manages products **end-to-end in browser** — list, create, edit, publish — with API
          errors surfaced clearly.
      - key: lesson-12-04-error-mapping
        file: 12.04-error-mapping.md
        title: 12.4 — Error mapping
        goal: >-
          Forms fail — vendors enter negative stock, lose Wi-Fi mid-save, or session expires. Chapter 12 specs how
          **HTTP status becomes UI feedback** without exposing stack traces.
      - key: lesson-12-05-where-the-project-is-now
        file: 12.05-where-the-project-is-now.md
        title: 12.5 — Where the project is now
        goal: >-
          Chapter 12 wires React to Chapter 11's product API. Confirm curl can create, list, and PATCH before building
          tables and forms — otherwise you'll debug API contracts inside JSX error boundaries.
      - key: lesson-12-06-product-list-page
        file: 12.06-product-list-page.md
        title: 12.6 — Product list page
        goal: >-
          Build the vendor product table at /vendor/products. Fetch from GET /vendor/products — this is the vendor's
          inventory home screen.
      - key: lesson-12-07-create-product-page
        file: 12.07-create-product-page.md
        title: 12.7 — Create product page
        goal: 'Build the Add product form: grocery fields, POST /products, new items start as drafts until published in 12.9.'
      - key: lesson-12-08-edit-product-page
        file: 12.08-edit-product-page.md
        title: 12.8 — Edit product page
        goal: >-
          Build edit product: pre-fill form from vendor product list, save with PATCH /products/:id. Chapter 13 adds
          photo upload here.
      - key: lesson-12-09-publish-toggle
        file: 12.09-publish-toggle.md
        title: 12.9 — Publish toggle
        goal: >-
          Add draft vs published control on the edit page. PATCH isPublished — only published products appear in the
          public shop (Chapter 14).
      - key: lesson-12-10-verify-vendor-flow
        file: 12.10-verify-vendor-flow.md
        title: 12.10 — Verify vendor flow
        goal: >-
          Pages working in isolation ≠ journey working end-to-end. Run create draft → edit → publish in the browser with
          a real vendor account. This is the Chapter 12 gate — Week 2 demo inventory is almost complete; Chapter 13 adds
          photos only.
      - key: lesson-12-11-recap-and-whats-next
        file: 12.11-recap-and-whats-next.md
        title: 12.11 — Recap and what's next
        goal: >-
          Chapter 12 completes the **vendor back office MVP** — product table, create and edit forms, publish toggle —
          all wired to Chapter 11 API. Vendors manage inventory in the browser without curl.
      - key: lesson-12-12-quiz
        file: 12.12-quiz.md
        title: Dashboard failure states
        goal: >-
          Check the vendor dashboard decisions — 400 field mapping, a failed publish PATCH, and an edit URL that points
          at no product.
      - key: lesson-12-13-checklist
        file: 12.13-checklist.md
        title: 12.13 — Checklist and learning log
        goal: >-
          Gate for Chapter 12 — Vendor dashboard. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-13-product-photos
    dir: 13-product-photos
    title: Product photos
    lessons:
      - key: lesson-13-01-set-the-scene
        file: 13.01-set-the-scene.md
        title: 13.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapters 11–12 gave vendors a product CRUD API and dashboard. Products have
          names, prices, units, stock — but no photos. A grocery marketplace without images feels like a spreadsheet.
          Customers need to see what they're buying; vendors need their shel
      - key: lesson-13-02-base64-trap
        file: 13.02-base64-trap.md
        title: 13.2 — The base64 trap
        goal: >-
          A tempting shortcut: read the file in the browser, base64-encode it, save the string in `product.imageData`.
          It works in a demo. It fails in production — sometimes within days when document size limits and query latency
          bite.
      - key: lesson-13-03-what-youll-build
        file: 13.03-what-youll-build.md
        title: 13.3 — What you'll build
        goal: >-
          By the end of Chapter 13, vendors upload product photos through your API. Images live in **Cloudinary**;
          MongoDB stores **`imageUrl`** only. The vendor dashboard shows thumbnails in the product list and on
          create/edit forms.
      - key: lesson-13-04-object-storage-pattern
        file: 13.04-object-storage-pattern.md
        title: 13.4 — Object storage pattern
        goal: >-
          Every marketplace that serves images at scale follows the same pattern: **bytes in object storage, pointer in
          the database, CDN in front**. MongoDB, PostgreSQL, and Redis are wrong places for JPEG data — they are right
          places for URLs.
      - key: lesson-13-05-prime-your-thinking
        file: 13.05-prime-your-thinking.md
        title: 13.5 — Prime your thinking
        goal: >-
          Before you wire multer and Cloudinary, read how **server-side uploads** work in the Cloudinary Node SDK. This
          sub-chapter points you at the right docs — not a tutorial replacement.
      - key: lesson-13-06-quiz
        file: 13.06-quiz.md
        title: Upload boundaries
        goal: Check upload security, storage references, and replacement cleanup.
      - key: lesson-13-07-where-the-project-is-now
        file: 13.07-where-the-project-is-now.md
        title: 13.7 — Where the project is now
        goal: >-
          Upload infrastructure sits on top of working product CRUD. If the dashboard or API is broken, multipart errors
          will mislead you. Confirm Chapters 11–12 gates and `imageUrl` on the model before touching Cloudinary or
          multer.
      - key: lesson-13-08-cloudinary-config
        file: 13.08-cloudinary-config.md
        title: 13.8 — Cloudinary config
        goal: >-
          Upload credentials belong in server env — never the React bundle. This step wires Cloudinary the same way
          Chapter 4 wired MongoDB: validate at boot, document in `.env.example`, fail fast if missing. The shared helper
          keeps route handlers thin.
      - key: lesson-13-09-upload-route
        file: 13.09-upload-route.md
        title: 13.9 — Upload route
        goal: Add POST /products/:id/image with multer and Cloudinary. Vendors upload photos; MongoDB stores only the URL.
      - key: lesson-13-10-delete-old-image
        file: 13.10-delete-old-image.md
        title: 13.10 — Delete old image
        goal: >-
          Replacing a photo without deleting the old Cloudinary asset leaks storage cost and clutters your account.
          `imagePublicId` exists for lifecycle management — remove the previous asset when a vendor uploads a new one.
      - key: lesson-13-11-upload-ui-component
        file: 13.11-upload-ui-component.md
        title: 13.11 — Upload UI component
        goal: >-
          Build ImageUpload component on the edit product page. Vendors pick a file, POST multipart, see thumbnail in
          product list.
      - key: lesson-13-12-verify-image-flow
        file: 13.12-verify-image-flow.md
        title: 13.12 — Verify image flow
        goal: >-
          Upload bugs hide in three places — multer, Cloudinary, and React file state. End-to-end proof: pick image →
          see thumbnail → confirm MongoDB has URL only → replace photo → old asset gone. This is the technical gate
          before recap and the Week 2→3 bridge.
      - key: lesson-13-13-recap-and-whats-next
        file: 13.13-recap-and-whats-next.md
        title: 13.13 — Recap and what's next
        goal: >-
          You entered Chapter 13 with text-only products. You leave with **Cloudinary-backed photos**, **URL-only
          MongoDB documents**, and **vendor dashboard thumbnails** — the last piece of the Week 2 vendor experience.
      - key: lesson-13-14-bridge-to-week-3-customer-experience
        file: 13.14-bridge-to-week-3-customer-experience.md
        title: 13.14 — Bridge to Week 3 (customer experience)
        goal: >-
          You finished **Week 2 — vendor experience**. Take a breath. This sub-chapter exists because the shift to Week
          3 is the biggest **role change** in the course — not because Week 3 is harder, but because you stop thinking
          like a shop owner and start thinking like a shopper.
      - key: lesson-13-15-checklist
        file: 13.15-checklist.md
        title: 13.15 — Checklist and learning log
        goal: >-
          Gate for Chapter 13 — Product photos. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-14-browse-catalogue-api
    dir: 14-browse-catalogue-api
    title: Browse catalogue API
    lessons:
      - key: lesson-14-01-set-the-scene
        file: 14.01-set-the-scene.md
        title: 14.1 — Set the scene
        goal: >-
          **Where the project is now:** Week 2 vendor experience is complete — stores, products, photos. All product
          reads so far are **vendor-scoped** (`GET /vendor/products`). Customers have accounts (Chapters 6–7) but no way
          to browse the market.
      - key: lesson-14-02-n-plus-one-trap
        file: 14.02-n-plus-one-trap.md
        title: 14.2 — The N+1 trap
        goal: >-
          A catalogue endpoint that returns 50 products and **51 database queries** looks fine in development with 5
          products. It fails under real traffic — latency spikes, connection pool exhaustion, MongoDB CPU climbs.
      - key: lesson-14-03-what-youll-build
        file: 14.03-what-youll-build.md
        title: 14.3 — What you'll build
        goal: >-
          By the end of Chapter 14, customers (and your Chapter 15 shop UI) can fetch a **paginated, filterable
          catalogue** of published in-stock products with store name included — **without N+1 queries**. Single product
          detail via `GET /products/:id`.
      - key: lesson-14-04-populate-vs-aggregate
        file: 14.04-populate-vs-aggregate.md
        title: 14.4 — Populate vs aggregate
        goal: >-
          Mongoose gives two ways to attach store data to product results: **`.populate()`** on a find query and
          **`$lookup`** in an aggregation pipeline. For FreshMarket's public catalogue, populate is the default —
          aggregate when you need one round trip or complex shaping.
      - key: lesson-14-05-pagination
        file: 14.05-pagination.md
        title: 14.5 — Pagination
        goal: >-
          A marketplace catalogue without pagination returns every product in one response — fine with 12 seed items,
          catastrophic with 12,000. Chapter 14 implements **offset pagination** with `page` and `limit` query params.
      - key: lesson-14-06-prime-your-thinking
        file: 14.06-prime-your-thinking.md
        title: 14.6 — Prime your thinking
        goal: >-
          Before implementing pagination in 14.11, read how **offset** and **cursor** pagination differ — you implement
          offset for this chapter; cursor is the scale-up path mentors may ask about in viva.
      - key: lesson-14-07-quiz
        file: 14.07-quiz.md
        title: Catalogue queries
        goal: Check public catalogue filtering, pagination, and query efficiency.
      - key: lesson-14-08-where-the-project-is-now
        file: 14.08-where-the-project-is-now.md
        title: 14.8 — Where the project is now
        goal: >-
          **Why this step matters:** You are about to expose product data to the **public internet** (no auth). This
          recap confirms seed data, vendor routes, and ownership are solid so you do not accidentally leak drafts or
          break vendor CRUD while adding browse.
      - key: lesson-14-09-public-products-route
        file: 14.09-public-products-route.md
        title: 14.9 — Public products route
        goal: >-
          **Why this step matters:** This is the **first endpoint customers will use** — the foundation of the whole
          shop. Getting the visibility filter right here (`published` + in-stock only) prevents draft products leaking
          to the public before you add filters and pagination.
      - key: lesson-14-10-filter-query-params
        file: 14.10-filter-query-params.md
        title: 14.10 — Filter query params
        goal: >-
          **Why this step matters:** Real shoppers narrow by category or vendor — "vegetables only" or "this farm
          stall." Filters belong in the **API** so pagination stays honest; client-side filtering of one page would lie
          about what exists in the catalogue.
      - key: lesson-14-11-pagination-params
        file: 14.11-pagination-params.md
        title: 14.11 — Pagination params
        goal: >-
          **Why this step matters:** Without page/limit, every browse request loads the **entire** catalogue — fine with
          seed data, broken at scale. Chapter 15's shop will call this on every page click; metadata (`total`,
          `totalPages`) drives the UI controls.
      - key: lesson-14-12-populate-store-name
        file: 14.12-populate-store-name.md
        title: 14.12 — Populate store name
        goal: >-
          **Why this step matters:** Shop cards need **store name**, not a raw ObjectId. This step fixes the N+1 trap
          from 14.2 — populate on the **paginated page** keeps query count flat when Chapter 15 hammers this endpoint.
      - key: lesson-14-13-single-product-route
        file: 14.13-single-product-route.md
        title: 14.13 — Single product route
        goal: >-
          **Why this step matters:** The product detail page (Chapter 15) needs one item by id — with the **same public
          DTO** as the list. Detail route also enforces "unpublished = 404" so customers cannot guess draft product ids.
      - key: lesson-14-14-test-catalogue-api
        file: 14.14-test-catalogue-api.md
        title: 14.14 — Test catalogue API
        goal: >-
          **Why this step matters:** curl proof and **query-count logging** are your gate evidence — not "it looks fine
          in Compass." This step catches N+1 and filter bugs before you build React on top of a broken API.
      - key: lesson-14-15-recap-and-whats-next
        file: 14.15-recap-and-whats-next.md
        title: 14.15 — Recap and what's next
        goal: >-
          **Why this step matters:** Pausing to narrate what you built locks in the public read model before Chapter 15
          — if you cannot explain `/products` vs `/vendor/products`, the shop UI will duplicate logic in the wrong
          place.
      - key: lesson-14-16-checklist
        file: 14.16-checklist.md
        title: 14.16 — Checklist and learning log
        goal: >-
          Gate for Chapter 14 — Browse catalogue API. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-15-shop-the-marketplace
    dir: 15-shop-the-marketplace
    title: Shop the marketplace
    lessons:
      - key: lesson-15-01-set-the-scene
        file: 15.01-set-the-scene.md
        title: 15.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 14 delivered a public catalogue API — paginated products with store
          names and photos. Customers can authenticate (Chapters 6–7) but have **no storefront** in the browser.
      - key: lesson-15-02-editorial-grid
        file: 15.02-editorial-grid.md
        title: 15.2 — Editorial grid
        goal: >-
          The shop page is a **grid of cards** — not a dense data table. Each card is a scannable unit of trust: photo,
          name, price, who sells it.
      - key: lesson-15-03-what-youll-build
        file: 15.03-what-youll-build.md
        title: 15.3 — What you'll build
        goal: >-
          By chapter end, customers open **Shop**, filter and paginate the catalogue, open **product detail**, and see
          items from multiple vendors — all driven by Chapter 14 API.
      - key: lesson-15-04-where-the-project-is-now
        file: 15.04-where-the-project-is-now.md
        title: 15.4 — Where the project is now
        goal: >-
          **Why this step matters:** Week 3's first **visible** customer feature starts here. Confirming the Chapter 14
          API works via curl before React saves hours debugging empty grids caused by backend issues, not CSS.
      - key: lesson-15-05-scaffold-customer-pages
        file: 15.05-scaffold-customer-pages.md
        title: 15.5 — Scaffold customer pages
        goal: >-
          Create the shop skeleton: routes, placeholder pages, and API helpers. Everything else in this chapter builds
          on top of these files.
      - key: lesson-15-06-product-card-component
        file: 15.06-product-card-component.md
        title: 15.6 — Product card component
        goal: >-
          Build ProductCard — the small tile reused on every row of the shop grid. Photo, price, store name, and a link
          to detail.
      - key: lesson-15-07-filter-bar
        file: 15.07-filter-bar.md
        title: 15.7 — Filter bar
        goal: >-
          Add category and store filters that refetch GET /products. Never filter paginated results only in React — that
          hides products on other pages.
      - key: lesson-15-08-shop-page-with-pagination
        file: 15.08-shop-page-with-pagination.md
        title: 15.8 — Shop page with pagination
        goal: >-
          Wire the main shop experience: fetch GET /products, render the grid, add Prev/Next pagination. This is the
          heart of the customer browse flow.
      - key: lesson-15-09-product-detail-page
        file: 15.09-product-detail-page.md
        title: 15.9 — Product detail page
        goal: >-
          Build the product detail page: fetch one product, show full info, add an Add to cart button stub for Chapter
          17.
      - key: lesson-15-10-verify-browse-ui
        file: 15.10-verify-browse-ui.md
        title: 15.10 — Verify browse UI
        goal: >-
          Walk through the full browse flow in the browser and screenshot two vendors on one grid — the Chapter 15 gate
          proof.
      - key: lesson-15-11-recap-and-whats-next
        file: 15.11-recap-and-whats-next.md
        title: 15.11 — Recap and what's next
        goal: >-
          **Why this step matters:** You are switching from **browse** to **buy** next (Chapter 16 cart API). Recap
          confirms the shop consumes the API without duplicating catalogue rules — cart must not re-implement
          publish/stock filters.
      - key: lesson-15-12-quiz
        file: 15.12-quiz.md
        title: Browse decisions
        goal: >-
          Apply the chapter's browse decisions — filter reset with pagination, refetching instead of client-side
          filtering, and the data the detail page must hold for the cart.
      - key: lesson-15-13-checklist
        file: 15.13-checklist.md
        title: 15.13 — Checklist and learning log
        goal: >-
          Gate for Chapter 15 — Shop the marketplace. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-16-cart-api
    dir: 16-cart-api
    title: Cart API
    lessons:
      - key: lesson-16-01-set-the-scene
        file: 16.01-set-the-scene.md
        title: 16.1 — Set the scene
        goal: >-
          **Where the project is now:** Customers browse the marketplace in the shop UI (Chapter 15). Add-to-cart is a
          stub. Nothing persists — refresh loses intent.
      - key: lesson-16-02-why-store-id-on-cart-item
        file: 16.02-why-store-id-on-cart-item.md
        title: 16.2 — Why storeId on cart item
        goal: >-
          Checkout in Chapter 18 creates **one order per vendor** from a single customer checkout click. That split is
          trivial if every cart line already knows which store it came from.
      - key: lesson-16-03-what-youll-build
        file: 16.03-what-youll-build.md
        title: 16.3 — What you'll build
        goal: >-
          By chapter end, authenticated customers have a **persisted cart** — add, list, update quantity, remove lines —
          with **storeId on each item**, **stock checks on add**, and **strict user scoping**.
      - key: lesson-16-04-prime-your-thinking
        file: 16.04-prime-your-thinking.md
        title: 16.4 — Prime your thinking
        goal: >-
          Guest carts, login merge, and abandoned basket recovery are product decisions beyond MVP. This sub-chapter
          points at **cart merge on login** — you implement **authenticated cart only** for the gate, but mentors may
          ask what happens in a full marketplace.
      - key: lesson-16-05-quiz
        file: 16.05-quiz.md
        title: Cart boundaries
        goal: Check cart ownership, vendor grouping, and stock timing before mounting routes.
      - key: lesson-16-06-where-the-project-is-now
        file: 16.06-where-the-project-is-now.md
        title: 16.6 — Where the project is now
        goal: >-
          **Why this step matters:** Cart touches **auth, products, and multi-vendor split** — three systems at once.
          This recap confirms Chapter 15 browse and Chapter 5 CartItem model exist before you add routes that must never
          leak one user's basket to another.
      - key: lesson-16-07-scaffold-cart-module
        file: 16.07-scaffold-cart-module.md
        title: 16.7 — Scaffold cart module
        goal: >-
          **Why this step matters:** A dedicated `cart/` module with auth on the router sets the **security boundary**
          once — every cart route inherits `requireAuth` before you write handlers that touch user data.
      - key: lesson-16-08-add-to-cart-route
        file: 16.08-add-to-cart-route.md
        title: 16.8 — Add to cart route
        goal: >-
          Implement POST /cart: validate product and storeId, upsert a cart line for the logged-in customer. This is
          where multi-vendor cart lines are created.
      - key: lesson-16-09-get-cart-route
        file: 16.09-get-cart-route.md
        title: 16.9 — Get cart route
        goal: >-
          **Why this step matters:** GET /cart is what Chapter 17's page will render — populated product and store names
          avoid N+1 and give the UI everything for grouped display without extra fetches per line.
      - key: lesson-16-10-update-cart-item
        file: 16.10-update-cart-item.md
        title: 16.10 — Update cart item
        goal: >-
          **Why this step matters:** Quantity changes are the most common cart mutation — PATCH must stay
          **user-scoped** and re-check stock so customers cannot PATCH another user's itemId or order more than exists.
      - key: lesson-16-11-remove-cart-item
        file: 16.11-remove-cart-item.md
        title: 16.11 — Remove cart item
        goal: >-
          **Why this step matters:** DELETE completes CRUD — customers must remove mistakes before checkout. Same
          ownership rule as PATCH: only the cart owner can delete their line.
      - key: lesson-16-12-stock-check-on-add
        file: 16.12-stock-check-on-add.md
        title: 16.12 — Stock check on add
        goal: >-
          **Why this step matters:** Adding 999 tomatoes when only 3 exist should fail **now**, not at checkout — early
          rejection is clearer UX and protects checkout from obviously invalid carts.
      - key: lesson-16-13-user-scoping-test
        file: 16.13-user-scoping-test.md
        title: 16.13 — User scoping test
        goal: >-
          **Why this step matters:** Cart isolation is a **security gate** — User B must never read or mutate User A's
          itemIds. This explicit test prevents IDOR bugs that are embarrassing in demo and dangerous in production.
      - key: lesson-16-14-recap-and-whats-next
        file: 16.14-recap-and-whats-next.md
        title: 16.14 — Recap and what's next
        goal: >-
          **Why this step matters:** Chapter 17 wires React to these endpoints — if you cannot explain POST body fields
          and user scoping, the UI will send wrong payloads or skip `storeId`.
      - key: lesson-16-15-checklist
        file: 16.15-checklist.md
        title: 16.15 — Checklist and learning log
        goal: Gate for Chapter 16 — Cart API. Tick every box and answer the learning log on this page before continuing.
  - key: module-17-your-cart
    dir: 17-your-cart
    title: Your cart
    lessons:
      - key: lesson-17-01-set-the-scene
        file: 17.01-set-the-scene.md
        title: 17.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 16 gave you a **persisted cart API** — `POST /cart`, `GET /cart`,
          `PATCH` and `DELETE` on items. Items carry `productId`, `storeId`, and `quantity`. The API is user-scoped and
          accepts multi-vendor lines. Your customer can browse the marketpla
      - key: lesson-17-02-grouped-by-store
        file: 17.02-grouped-by-store.md
        title: 17.2 — Grouped by store
        goal: >-
          A cart with ten lines from three vendors is not one list — it is **three fulfilment promises**. Grouping by
          store is not decoration. It is the same boundary Chapter 18 uses when one checkout becomes multiple orders.
      - key: lesson-17-03-what-youll-build
        file: 17.03-what-youll-build.md
        title: 17.3 — What you'll build
        goal: >-
          This sub-chapter is the blueprint. No new API routes — just **client pages and components** wired to Chapter
          16 contracts. Read it once now; return after 17.10 and confirm your browser demo matches.
      - key: lesson-17-04-where-the-project-is-now
        file: 17.04-where-the-project-is-now.md
        title: 17.4 — Where the project is now
        goal: >-
          **Why this step matters:** Cart UI fails silently when API contracts drift — this continuity check confirms
          `GET /cart` shape, auth, and two-store seed **before** you build pages that assume them.
      - key: lesson-17-05-cart-page
        file: 17.05-cart-page.md
        title: 17.5 — Cart page
        goal: >-
          Build the cart page step by step: fetch from GET /cart, group items by store, show subtotals. This is the
          first screen where customers see the multi-vendor split before checkout.
      - key: lesson-17-06-quantity-controls
        file: 17.06-quantity-controls.md
        title: 17.6 — Quantity controls
        goal: >-
          Add + and − buttons to each cart row. Every click calls PATCH /cart/:itemId, then refetches GET /cart so the
          screen always matches the database.
      - key: lesson-17-07-remove-item
        file: 17.07-remove-item.md
        title: 17.7 — Remove item
        goal: >-
          Add a Remove button on each cart row. It calls DELETE /cart/:itemId, refetches the cart, and hides empty store
          sections.
      - key: lesson-17-08-wire-add-to-cart
        file: 17.08-wire-add-to-cart.md
        title: 17.8 — Wire add-to-cart
        goal: >-
          Connect the product detail page to POST /cart so customers can add items while browsing. This completes the
          browse → cart funnel for Week 3.
      - key: lesson-17-09-cart-icon-and-count
        file: 17.09-cart-icon-and-count.md
        title: 17.9 — Cart icon and header badge
        goal: >-
          Add a cart icon in the header with a live item count. Customers should see something is in the cart while
          browsing — without typing /cart in the URL.
      - key: lesson-17-10-verify-cart-persists
        file: 17.10-verify-cart-persists.md
        title: 17.10 — Verify cart persists
        goal: >-
          **Why this step matters:** Persistence is the whole point of Chapter 16 — reload, new tab, or re-login must
          show the same cart. If this fails, checkout in Chapter 18 has nothing reliable to read.
      - key: lesson-17-11-recap-and-whats-next
        file: 17.11-recap-and-whats-next.md
        title: 17.11 — Recap and what's next
        goal: >-
          **Why this step matters:** Chapter 18 checkout reads the **cart document** your UI just filled — recap
          confirms grouped display matches stored `storeId` before server-side order split.
      - key: lesson-17-12-quiz
        file: 17.12-quiz.md
        title: Honest cart state
        goal: >-
          Check where the store split is produced, how cart state stays honest after a mutation, and which cart the
          badge must show.
      - key: lesson-17-13-checklist
        file: 17.13-checklist.md
        title: 17.13 — Checklist and learning log
        goal: Gate for Chapter 17 — Your cart. Tick every box and answer the learning log on this page before continuing.
  - key: module-18-checkout-and-orders
    dir: 18-checkout-and-orders
    title: Checkout and orders
    lessons:
      - key: lesson-18-01-set-the-scene
        file: 18.01-set-the-scene.md
        title: 18.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapter 16–17 gave you a **multi-vendor cart** — persisted, user-scoped, visible
          in the browser grouped by store. No orders exist yet. Checkout is a button stub. Stock decrements only on
          manual vendor edits.
      - key: lesson-18-02-price-snapshot-trap
        file: 18.02-price-snapshot-trap.md
        title: 18.2 — Price snapshot trap
        goal: >-
          Store order lines as `{ productId, quantity }` only. Six months later the vendor changes basmati rice from
          ₹120/kg to ₹140/kg. Your order history page reloads and shows **₹140** for a purchase that happened at
          **₹120**. Accounting, customer trust, and your viva all fail.
      - key: lesson-18-03-what-youll-build
        file: 18.03-what-youll-build.md
        title: 18.3 — What you'll build
        goal: Blueprint for the **orders module** and checkout flow. Read once; verify against repo after 18.16.
      - key: lesson-18-04-normalization-payoff
        file: 18.04-normalization-payoff.md
        title: 18.4 — Normalization payoff
        goal: Learn why an order saves the name, unit, and price from checkout instead of reading today's product values.
      - key: lesson-18-05-atomic-stock-decrement
        file: 18.05-atomic-stock-decrement.md
        title: 18.5 — Atomic stock decrement
        goal: >-
          Two customers checkout the last bag of rice at the same time. Without atomic decrement, both succeed and you
          oversell by one. Grocery stock is often fractional and low — races are real even in class demos.
      - key: lesson-18-06-prime-your-thinking
        file: 18.06-prime-your-thinking.md
        title: 18.6 — Prime your thinking
        goal: >-
          Before scaffolding the orders module, read how production commerce systems avoid **double charge** and
          **duplicate orders**. Chapter 18 builds checkout **without** payment; Chapter 19 adds Stripe — but both share
          the same **at-most-once** instinct.
      - key: lesson-18-07-quiz
        file: 18.07-quiz.md
        title: Split orders and stock
        goal: Check split orders, immutable snapshots, and atomic stock handling.
      - key: lesson-18-08-where-the-project-is-now
        file: 18.08-where-the-project-is-now.md
        title: 18.8 — Where the project is now
        goal: >-
          **Why this step matters:** Checkout touches cart, products, orders, and stock in one flow — this pause
          confirms Order schema snapshot fields and a filled multi-vendor cart exist before you write transaction logic.
      - key: lesson-18-09-scaffold-orders-module
        file: 18.09-scaffold-orders-module.md
        title: 18.9 — Scaffold orders module
        goal: >-
          Create the orders module folder, mount routes, and stub handlers. Checkout logic lands in 18.10 — this step
          gives it a home.
      - key: lesson-18-10-checkout-route
        file: 18.10-checkout-route.md
        title: 18.10 — Checkout route
        goal: >-
          Implement POST /checkout: load the cart, group lines by storeId, create one Order per vendor. This is the
          spine of multi-vendor checkout.
      - key: lesson-18-11-snapshot-order-lines
        file: 18.11-snapshot-order-lines.md
        title: 18.11 — Snapshot order lines
        goal: >-
          Copy name, price, and unit onto each order line at checkout time. Order history must never change when a
          vendor edits their catalogue.
      - key: lesson-18-12-stock-decrement
        file: 18.12-stock-decrement.md
        title: 18.12 — Stock decrement
        goal: >-
          Atomically reduce stockQty when checkout succeeds. If any product is out of stock, the entire checkout fails —
          no partial orders.
      - key: lesson-18-13-clear-cart-on-success
        file: 18.13-clear-cart-on-success.md
        title: 18.13 — Clear cart on success
        goal: >-
          After successful checkout, delete all cart items for the customer. Without this, they can double-order with
          one more POST.
      - key: lesson-18-14-vendor-orders-route
        file: 18.14-vendor-orders-route.md
        title: 18.14 — Vendor orders route
        goal: >-
          **Why this step matters:** Split orders only matter if vendors can **see their half** — this route scopes by
          store ownership from Chapter 8 so Vendor B never receives Vendor A's fulfilment list.
      - key: lesson-18-15-customer-orders-route
        file: 18.15-customer-orders-route.md
        title: 18.15 — Customer orders route
        goal: >-
          **Why this step matters:** Customers need **order history** without re-running checkout — `GET /orders/my`
          returns embedded snapshot lines only, training the read path Chapter 20 UI will use.
      - key: lesson-18-16-test-snapshot-immutability
        file: 18.16-test-snapshot-immutability.md
        title: 18.16 — Test snapshot immutability
        goal: >-
          **Why this step matters:** This is the **proof** snapshots work — change product price after checkout, reload
          orders, old price must remain. Do not skip; it catches populate-on-read mistakes that pass every other test.
      - key: lesson-18-17-recap-and-whats-next
        file: 18.17-recap-and-whats-next.md
        title: 18.17 — Recap and what's next
        goal: >-
          **Why this step matters:** Chapter 19 adds Stripe; Chapter 20 adds checkout **UI** on top of this API — you
          need a crisp story for split orders, snapshots, and fail-all semantics before payment and buttons.
      - key: lesson-18-18-checklist
        file: 18.18-checklist.md
        title: 18.18 — Checklist and learning log
        goal: >-
          Gate for Chapter 18 — Checkout and orders. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-19-payment-processing
    dir: 19-payment-processing
    title: Payment processing
    lessons:
      - key: lesson-19-01-set-the-scene
        file: 19.01-set-the-scene.md
        title: 19.1 — Set the scene
        goal: >-
          Chapter 18 can create split orders, but it cannot prove a customer paid. Add a server-owned Stripe flow
          without trusting browser totals or creating duplicate orders.
      - key: lesson-19-02-fake-checkout-trap
        file: 19.02-fake-checkout-trap.md
        title: 19.2 — Fake checkout trap
        goal: >-
          Chapter 18's `POST /checkout` creates orders, reduces stock, and clears the cart — **without checking whether
          anyone paid**. That was the right teaching order. It is **not** production.
      - key: lesson-19-03-what-youll-build
        file: 19.03-what-youll-build.md
        title: 19.3 — What you'll build
        goal: >-
          Blueprint for the **payments module**, Stripe config, checkout refactor, and webhook route. Read once; verify
          against repo after 19.16.
      - key: lesson-19-04-one-payment-many-orders
        file: 19.04-one-payment-many-orders.md
        title: 19.4 — One payment, many orders
        goal: >-
          FreshMarket is a **market hall**, not a single shop. The customer fills one basket from Green Valley and
          Harbor Market, pays **once**, and receives **two fulfilment orders**. This sub-chapter teaches the payment
          model beginners confuse most.
      - key: lesson-19-05-stripe-test-mode
        file: 19.05-stripe-test-mode.md
        title: 19.5 — Stripe test mode
        goal: >-
          You will never touch real card numbers in this course. **Test mode** gives you the same API shapes, Dashboard
          views, and error codes — with fake money and test keys.
      - key: lesson-19-06-prime-your-thinking
        file: 19.06-prime-your-thinking.md
        title: 19.6 — Prime your thinking
        goal: >-
          Before scaffolding Stripe config and routes, read how Payment Intents and webhooks work in production. You
          will not paste Stripe's sample Express app wholesale — but you must understand **why** the flow is two-step
          (intent → confirm → verify) and **why** webhooks use raw bodies.
      - key: lesson-19-07-quiz
        file: 19.07-quiz.md
        title: Payment trust boundary
        goal: Check payment trust boundaries, webhook verification, and idempotency.
      - key: lesson-19-08-where-the-project-is-now
        file: 19.08-where-the-project-is-now.md
        title: 19.8 — Where the project is now
        goal: >-
          **Why this step matters:** Payment touches checkout, cart totals, Order schema, and a new webhook route — this
          pause confirms Chapter 18 gate is real before you add Stripe dependencies.
      - key: lesson-19-09-stripe-config
        file: 19.09-stripe-config.md
        title: 19.9 — Stripe config
        goal: >-
          **Why this step matters:** Every payment and webhook route shares one Stripe SDK client configured from env —
          duplicate `new Stripe(...)` calls scatter key handling and make test/live mistakes easier.
      - key: lesson-19-10-payment-intent-route
        file: 19.10-payment-intent-route.md
        title: 19.10 — Payment Intent route
        goal: >-
          Implement POST /payments/intent: compute cart total on server, create Stripe Payment Intent, return
          clientSecret for the checkout UI.
      - key: lesson-19-11-payment-gated-checkout
        file: 19.11-payment-gated-checkout.md
        title: 19.11 — Payment-gated checkout
        goal: >-
          Refactor POST /checkout to require paymentIntentId and verify payment succeeded with Stripe before creating
          orders.
      - key: lesson-19-12-webhook-handler
        file: 19.12-webhook-handler.md
        title: 19.12 — Webhook handler
        goal: >-
          **Why this step matters:** Customers close tabs. Networks drop. Your server might crash after Stripe marks a
          Payment Intent **succeeded** but before `POST /checkout` finishes. Webhooks are Stripe's **retryable phone
          call** — "this payment really succeeded."
      - key: lesson-19-13-idempotency-and-double-submit
        file: 19.13-idempotency-and-double-submit.md
        title: 19.13 — Idempotency and double-submit
        goal: >-
          Chapter 18 warned: double-click "Place order" could create duplicate order sets. Payment adds a **natural
          idempotency key** — the Payment Intent id. Same charge must never produce two sets of split orders.
      - key: lesson-19-14-verify-with-test-cards
        file: 19.14-verify-with-test-cards.md
        title: 19.14 — Verify with test cards
        goal: >-
          **Why this step matters:** Payment integrations fail in invisible ways — wrong amount unit, unconfirmed PI,
          signature parse errors. This sub-chapter is your **proof script** before Chapter 19 gate and before Chapter 20
          UI.
      - key: lesson-19-15-recap-and-whats-next
        file: 19.15-recap-and-whats-next.md
        title: 19.15 — Recap and what's next
        goal: >-
          **Why this step matters:** Chapter 20 adds checkout **UI** with Stripe.js on top of this API — you need a
          crisp story for Payment Intents, gated checkout, and one-payment-many-orders before building buttons.
      - key: lesson-19-16-checklist
        file: 19.16-checklist.md
        title: 19.16 — Checklist and learning log
        goal: >-
          Gate for Chapter 19 — Payment processing. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-20-track-orders
    dir: 20-track-orders
    title: Track orders
    lessons:
      - key: lesson-20-01-set-the-scene
        file: 20.01-set-the-scene.md
        title: 20.1 — Set the scene
        goal: >-
          **Where the project is now:** Chapters 18–19 gave you **checkout API** with Stripe gate — split orders,
          snapshots, stock decrement, cart clear, `paymentStatus: paid`, Payment Intent verified. Payment works via
          curl/Stripe CLI; the customer still needs a checkout screen with a car
      - key: lesson-20-02-snapshots-make-ui-easy
        file: 20.02-snapshots-make-ui-easy.md
        title: 20.2 — Snapshots make UI easy
        goal: >-
          Order history UI would be fragile if every row required a live product fetch. **Snapshots mean the list
          endpoint is the only read** — no N+1 populate for price, no surprise when vendor deletes a product.
      - key: lesson-20-03-what-youll-build
        file: 20.03-what-youll-build.md
        title: 20.3 — What you'll build
        goal: >-
          Blueprint for **order tracking UI** — no new backend routes except optional status PATCH if not added in Ch
          18.
      - key: lesson-20-04-where-the-project-is-now
        file: 20.04-where-the-project-is-now.md
        title: 20.4 — Where the project is now
        goal: >-
          **Why this step matters:** UI built on broken APIs wastes hours — wrong JSON shapes, missing routes, and
          snapshot fields you never tested in curl all become mysterious React bugs. Five minutes of API proof here
          saves an afternoon of debugging empty confirmation pages.
      - key: lesson-20-05-checkout-page
        file: 20.05-checkout-page.md
        title: 20.5 — Checkout page
        goal: >-
          **Why this step matters:** This is where cart, Stripe, and checkout API meet — the climax of Week 3. Customers
          review their order, pay with a test card, and trigger gated `POST /checkout`.
      - key: lesson-20-06-order-confirmation-page
        file: 20.06-order-confirmation-page.md
        title: 20.6 — Order confirmation page
        goal: >-
          Build /orders/confirmation: show split orders after checkout using snapshot fields — the Week 3 receipt
          moment.
      - key: lesson-20-07-customer-orders-page
        file: 20.07-customer-orders-page.md
        title: 20.7 — Customer orders page
        goal: >-
          **Why this step matters:** Confirmation is a one-time screen — order history is where customers return days
          later. This page proves snapshot prices stay correct when vendors change the catalogue.
      - key: lesson-20-08-vendor-orders-page
        file: 20.08-vendor-orders-page.md
        title: 20.8 — Vendor orders page
        goal: >-
          **Why this step matters:** Vendors cannot fulfil orders they cannot see. This inbox completes the marketplace
          loop — without it, Week 3 demo stops at the customer side only.
      - key: lesson-20-09-order-status-badge
        file: 20.09-order-status-badge.md
        title: 20.9 — Order status badge
        goal: >-
          **Why this step matters:** One shared badge component keeps status labels consistent across confirmation,
          customer history, and vendor inbox — without it, the same order shows "Pending" in one place and "pending" in
          another.
      - key: lesson-20-10-vendor-update-status
        file: 20.10-vendor-update-status.md
        title: 20.10 — Vendor update status
        goal: >-
          **Why this step matters:** Static order lists are read-only theatre — vendors must advance fulfilment and
          customers must see progress. This step also rehearses ownership checks you will enqueue notifications for in
          Chapter 22.
      - key: lesson-20-11-full-commerce-demo
        file: 20.11-full-commerce-demo.md
        title: 20.11 — Full commerce demo
        goal: >-
          **Why this step matters:** Individual pages passing is not the Week 3 gate — the **ten-step script** across
          three browser personas is. Recorded proof here becomes your portfolio demo and Chapter 99 deliverable.
      - key: lesson-20-12-recap-and-whats-next
        file: 20.12-recap-and-whats-next.md
        title: 20.12 — Recap and what's next
        goal: >-
          Chapter 20 completed the **buyer and vendor order experience** — checkout UI, split confirmation, history,
          vendor inbox, status updates, and the Week 3 demo.
      - key: lesson-20-13-quiz
        file: 20.13-quiz.md
        title: Receipts and status
        goal: Check order snapshots, fulfilment status transitions, and store-scoped order views in FreshMarket.
      - key: lesson-20-14-checklist
        file: 20.14-checklist.md
        title: 20.14 — Checklist and learning log
        goal: Gate for Chapter 20 — Track orders. Tick every box and answer the learning log on this page before continuing.
  - key: module-21-cache-and-search
    dir: 21-cache-and-search
    title: Cache and search
    lessons:
      - key: lesson-21-01-set-the-scene
        file: 21.01-set-the-scene.md
        title: 21.1 — Set the scene
        goal: >-
          **Where the project is now:** Week 3 commerce works locally — browse, cart, checkout, orders. Every `GET
          /products` hits MongoDB. Search may be slow regex or unindexed. Fine for demo; wrong for scale.
      - key: lesson-21-02-stale-cache-trap
        file: 21.02-stale-cache-trap.md
        title: 21.2 — Stale cache trap
        goal: >-
          Vendor changes milk price from ₹65 to ₹70. Customer still sees ₹65 for an hour because catalogue response was
          **cached without invalidation**. Trust erodes faster than slow pages.
      - key: lesson-21-03-what-youll-build
        file: 21.03-what-youll-build.md
        title: 21.3 — What you'll build
        goal: Blueprint for the **performance layer** on catalogue reads. Read once; verify against your repo after 21.14.
      - key: lesson-21-04-ttl-vs-event-invalidation
        file: 21.04-ttl-vs-event-invalidation.md
        title: 21.4 — TTL vs event invalidation
        goal: Production caches use **both**. TTL is a safety net; invalidation is correctness on writes.
      - key: lesson-21-05-prime-your-thinking
        file: 21.05-prime-your-thinking.md
        title: 21.5 — Prime your thinking
        goal: >-
          **Mandatory read:** Cache invalidation articles — search "cache invalidation strategies" and Redis GET/SET
          docs.
      - key: lesson-21-06-quiz
        file: 21.06-quiz.md
        title: Cache safety
        goal: Check cache safety, failure behavior, and grocery search indexing.
      - key: lesson-21-07-where-the-project-is-now
        file: 21.07-where-the-project-is-now.md
        title: 21.7 — Where the project is now
        goal: >-
          **Why this step matters:** You cannot prove cache helped if you never recorded baseline speed. This continuity
          step captures "before Redis" timings and confirms commerce still works — the reference point for every
          HIT/MISS test in 21.9–21.10.
      - key: lesson-21-08-redis-connection
        file: 21.08-redis-connection.md
        title: 21.8 — Redis connection
        goal: >-
          Create one server-side Redis connection boundary that supports catalogue caching now and BullMQ in Chapter 22
          without making Redis a requirement for browsing.
      - key: lesson-21-09-cache-catalogue-middleware
        file: 21.09-cache-catalogue-middleware.md
        title: 21.9 — Cache catalogue middleware
        goal: >-
          **Why this step matters:** This is the core cache-aside pattern — the shop window stops hitting MongoDB on
          every repeat glance. HIT/MISS logs here are your first proof the performance layer works.
      - key: lesson-21-10-measure-before-after
        file: 21.10-measure-before-after.md
        title: 21.10 — Measure before/after
        goal: >-
          **Why this step matters:** Interviewers ask "did caching help?" — honest before/after numbers in README turn a
          tutorial exercise into evidence. Even modest gains on a small seed prove you measured, not guessed.
      - key: lesson-21-11-cache-bust-on-product-save
        file: 21.11-cache-bust-on-product-save.md
        title: 21.11 — Cache bust on product save
        goal: >-
          **Why this step matters:** Without invalidation, your fast cache serves wrong prices — the stale trap from
          21.2 becomes a real bug. This step is what makes caching **safe** for a marketplace, not just fast.
      - key: lesson-21-12-text-index
        file: 21.12-text-index.md
        title: 21.12 — Text index
        goal: >-
          **Why this step matters:** Regex search on every product row slows down as the catalogue grows. A text index
          is the MongoDB-native way to make `?search=rice` scale — Week 4 demo expects search on production.
      - key: lesson-21-13-explain-query
        file: 21.13-explain-query.md
        title: 21.13 — Explain query
        goal: >-
          **Why this step matters:** "We added search" is weak in a viva — `explain()` proof that MongoDB uses your
          index, not a full collection scan, shows you verified performance instead of assuming.
      - key: lesson-21-14-fallback-if-redis-down
        file: 21.14-fallback-if-redis-down.md
        title: 21.14 — Fallback if Redis down
        goal: >-
          **Why this step matters:** Production Redis restarts, misconfigured URLs, and free-tier limits happen. An app
          that crashes when cache is unavailable is not shippable — degraded speed is acceptable; downtime is not.
      - key: lesson-21-15-recap-and-whats-next
        file: 21.15-recap-and-whats-next.md
        title: 21.15 — Recap and what's next
        goal: >-
          Chapter 21 added **performance and discoverability** — Redis cache-aside on catalogue, write invalidation,
          text search index, Redis-down fallback.
      - key: lesson-21-16-checklist
        file: 21.16-checklist.md
        title: 21.16 — Checklist and learning log
        goal: >-
          Gate for Chapter 21 — Cache and search. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-22-async-jobs-and-queues
    dir: 22-async-jobs-and-queues
    title: Async jobs and queues
    lessons:
      - key: lesson-22-01-set-the-scene
        file: 22.01-set-the-scene.md
        title: 22.1 — Set the scene
        goal: >-
          **Where the project is now:** Week 4 polish underway — catalogue cached in Redis (Chapter 21), commerce flow
          complete in browser (Chapters 18–19). Checkout creates orders, decrements stock, clears cart. **No
          notifications** run after checkout or status changes.
      - key: lesson-22-02-the-sync-trap
        file: 22.02-the-sync-trap.md
        title: 22.2 — The sync trap
        goal: >-
          You add `sendOrderConfirmationEmail(customer)` inside the checkout handler. Demo day: Mailgun times out after
          30 seconds. Checkout returns **500** even though orders were created and stock decremented. Customer sees
          error; database shows success. Support nightmare.
      - key: lesson-22-03-what-youll-build
        file: 22.03-what-youll-build.md
        title: 22.3 — What you'll build
        goal: Blueprint for **BullMQ jobs** on the same Redis from Chapter 22. Read once; verify against repo after 22.15.
      - key: lesson-22-04-when-to-queue
        file: 22.04-when-to-queue.md
        title: 22.4 — When to queue
        goal: >-
          Not every server action belongs in a worker. Use this table when deciding sync vs async for FreshMarket
          features.
      - key: lesson-22-05-bullmq-and-redis
        file: 22.05-bullmq-and-redis.md
        title: 22.5 — BullMQ and Redis
        goal: >-
          Chapter 21 used Redis for **cache keys** (`catalogue:*`). Chapter 22 uses the **same Redis server** for
          **BullMQ queues** — different data structures, different key prefixes. One `REDIS_URL`, two purposes.
      - key: lesson-22-06-prime-your-thinking
        file: 22.06-prime-your-thinking.md
        title: 22.6 — Prime your thinking
        goal: >-
          Before you write `shared/queue.js` and `worker.js`, read how **BullMQ** expects Queues and Workers to connect
          to Redis. This sub-chapter is a **mandatory reading assignment**.
      - key: lesson-22-07-quiz
        file: 22.07-quiz.md
        title: Queue boundaries
        goal: Check queue boundaries, worker responsibilities, and failure behavior.
      - key: lesson-22-08-where-the-project-is-now
        file: 22.08-where-the-project-is-now.md
        title: 22.8 — Where the project is now
        goal: >-
          **Why this step matters:** BullMQ wiring on top of a broken checkout or dead Redis wastes a day. This
          checkpoint confirms commerce and cache baselines before you add a second process to your dev workflow.
      - key: lesson-22-09-queue-module
        file: 22.09-queue-module.md
        title: 22.9 — Queue module
        goal: >-
          **Why this step matters:** The queue module is the API's outbound mailbox — every async job in this chapter
          enqueues through here. One shared module prevents queue-name typos that silently drop jobs.
      - key: lesson-22-10-worker-process
        file: 22.10-worker-process.md
        title: 22.10 — Worker process
        goal: >-
          **Why this step matters:** Jobs enqueued without a running worker sit in Redis forever — checkout "works" but
          nothing notifies. A separate worker entry is the architectural lesson of this chapter and a production
          requirement in Chapter 23.
      - key: lesson-22-11-order-created-job
        file: 22.11-order-created-job.md
        title: 22.11 — Order created job
        goal: >-
          **Why this step matters:** This is where you escape the sync trap — **paid** checkout commits commerce state,
          then hands notifications to the queue. The enqueue call site order (after DB writes) is the most common bug in
          async checkout implementations.
      - key: lesson-22-12-order-created-processor
        file: 22.12-order-created-processor.md
        title: 22.12 — Order created processor
        goal: >-
          **Why this step matters:** Enqueue without a processor is a message nobody reads. `[NOTIFY]` logs here are the
          gate proof that multi-vendor checkout triggers one vendor line per store plus one customer summary.
      - key: lesson-22-13-order-status-job
        file: 22.13-order-status-job.md
        title: 22.13 — Order status job
        goal: >-
          **Why this step matters:** Status changes are the second hot path for side effects — vendors PATCH fast,
          customers learn later. Queuing here keeps fulfilment UI snappy and mirrors how real marketplaces notify on
          dispatch.
      - key: lesson-22-14-retries-and-idempotency
        file: 22.14-retries-and-idempotency.md
        title: 22.14 — Retries and idempotency
        goal: >-
          **Why this step matters:** Networks blip and processors crash mid-job — retries turn "best-effort notify" into
          resilient notify. `jobId` dedup stops double-click enqueue from spamming duplicate mock emails.
      - key: lesson-22-15-verify-async-flow
        file: 22.15-verify-async-flow.md
        title: 22.15 — Verify async flow
        goal: >-
          Prove processor work is outside the HTTP critical path, then verify delivery, retry, deduplication, and
          failure visibility.
      - key: lesson-22-16-cache-invalidation-job
        file: 22.16-cache-invalidation-job.md
        title: 22.16 — Cache invalidation job
        goal: >-
          **Why this step matters:** Optional but instructive — it connects Chapters 20 and 21 by moving slow cache bust
          off the vendor PATCH response. Even if you skip it, reading the tradeoff prepares you for "sync vs async
          invalidation" questions in viva.
      - key: lesson-22-17-recap-and-whats-next
        file: 22.17-recap-and-whats-next.md
        title: 22.17 — Recap and what's next
        goal: >-
          Chapter 22 moved **notifications and optional cache bust** off the HTTP hot path — BullMQ on the same Redis as
          Chapter 21, separate worker process, commerce responses stay fast.
      - key: lesson-22-18-checklist
        file: 22.18-checklist.md
        title: 22.18 — Checklist and learning log
        goal: >-
          Gate for Chapter 22 — Async jobs and queues. Tick every box and answer the learning log on this page before
          continuing.
  - key: module-23-deploy
    dir: 23-deploy
    title: Deploy
    lessons:
      - key: lesson-23-01-set-the-scene
        file: 23.01-set-the-scene.md
        title: 23.1 — Set the scene
        goal: >-
          **Where the project is now:** Full marketplace on localhost — auth, vendor dashboard, customer shop, cart,
          checkout, orders, cache, search, **async worker** (Chapter 22). Mentors cannot click your demo URL because
          **there is no public URL**.
      - key: lesson-23-02-secrets-in-git-forever
        file: 23.02-secrets-in-git-forever.md
        title: 23.2 — Secrets in Git forever
        goal: >-
          Before deploy, re-run Chapter 4 discipline at production scale. **`git log -- .env` must be empty.**
          Production credentials pasted into README or learning log disqualify the gate.
      - key: lesson-23-03-what-youll-build
        file: 23.03-what-youll-build.md
        title: 23.3 — What you'll build
        goal: >-
          Deploy is not one button — it is a **checklist of deliverables** that prove your localhost app lives on the
          internet. Read this before choosing a host in 23.4.
      - key: lesson-23-04-vps-vs-paas
        file: 23.04-vps-vs-paas.md
        title: 23.4 — VPS vs PaaS
        goal: Pick **one deploy path** for this course. Document in README — not every option.
      - key: lesson-23-05-prime-your-thinking
        file: 23.05-prime-your-thinking.md
        title: 23.5 — Prime your thinking
        goal: >-
          **Mandatory read:** Your chosen host's deploy docs + [Let's Encrypt](https://letsencrypt.org/docs/) basics if
          self-hosting TLS.
      - key: lesson-23-06-quiz
        file: 23.06-quiz.md
        title: Production config
        goal: Check production configuration, CORS, and smoke-test decisions before deployment.
      - key: lesson-23-07-where-the-project-is-now
        file: 23.07-where-the-project-is-now.md
        title: 23.7 — Where the project is now
        goal: >-
          **Why this step matters:** Deploying a broken local build wastes platform setup time. This step proves API +
          worker + client still run together and `npm run build` passes before you configure production hosts.
      - key: lesson-23-08-production-env-checklist
        file: 23.08-production-env-checklist.md
        title: 23.8 — Production env checklist
        goal: Inventory runtime configuration separately for the API, worker, and public client build before deployment.
      - key: lesson-23-09-build-client-for-production
        file: 23.09-build-client-for-production.md
        title: 23.9 — Build client for production
        goal: >-
          **Why this step matters:** A live client that still calls `localhost:5000` is the most common deploy failure —
          Vite bakes the API URL at build time, so this step locks the browser to your production API forever (until you
          rebuild).
      - key: lesson-23-10-deploy-api
        file: 23.10-deploy-api.md
        title: 23.10 — Deploy API and worker
        goal: >-
          Deploy the API and worker as separate processes, verify dependency readiness, and record a rollback target
          before exposing the client.
      - key: lesson-23-11-domain-and-https
        file: 23.11-domain-and-https.md
        title: 23.11 — Domain and HTTPS
        goal: >-
          **Why this step matters:** HTTP-only demos fail the gate and break secure cookies from Chapter 7. HTTPS is
          what makes your URL pasteable in a portfolio without mentors seeing browser security warnings.
      - key: lesson-23-12-deploy-client
        file: 23.12-deploy-client.md
        title: 23.12 — Deploy client
        goal: >-
          **Why this step matters:** Mentors evaluate the **shop URL**, not your git repo. This step puts the React
          build where browsers can load it — with SPA fallback so `/shop` refresh does not 404.
      - key: lesson-23-13-smoke-test-production
        file: 23.13-smoke-test-production.md
        title: 23.13 — Smoke test production
        goal: >-
          Verify the critical production journey, observe webhook and worker effects, and rehearse a low-risk rollback
          before announcing the release.
      - key: lesson-23-14-restart-survival-test
        file: 23.14-restart-survival-test.md
        title: 23.14 — Restart survival test
        goal: >-
          Restart API and worker independently, prove queued work survives, and measure recovery instead of relying on a
          process dashboard.
      - key: lesson-23-15-recap-and-whats-next
        file: 23.15-recap-and-whats-next.md
        title: 23.15 — Recap and what's next
        goal: >-
          Chapter 23 moved FreshMarket from **localhost to HTTPS** — production env, client build, API deploy, **worker
          deploy**, smoke tests, restart survival.
      - key: lesson-23-16-checklist
        file: 23.16-checklist.md
        title: 23.16 — Checklist and learning log
        goal: Gate for Chapter 23 — Deploy. Tick every box and answer the learning log on this page before continuing.
  - key: module-24-inventory-reservations
    dir: 24-inventory-reservations
    title: Inventory reservations
    lessons:
      - key: lesson-24-01-set-the-scene
        file: 24.01-set-the-scene.md
        title: 24.01 — Set the scene
        goal: >-
          After deploy, FreshMarket still has a grocery-grade gap: two shoppers can buy the last kilo of tomatoes. This
          module adds time-bound stock holds and payment-confirmed decrements.
      - key: lesson-24-02-why-overselling-hurts-trust
        file: 24.02-why-overselling-hurts-trust.md
        title: 24.02 — Why overselling hurts trust
        goal: >-
          Race conditions at checkout are normal at scale. Grocery customers remember substitutions and refunds more
          than slick UI.
      - key: lesson-24-03-what-youll-build
        file: 24.03-what-youll-build.md
        title: 24.03 — What you'll build
        goal: >-
          A reservation state machine, checkout integration, webhook confirm, and expiry worker — with ATP exposed on
          product reads.
      - key: lesson-24-04-reserve-vs-decrement
        file: 24.04-reserve-vs-decrement.md
        title: 24.04 — Reserve vs decrement
        goal: >-
          Reservations gate sellability during payment; decrements happen once money is certain. Mixing the two causes
          ghost stock or overselling.
      - key: lesson-24-05-prime-your-thinking
        file: 24.05-prime-your-thinking.md
        title: 24.05 — Prime your thinking
        goal: Sketch the checkout timeline and webhook order before touching models.
      - key: lesson-24-06-quiz
        file: 24.06-quiz.md
        title: Stock reservations
        goal: Check inventory reservation concepts before implementation.
      - key: lesson-24-07-where-the-project-is-now
        file: 24.07-where-the-project-is-now.md
        title: 24.07 — Where the project is now
        goal: Baseline after deploy — commerce works but ATP equals stockQty. You will extend checkout and webhook paths.
      - key: lesson-24-08-reservation-schema-and-indexes
        file: 24.08-reservation-schema-and-indexes.md
        title: 24.08 — Reservation schema and indexes
        goal: Add StockReservation plus Product.reservedQty, with retry-safe and expiry indexes.
      - key: lesson-24-09-reserve-stock-at-checkout
        file: 24.09-reserve-stock-at-checkout.md
        title: 24.09 — Reserve stock at checkout
        goal: Before PaymentIntent creation, atomically claim reservedQty per line and persist matching holds.
      - key: lesson-24-10-confirm-and-release-on-payment
        file: 24.10-confirm-and-release-on-payment.md
        title: 24.10 — Confirm and release on payment
        goal: Webhook confirms reservations and decrements stockQty with guards; cancel path releases active holds.
      - key: lesson-24-11-expiry-worker-for-holds
        file: 24.11-expiry-worker-for-holds.md
        title: 24.11 — Expiry worker for holds
        goal: BullMQ repeatable job or sweep releases active reservations past expiresAt without racing confirm.
      - key: lesson-24-12-verify-concurrent-checkout
        file: 24.12-verify-concurrent-checkout.md
        title: 24.12 — Verify concurrent checkout
        goal: Prove two parallel checkout starts cannot both reserve the last unit; document results for the gate.
      - key: lesson-24-13-recap-and-whats-next
        file: 24.13-recap-and-whats-next.md
        title: 24.13 — Recap and what's next
        goal: Reservations close the overselling gap; promotions are the next fraud and margin surface.
      - key: lesson-24-14-checklist
        file: 24.14-checklist.md
        title: 24.14 — Checklist and learning log
        goal: Gate for Chapter 24 — inventory reservations. Prove concurrency and TTL behaviour.
  - key: module-25-promotions-and-pricing
    dir: 25-promotions-and-pricing
    title: Promotions & pricing
    lessons:
      - key: lesson-25-01-set-the-scene
        file: 25.01-set-the-scene.md
        title: 25.01 — Set the scene
        goal: >-
          Coupons and promotions are where marketplaces lose margin or get defrauded. This module adds a server-side
          rules engine and checkout snapshots.
      - key: lesson-25-02-why-never-trust-client-totals
        file: 25.02-why-never-trust-client-totals.md
        title: 25.02 — Why never trust client totals
        goal: >-
          Any total computed only in React can be forged. Production checkout re-prices on the server and passes that
          amount to Stripe.
      - key: lesson-25-03-what-youll-build
        file: 25.03-what-youll-build.md
        title: 25.03 — What you'll build
        goal: >-
          Coupon + redemption collections, validate/apply/remove routes, pricing service, checkout integration, abuse
          limits.
      - key: lesson-25-04-coupon-types-and-rules
        file: 25.04-coupon-types-and-rules.md
        title: 25.04 — Coupon types and rules
        goal: Percent vs fixed discounts, caps, eligibility, and allocation order across multi-vendor carts.
      - key: lesson-25-05-prime-your-thinking
        file: 25.05-prime-your-thinking.md
        title: 25.05 — Prime your thinking
        goal: Walk through a multi-vendor cart with a platform percent coupon before coding.
      - key: lesson-25-06-quiz
        file: 25.06-quiz.md
        title: Pricing trust boundary
        goal: Promotions trust boundary and rule checks.
      - key: lesson-25-07-where-the-project-is-now
        file: 25.07-where-the-project-is-now.md
        title: 25.07 — Where the project is now
        goal: >-
          Checkout snapshots line prices from Chapter 18; no coupon layer yet. PaymentIntent uses pre-discount totals
          until you extend pricing.
      - key: lesson-25-08-coupon-and-redemption-models
        file: 25.08-coupon-and-redemption-models.md
        title: 25.08 — Coupon and redemption models
        goal: Mongoose schemas for Coupon and CouponRedemption with unique code index.
      - key: lesson-25-09-validate-coupon-api
        file: 25.09-validate-coupon-api.md
        title: 25.09 — Validate coupon API
        goal: Central validateCoupon function and POST /cart/coupon route returning pricing preview or generic error.
      - key: lesson-25-10-recalculate-cart-totals
        file: 25.10-recalculate-cart-totals.md
        title: 25.10 — Recalculate cart totals
        goal: computeCartPricing with percent/fixed logic and proportional line allocation.
      - key: lesson-25-11-snapshot-discounts-on-order
        file: 25.11-snapshot-discounts-on-order.md
        title: 25.11 — Snapshot discounts on order
        goal: Checkout start uses computeCartPricing for PaymentIntent; orders store discount fields and redemption rows.
      - key: lesson-25-12-rate-limits-and-abuse
        file: 25.12-rate-limits-and-abuse.md
        title: 25.12 — Rate limits and abuse
        goal: Throttle coupon attempts; generic errors; logging for mentor dashboards.
      - key: lesson-25-13-recap-and-whats-next
        file: 25.13-recap-and-whats-next.md
        title: 25.13 — Recap and what's next
        goal: Server-owned pricing with coupons; ready for Chapter 99 portfolio closure.
      - key: lesson-25-14-checklist
        file: 25.14-checklist.md
        title: 25.14 — Checklist and learning log
        goal: Gate for Chapter 25 — promotions and server-side pricing.
  - key: module-99-closing
    dir: 99-closing
    title: Closing
    lessons:
      - key: lesson-99-01-ship-it
        file: 99.01-ship-it.md
        title: 99.1 — Ship it
        goal: >-
          Chapter 23 put your app on HTTPS. Chapter 99 is the **deliverable layer** — proof that you built a real
          marketplace, not a tutorial clone. The live URL is necessary; it is not sufficient.
      - key: lesson-99-02-document-it
        file: 99.02-document-it.md
        title: 99.2 — Document it
        goal: >-
          Hiring managers and mentors cannot read 22 chapters. They read **three docs and watch one video**. This
          sub-chapter specifies what to commit under `docs/`.
      - key: lesson-99-03-bar-raiser-and-evaluation
        file: 99.03-bar-raiser-and-evaluation.md
        title: 99.3 — Bar-raiser and evaluation
        goal: >-
          You shipped code and docs. This sub-chapter is the **evaluation contract** — one-line bar-raiser, viva
          questions, portfolio framing, and final learning log gate.
