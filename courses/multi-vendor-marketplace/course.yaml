        lessons:
          - key: books-19-01
            file: 19.01-set-the-scene.md
            title: '19.1: One list, three shops'
            goal: Follow a matched reading list into a checkout with several shops and unique physical copies.
          - key: books-19-02
            file: 19.02-the-condition-snapshot-trap.md
            title: '19.2: The condition snapshot trap'
            goal: >-
              Predict how regrading a copy can misstate an earlier purchase when orders read live
              Listings.
          - key: books-19-03
            file: 19.03-what-to-snapshot.md
            title: '19.3: What to snapshot'
            goal: Define the bibliographic and copy-specific terms an OrderLine must preserve.
          - key: books-19-04
            file: 19.04-selling-a-single-copy-atomically.md
            title: '19.4: Claiming a single copy atomically'
            goal: Reserve one Listing with a conditional state update so competing students cannot both win.
          - key: books-19-05
            file: 19.05-quiz.md
            title: '19.5: Checkout and condition check'
            goal: Check the Listing claim, split Order, condition snapshot and payment boundary.
          - key: books-19-06
            file: 19.06-checkout-route-split-by-shop.md
            title: '19.6: Checkout route split by Shop'
            goal: >-
              Create one pending Checkout with a separate Order for each Shop after validating selected
              copies.
          - key: books-19-07
            file: 19.07-snapshot-order-lines.md
            title: '19.7: Snapshot OrderLines'
            goal: Store the exact Edition and condition offer on each Shop OrderLine.
          - key: books-19-08
            file: 19.08-hold-copies-all-or-nothing.md
            title: '19.8: Hold copies, all or nothing'
            goal: Claim every selected Listing or unwind this Checkout's own claims and partial Orders.
          - key: books-19-09
            file: 19.09-shop-and-student-order-routes.md
            title: '19.9: Shop and student order routes'
            goal: Show each student their split Orders and each Shop only its own pending Orders.
          - key: books-19-10
            file: 19.10-snapshot-test-and-checklist.md
            title: '19.10: Snapshot test and checklist'
            goal: >-
              Demonstrate one-winner claims, complete split Orders, scoped reads and historical condition
              snapshots.
      - key: books-payment-processing
        dir: 20-payment-processing
        title: Payment processing
        lessons:
          - key: books-m20-01
            file: 20.01-set-the-scene.md
            title: '20.1: One payment, several bookshop orders'
            goal: >-
              Explain the shared PaymentIntent, test mode, and why a return page is not proof that the
              money arrived.
          - key: books-m20-02
            file: 20.02-stripe-config-and-intent.md
            title: '20.2: Price the intent on the server'
            goal: >-
              Compute the amount from immutable order-line snapshots and refuse every client-supplied
              total.
          - key: books-m20-03
            file: 20.03-webhook-and-paid-orders.md
            title: '20.3: Verify the webhook and mark orders paid'
            goal: >-
              Verify the raw-body signature and mark every split order paid once, even after a duplicate
              event or a double submit.
          - key: books-m20-04
            file: 20.04-checklist.md
            title: '20.4: Payment gate, double submit and test cards'
            goal: >-
              Prove success, decline, duplicate delivery, amount mismatch and the one-copy race in test
              mode.
