    modules:
      - key: digital-goods-introduction
        dir: 01-product-introduction
        title: Introduction to Midad
        lessons:
          - key: digital-goods-m1-01
            file: 01.01-what-youre-building.md
            title: '1.1: Build Midad, a marketplace for licensed digital work'
            goal: >-
              Meet a marketplace in which verified payment grants a license and a private file, and
              refunds stop future access.
          - key: digital-goods-m1-02
            file: 01.02-how-to-use-this-course.md
            title: '1.2: How to use this course'
