          - key: digital-goods-m1-03
            file: 01.03-the-product-and-its-people.md
            title: '1.3: The product and its people'
            goal: >-
              Describe the creator, buyer and payment provider roles without treating a browser redirect
              as payment truth.
          - key: digital-goods-m1-04
            file: 01.04-scope-and-the-one-line-flow.md
            title: '1.4: Scope and the one-line flow'
            goal: Trace upload, list, buy, library, download and refund, and name excluded product features.
          - key: digital-goods-m1-05
            file: 01.05-prerequisites-and-entry-diagnostic.md
            title: '1.5: Prerequisites and entry diagnostic'
            goal: Complete the entry check and use its result to choose the core path or a repair exercise.
          - key: digital-goods-m1-06
            file: 01.06-working-rhythm-on-unreliable-power.md
            title: '1.6: Working rhythm on unreliable power'
            goal: >-
              Use local commits, small seed files and recovery notes to keep a long build moving on weak
              connections.
          - key: digital-goods-m1-07
            file: 01.07-recap-and-checklist.md
            title: '1.7: Recap and checklist'
            goal: >-
              Confirm Midad actors, flow, scope, diagnostic and recovery habit before starting the project
              skeleton.
