          - key: handmade-custom-request-gate
            file: 22.02-checklist.md
            title: Custom-request gate and learning log
            goal: Demonstrate buyer and maker flow, cross-party denials, stale-tab rejection and evidence
      - key: handmade-quotes-deposits
        dir: 23-quotes-and-deposits
        title: Quotes and deposits
        lessons:
          - key: handmade-quote-deposit-path
            file: 23.01-set-the-scene.md
            title: Send a versioned quote and take one deposit
            goal: Accept only latest quote and snapshot server-owned terms before a verified idempotent deposit
          - key: handmade-quote-deposit-gate
            file: 23.02-checklist.md
            title: Quote and deposit gate
            goal: Prove stale-version 409, one commission, correct rounded deposit, webhook replay and browser independence
      - key: handmade-production-balance
        dir: 24-production-and-balance
        title: Production and balance
        lessons:
          - key: handmade-production-path
            file: 24.01-set-the-scene.md
            title: Move a commission through production and balance
            goal: Guard maker/buyer transitions, approval, a second verified payment, shipping and stage-based refund
          - key: handmade-production-gate
            file: 24.02-checklist.md
            title: Commission timeline and balance gate
            goal: >-
              Demonstrate full commission timeline, authorization denials, transition race, refund replay and restart
              safety
      - key: handmade-checkout-sold-once
        dir: 19-checkout-sold-once
        title: 'Checkout: sold exactly once'
        lessons:
          - key: handmade-19-01
            file: 19.01-set-the-scene.md
            title: '19.1: Set the scene'
            goal: See two buyers reach checkout for one exact cushion cover at the same moment.
          - key: handmade-19-02
            file: 19.02-the-last-piece-trap.md
            title: '19.2: The last-piece trap'
            goal: Explain how a separate status read and sold write can tell two buyers they both won.
          - key: handmade-19-03
            file: 19.03-what-you-will-build.md
            title: '19.3: What you will build'
            goal: Plan one-off holds, split pending Orders and immutable sale snapshots before payment.
          - key: handmade-19-04
            file: 19.04-one-document-one-atomic-update.md
            title: '19.4: One document, one atomic update'
            goal: Use a conditional findOneAndUpdate so two buyers cannot claim one Piece.
          - key: handmade-19-05
            file: 19.05-holds-with-an-expiry.md
            title: '19.5: Holds with an expiry'
            goal: >-
              Treat a truly expired hold as claimable in one conditional update while preserving Checkout
              identity.
          - key: handmade-19-06
            file: 19.06-predict-the-race.md
            title: '19.6: Predict the race'
            goal: Sketch three arrival orders and predict one Piece hold winner and loser.
          - key: handmade-19-07
            file: 19.07-all-or-nothing-across-workshops.md
            title: '19.7: All or nothing across workshops'
            goal: Explain transaction and compensating release choices for several Piece holds.
          - key: handmade-19-08
            file: 19.08-quiz.md
            title: '19.8: Checkout consistency check'
            goal: Choose safe claims, scoped release, split-order recovery and snapshot behavior.
          - key: handmade-19-09
            file: 19.09-checkout-route.md
            title: '19.9: Checkout route'
            goal: >-
              Build an authenticated route that groups a Cart by Workshop and rejects invalid shipping
              before any claim.
          - key: handmade-19-10
            file: 19.10-hold-every-piece-or-none.md
            title: '19.10: Hold every Piece or none'
            goal: Claim every one-off Piece for one Checkout and recover safely from a partial claim.
          - key: handmade-19-11
            file: 19.11-snapshot-order-lines.md
            title: '19.11: Snapshot OrderLines'
            goal: >-
              Freeze the terms of each held Piece in its Workshop Order without reading live listings
              later.
          - key: handmade-19-12
            file: 19.12-buyer-and-maker-order-routes.md
            title: '19.12: Buyer and maker order routes'
            goal: Expose buyer Orders and Workshop Orders with database-scoped authorization.
          - key: handmade-19-13
            file: 19.13-verify-the-race.md
            title: '19.13: Verify the race'
            goal: Run concurrent checkout attempts and prove one buyer holds the one-off Piece.
          - key: handmade-19-14
            file: 19.14-test-snapshot-immutability.md
            title: '19.14: Test snapshot immutability'
            goal: Prove catalog edits, archiving and shipping changes do not rewrite a pending Order.
          - key: handmade-19-15
            file: 19.15-recap-and-checklist.md
            title: '19.15: Recap and checklist'
            goal: >-
              Show evidence that one-off claims, split Orders, scoped reads and snapshots are ready for
              the payment module.
      - key: handmade-payment-processing
        dir: 20-payment-processing
        title: Payment processing
        lessons:
          - key: handmade-m20-01
            file: 20.01-set-the-scene.md
            title: '20.1: Paid but not sold, sold but not paid'
            goal: >-
              Separate payment, hold and sale states, and explain why a verified event is the only proof
              that money arrived.
          - key: handmade-m20-02
            file: 20.02-one-payment-many-workshops.md
            title: '20.2: One payment across workshop orders'
            goal: >-
              Price one PaymentIntent on the server from frozen OrderLine snapshots and shipping, then
              keep its id shared across the split workshop Orders.
          - key: handmade-m20-03
            file: 20.03-webhook-turns-holds-into-sales.md
            title: '20.3: Verify the webhook and sell the held pieces'
            goal: >-
              Verify the signature on the raw body and make the held to sold transition idempotent for
              every piece in the checkout.
          - key: handmade-m20-04
            file: 20.04-expired-holds-and-late-success.md
            title: '20.4: Expired holds and a late success'
            goal: >-
              Cancel a stale intent, let another buyer claim an expired hold, and refund a late success
              for a piece that is already sold.
          - key: handmade-m20-05
            file: 20.05-checklist.md
            title: '20.5: Payment gate and race evidence'
            goal: >-
              Prove paid-once transitions, hold expiry, late-success refund and scoped workshop reads
              with test-mode evidence.
