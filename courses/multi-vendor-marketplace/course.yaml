          - key: services-payment-07
            file: 20.07-expiry-and-release.md
            title: 20.7 Expire and release safely
            goal: >-
              Coordinate Stripe cancellation and database claim release without assuming the two systems
              share a transaction.
          - key: services-payment-08
            file: 20.08-late-success-recovery.md
            title: 20.8 Reconcile a late successful charge
            goal: >-
              Recover available provider bookings after a late charge and issue idempotent partial refunds
              for lost lines.
          - key: services-payment-09
            file: 20.09-failed-card-attempts.md
            title: 20.9 Keep the hold after a card decline
            goal: >-
              Let a client retry a declined card during the original hold without duplicating payment or
              extending calendar ownership.
          - key: services-payment-10
            file: 20.10-verify-test-cards.md
            title: 20.10 Verify payment test paths
            goal: >-
              Run success, decline, authentication, duplicate webhook and expiry-race cases with Stripe
              test mode and database evidence.
          - key: services-payment-11
            file: 20.11-checklist.md
            title: 20.11 Payment and confirmation gate
            goal: >-
              Commit signed Stripe test evidence for confirmation, safe expiry, failed cards and
              line-level late-success recovery.
      - key: services-booking-authorization
        dir: 09-booking-authorization-and-isolation
        title: Booking authorization and isolation
        lessons:
          - key: services-authz-01
            file: 09.01-set-the-scene.md
            title: '9.1 Whose booking is this?'
            goal: >-
              Describe how a booking ID swap leaks a client address and name the object checks every
              booking route needs.
          - key: services-authz-02
            file: 09.02-idor-on-bookings.md
            title: '9.2 Object checks on every booking route'
            goal: >-
              Apply participant, provider ownership and field-level rules to reads, writes, lists and
              exports.
          - key: services-authz-03
            file: 09.03-roles-and-ownership.md
            title: '9.3 Authentication, roles and ownership'
            goal: >-
              Separate authentication from authorization and choose the relation that decides each
              Booking action.
          - key: services-authz-04
            file: 09.04-quiz.md
            title: '9.4 Booking authorization check'
            goal: Check participant, owner, action and field-level authorization before writing helpers.
          - key: services-authz-05
            file: 09.05-authorization-matrix.md
            title: '9.5 Write the authorization matrix'
            goal: >-
              Record every Booking, Service and TimeOff action by role, relation, state and response
              projection.
          - key: services-authz-06
            file: 09.06-role-and-ownership-helpers.md
            title: '9.6 Build role and ownership helpers'
            goal: >-
              Implement requireRole, assertProviderOwner and assertBookingParticipant with trusted
              session context.
          - key: services-authz-07
            file: 09.07-need-to-know-fields.md
            title: '9.7 Share only needed Booking fields'
            goal: >-
              Project client contact details and meeting links only to the other party of a confirmed
