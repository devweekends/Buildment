    lessons:
      - file: 03.01-set-the-scene.md
        key: de-03-01-set-the-scene
        title: "Set the scene"
        goal: "Introduce the module through duplicate uploads and a slow query in the same week."
      - file: 03.02-ranking-and-deduplication.md
        key: de-03-02-ranking-and-deduplication
        title: "Window functions: ranking and deduplication"
        goal: "Keep the latest row per key with ROW_NUMBER, and choose how to break ties."
      - file: 03.03-running-totals-and-frames.md
        key: de-03-03-running-totals-and-frames
        title: "Running totals, moving averages and frames"
        goal: "Compute week-over-week change and moving averages with the frame you intend."
      - file: 03.04-query-plans-and-indexes.md
        key: de-03-04-query-plans-and-indexes
        title: "Query plans and indexes"
        goal: "Read a query plan, and say when an index helps and when a full scan is the right plan."
      - file: 03.05-build-window-drills.md
        key: de-03-05-build-window-drills
        title: "Build: SQL drills with windows and plans"
        goal: "Deduplicate, rank and compare weeks in SQL, and measure a query plan before and after an index."
      - file: 03.06-quiz.md
        key: de-03-06-quiz
        title: "Window functions and query plans"
        goal: "Graded scenarios on ranking, deduplication, frames and plans."
      - file: 03.07-checklist.md
        key: de-03-07-checklist
        title: "Checklist and learning log"
        goal: "Gate: explain a query plan to a teammate."
  - dir: 04-data-modelling
