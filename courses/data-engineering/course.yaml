      - file: 04.03-grain-facts-and-dimensions.md
        key: de-04-03-grain-facts-and-dimensions
        title: "Grain, facts and dimensions: the star schema"
        goal: "State the grain first, then design the fact table and its dimensions around it."
      - file: 04.04-slowly-changing-dimensions.md
        key: de-04-04-slowly-changing-dimensions
        title: "Slowly changing dimensions"
        goal: "Choose type 1 or type 2 history for an attribute, and join each fact to the right version."
      - file: 04.05-build-star-schema.md
        key: de-04-05-build-star-schema
        title: "Build: design and prototype Mizan's star schema"
        goal: "Write the schema and load the dimensions with SQL, with tests that check the grain and the history."
      - file: 04.06-quiz.md
        key: de-04-06-quiz
        title: "Data modelling"
        goal: "Graded scenarios on grain, star schemas and slowly changing dimensions."
      - file: 04.07-checklist.md
        key: de-04-07-checklist
        title: "Checklist and learning log"
        goal: "Gate: defend a grain and a history choice."
