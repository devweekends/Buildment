        key: de-05-06-quiz
        title: "Files and storage"
        goal: "Graded scenarios on columnar files, partitions and storage designs."
      - file: 05.07-checklist.md
        key: de-05-07-checklist
        title: "Checklist and learning log"
        goal: "Gate: defend a partitioning choice with numbers."
  - dir: 06-batch-ingestion
