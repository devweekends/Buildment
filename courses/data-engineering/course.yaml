        key: de-01-02-what-a-data-engineer-does
        title: "What a data engineer does"
        goal: "Tell the data engineer's job from the analyst, data scientist, analytics engineer and backend engineer, and trace a wrong number to the stage that broke it."
      - file: 01.03-the-map-of-a-pipeline.md
        key: de-01-03-the-map-of-a-pipeline
        title: "The map of a pipeline"
        goal: "Place each part of a pipeline on the data lifecycle, and decide from freshness needs whether batch is enough."
      - file: 01.04-set-up-your-workspace.md
        key: de-01-04-set-up-your-workspace
        title: "Set up your workspace and make the raw data"
        goal: "Install the pinned tools, generate Mizan's raw files and pass the setup check and warm-ups."
      - file: 01.05-checklist.md
        key: de-01-05-checklist
        title: "Checklist and learning log"
        goal: "Gate: explain the role and the pipeline you will build, in your own words."
  - dir: 02-sql-joins-and-aggregation
    key: de-m02-sql-joins-and-aggregation
    title: "SQL in depth: joins and aggregation"
    summary: "Write analytical SQL in DuckDB that joins without multiplying rows, aggregates without losing or doubling values, and reads as named steps."
    lessons:
      - file: 02.01-set-the-scene.md
        key: de-02-01-set-the-scene
        title: "Set the scene"
        goal: "Introduce the module through a market whose weekly total doubled overnight."
