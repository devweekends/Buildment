        goal: "Prove with tests that reruns, late batches and the new field keep the weekly numbers right."
      - file: 08.06-quiz.md
        key: de-08-06-quiz
        title: "Late data and backfills"
        goal: "Graded scenarios on late data, duplicates, backfills and schema change."
      - file: 08.07-checklist.md
        key: de-08-07-checklist
        title: "Checklist and learning log"
