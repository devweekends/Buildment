        key: de-02-02-joins-and-row-counts
        title: "Joins and what they do to row counts"
        goal: "Predict how many rows a join returns, and spot fan-out caused by duplicate keys."
      - file: 02.03-aggregation-traps.md
        key: de-02-03-aggregation-traps
        title: "Aggregation traps: NULLs and double counting"
        goal: "Aggregate without losing or doubling values, and count the thing you mean to count."
      - file: 02.04-ctes-and-readable-queries.md
        key: de-02-04-ctes-and-readable-queries
        title: "CTEs and queries you can read"
        goal: "Break a long query into named steps that you can check one at a time."
      - file: 02.05-build-sql-drills.md
        key: de-02-05-build-sql-drills
        title: "Build: SQL drills on the raw data"
        goal: "Write SQL in DuckDB over Mizan's raw files that passes the drill tests."
      - file: 02.06-quiz.md
        key: de-02-06-quiz
        title: "SQL joins and aggregation"
        goal: "Graded scenarios on joins, fan-out, NULLs, double counting and CTEs."
      - file: 02.07-checklist.md
        key: de-02-07-checklist
        title: "Checklist and learning log"
        goal: "Gate: explain a double-counting bug and how you fixed it."
  - dir: 03-sql-windows-and-plans
