        key: de-05-02-rows-columns-and-parquet
        title: "Rows, columns and Parquet"
        goal: "Explain how a columnar file and its statistics let an engine skip data it does not need."
      - file: 05.03-partitions-and-file-sizes.md
        key: de-05-03-partitions-and-file-sizes
        title: "Partitions, file sizes and compression"
        goal: "Choose a partition key and a file size for the queries you expect, and avoid the small-files problem."
      - file: 05.04-lakes-and-warehouses.md
        key: de-05-04-lakes-and-warehouses
        title: "Lakes, warehouses and lakehouses"
