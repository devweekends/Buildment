slug: data-engineering
title: "Data Engineering: Build Reliable Data Pipelines on Your Laptop"
description: "Learn data engineering by building a real pipeline on your own laptop, with no cloud account and no paid service. Go deep on SQL and data modelling, store data as Parquet, build a DuckDB warehouse with dbt Core, make the pipeline survive late uploads, duplicates, reruns and a schema change, schedule it with retries and backfills, protect personal data, and learn the ideas behind streaming and cluster engines. Finish with interview practice and a second pipeline you build and defend."
projectGoal: "Build a pipeline that runs offline on your laptop: raw CSV, JSON and a small SQLite registry land as partitioned Parquet, tested dbt models build a star schema with history in DuckDB, a small scheduler runs it with retries and backfills, personal data is pseudonymised, and a weekly report opens on a phone. Then build a second pipeline in a new domain and defend it in a recorded five-minute walkthrough."
difficulty: Medium
estimatedHours: 59
category: tech
modules:
  - dir: 01-the-job-and-your-workspace
    key: de-m01-the-job-and-your-workspace
    title: "The data engineer's job and your workspace"
