        goal: "Decide between one machine and a cluster with measurements, not habit."
      - file: 10.05-quiz.md
        key: de-10-05-quiz
        title: "Streaming and scale"
        goal: "Graded scenarios on logs, offsets, delivery guarantees and scale."
      - file: 10.06-checklist.md
        key: de-10-06-checklist
        title: "Checklist and learning log"
        goal: "Gate: a written decision on streaming or batch for a request."
  - dir: 11-quality-and-responsibility
