      - file: 09.04-build-scheduler-and-report.md
        key: de-09-04-build-scheduler-and-report
        title: "Build: a small scheduler and the published report"
        goal: "Run the whole pipeline as a graph with retries, a backfill command and a report that opens on a phone."
      - file: 09.05-quiz.md
        key: de-09-05-quiz
        title: "Orchestration"
        goal: "Graded scenarios on graphs, schedules, retries and backfills."
      - file: 09.06-checklist.md
        key: de-09-06-checklist
        title: "Checklist and learning log"
        goal: "Gate: write the runbook entry for a failed run."
  - dir: 10-streaming-and-scale
