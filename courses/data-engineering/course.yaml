      - file: 12.05-quiz.md
        key: de-12-05-quiz
        title: "Interview drills"
        goal: "Graded SQL, modelling and pipeline design scenarios."
      - file: 12.06-checklist.md
        key: de-12-06-checklist
        title: "Checklist and learning log"
        goal: "Gate: a recorded mock interview answer."
  - dir: 13-capstone
