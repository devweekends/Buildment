      - file: 07.06-quiz.md
        key: de-07-06-quiz
        title: "Transformation as code"
        goal: "Graded scenarios on models, tests, snapshots and incremental models."
      - file: 07.07-checklist.md
        key: de-07-07-checklist
        title: "Checklist and learning log"
