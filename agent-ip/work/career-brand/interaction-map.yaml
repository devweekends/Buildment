    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "One line hides a whole role", claim: "A resume line is the last step; the arc keeps the fix, the numbers and the permission behind it.", visual: scene, slug: career-m2-one-line-opens, register: card, playable: false, predict: false, transfer: "build 2.5 part 7 (role cards)"}
