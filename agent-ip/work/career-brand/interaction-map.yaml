  # ===================================================================
  # MODULE 1: What a reader sees first
  # ===================================================================

  - id: "01.01"
    title: Set the scene
    module: 1
    type: Read
    archetype: orientation (Read, story register)
    beats:
      - {n: 1, heading: "Sixty applications, no replies", claim: "Bashar sends 60 applications in six weeks and nothing comes back.", visual: scene, slug: career-m1-sixty-sent, register: card, playable: false, predict: false, transfer: "none (story beat); the same resume problem is made playable in 1.2 beat 3"}
      - {n: 2, heading: "What the founder's phone showed", claim: "The first screen of Bashar's resume is his name, an objective paragraph and half a skills block; his best work is on page 2.", visual: scene, slug: career-m1-founders-phone, register: card, playable: false, predict: false, transfer: "1.2 beat 3 (move the proof up); gate 1.6 ten-second test"}
    outside_beats: [LearningObjectives, ProjectPreview, Roadmap, "wellbeing contact paragraph (instructors supply the name)"]
    predict: {type: optional everyday question after beat 2, prompt: "If you could move one thing to the top of Bashar's resume, what would it be?", note: "answerable from the picture; not a mechanism question"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show that effort is not the same as being read, and where the proof sat", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
      - {type: PROJECT_PREVIEW, placement: after beat 2, purpose: "The finished kit, eight parts", budget: 1}
      - {type: ROADMAP, placement: end, purpose: "The nine modules as a path, evidence first", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "Two scenes are the module's diagrams. The Roadmap block carries the path of nine modules."

  - id: "01.02"
    title: The first look is short
    module: 1
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "More applications than time to read", claim: "One reader has a pile far taller than a working day, so only a few applications get a close read.", visual: scene, slug: career-m1-pile-and-day, register: card, playable: false, predict: false, transfer: "quiz 1.5 #3 (the honest reply keeps the habit)"}
      - n: 2
        heading: "The famous six seconds has no source"
        claim: "The 'six seconds' claim traces back to one company's eye-tracking study with no disclosed sample; treat it as an arrangement habit, not a statistic."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 1.5 #3"
        mermaid: |
          flowchart TD
            A["'Recruiters look for 6 seconds'"] --> B["Company eye-tracking study, 2012 and 2018"]
            B --> C["Number of recruiters not disclosed"]
            B --> D["Jobs and resume lengths not disclosed"]
            C --> E["It measured the choice to keep reading"]
            D --> E
            E --> F["Use it as a habit: best proof first"]
      - {n: 3, heading: "Your first screen decides what they see", claim: "A phone shows a fraction of a page; whatever fills it is what a quick reader keeps, so the order of your blocks decides what is seen.", visual: budget-stack, slug: career-m1-first-look, register: card, playable: true, predict: true, transfer: "quiz 1.5 #1; gate 1.6 'marked where my best proof sits'", note: "existing slug, data revised to match the canon (see its spec)"}
      - {n: 4, heading: "One labelled link, not thirty repositories", claim: "A reader faced with 31 repositories gives up; one link labelled with what they will see gets opened.", visual: scene, slug: career-m1-one-link, register: card, playable: false, predict: false, transfer: "QC2; labelled links return in 6.5 and quiz 6.7"}
      - {n: 5, heading: "The ten-second test", claim: "A partner looks at your phone for ten seconds, then says what they remember; you compare it with your best proof.", visual: scene, slug: career-m1-ten-second-test, register: card, playable: false, predict: false, transfer: "gate 1.6 checklist and written task (the test itself)"}
    predict: {before_beat: 3, prompt: "Bashar's best work is on page 2. When a founder opens the file on a phone, what do they see first?", options: ["His name and the objective", "His best work: the queue import"], correct: 0}
    quick_check: ["QC1: two orders of the same resume; which puts checkable proof on the first screen, and why does the other fail?", "QC2: you give one link; which label tells the reader what they will see?"]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner can say what a quick reader sees first on a phone before seeing the picture", budget: 1}
      - {type: CANVAS, slug: career-m1-first-look, placement: beat 3, purpose: "This proves the learner can reorder blocks so the proof is on the first screen", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1 and QC2: apply the order and the label rule to a new resume", budget: 2}
    diagram_plan: {format: MermaidDiagram, claim: "The six seconds figure has no sourced sample", placement: beat 2, canvas_decision: "no model-backed canvas needed beyond beat 3"}
    density: {beats: 5, scenes: 3, mermaid: 1, budget_stack: 1, playables: 1, predicts: 1, quiz_questions: 2, big_word_alerts: 0, assessment_interactions: 3}

  - id: "01.03"
    title: What founders and hiring managers look for
    module: 1
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "What hiring teams say they want", claim: "Two public hiring handbooks each ask to see your thinking: what you changed, how you know, what you would do next.", visual: scene, slug: career-m1-handbook-cards, register: card, playable: false, predict: false, transfer: "QC1"}
      - {n: 2, heading: "Shipped work over a list of courses", claim: "Founders who write about hiring say they would rather see something you built than a list of courses (their stated practice).", visual: scene, slug: career-m1-badges-or-project, register: card, playable: false, predict: false, transfer: "quiz 1.5 #4 (where each item goes on a one-page resume)"}
      - {n: 3, heading: "Checkable, or only a claim?", claim: "A line is checkable when a reader can look something up or test it without asking you; 'we' and adjectives are only claims.", visual: sorter, slug: career-m1-checkable-or-claim, register: card, playable: true, predict: true, transfer: "quiz 1.5 #2; gate 1.6 learning log prompt 2"}
      - n: 4
        heading: "Where a certificate fits"
        claim: "A certificate is a small line near the end; shipped work is the headline."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 1.5 #4"
        mermaid: |
          flowchart TD
            A["Name and links"] --> B["Shipped project with a result"]
            B --> C["Experience"]
            C --> D["Education"]
            D --> E["Certificates: one small line"]
      - {n: 5, heading: "Real tailoring shows you looked", claim: "An application that says you tried the product and names one change shows you looked; a generic one does not.", visual: scene, slug: career-m1-generic-or-tailored, register: card, playable: false, predict: false, transfer: "quiz 6.7 #4 (tailoring changes order, not words); 6.5 beat 3"}
      - {n: 6, heading: "A good kit cannot remove every bias", claim: "A stronger kit helps, but not equally for everyone; the course does not promise it erases bias against a name, a place or a passport.", visual: scene, slug: career-m1-kit-bias-note, register: card, playable: false, predict: false, transfer: "none: honesty beat, not assessed; mentors discuss where to apply"}
    predict: {before_beat: 3, prompt: "Which of these two lines could a founder check without asking you?", options: ["Cut report time 12 to 3 min (dashboard)", "Passionate and hard-working team player"], correct: 0}
    quick_check: ["QC1: a founder has five minutes; which two lines of a profile do they check first, and why?"]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner can tell a checkable line from a claim before sorting", budget: 1}
      - {type: CANVAS, slug: career-m1-checkable-or-claim, placement: beat 3, purpose: "This proves the learner can sort lines by whether a reader can check them", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: apply the checkable test to a profile", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "A certificate sits low on a one-page resume", placement: beat 4, canvas_decision: "sorter at beat 3 carries the playable claim"}
    density: {beats: 6, scenes: 4, mermaid: 1, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "01.04"
    title: When writing is cheap, proof counts
    module: 1
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Fixing mistakes helped in one study", claim: "Writing help that fixes mistakes was linked to more hires in one large study; it corrected errors and invented no claims.", visual: scene, slug: career-m1-errors-cleaned, register: card, playable: false, predict: false, transfer: "quiz 1.5 #5 (what the AI advice gets wrong)"}
      - {n: 2, heading: "When everyone writes smoothly, smooth proves less", claim: "When anyone can write a polished letter in a minute, readers lean on what they can check.", visual: scene, slug: career-m1-smooth-letters, register: card, playable: false, predict: false, transfer: "QC1"}
      - {n: 3, heading: "People cannot reliably spot AI text", claim: "In experiments readers could not reliably tell AI-written profiles from human ones, so the useful question is whether it says anything only you could say.", visual: scene, slug: career-m1-guess-the-writer, register: card, playable: false, predict: true, transfer: "quiz 1.5 #5"}
      - {n: 4, heading: "Detectors flag second-language English", claim: "AI detectors often wrongly flag English written by non-native speakers; that is a weakness of the tool, not a verdict on you.", visual: scene, slug: career-m1-detector-flag, register: card, playable: false, predict: false, transfer: "quiz 1.5 #5"}
      - {n: 5, heading: "Only you can write this", claim: "An opening can read well and say nothing; each empty phrase must become a fact only the writer can back up.", visual: phrase-fixer, slug: career-m1-only-you-can-write, register: card, playable: true, predict: false, transfer: "QC1 (which bio line only the writer could say); 6.4 beat 3 and quiz 6.7 #5"}
    predict: {before_beat: 3, prompt: "In experiments, how well did people tell AI-written profiles from human-written ones?", options: ["Quite well, most of the time", "About as well as guessing"], correct: 1}
    quick_check: ["QC1: which of three bio lines says something only the writer could say?"]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner will commit to a belief about detecting AI text before the evidence", budget: 1}
      - {type: CANVAS, slug: career-m1-only-you-can-write, placement: beat 5, purpose: "This proves the learner can find the phrases a reader cannot check and replace them with facts", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the line only the writer could say", budget: 1}
    diagram_plan: {format: scene beats only, claim: "Cheap writing moves attention to checkable proof", placement: beats 1 to 4, canvas_decision: "phrase fixer at beat 5; no model-backed canvas needed"}
    density: {beats: 5, scenes: 4, mermaid: 0, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

