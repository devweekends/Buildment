    beats:
      - {n: 1, heading: "Seventy percent of what?", claim: "A hiring manager asks Tawfiq three questions about 'made the pipeline 70 percent faster': of what, over which days, was it you.", visual: scene, slug: career-m3-seventy-of-what, register: card, playable: false, predict: false, transfer: "3.2 beat 3 (claim card); quiz 3.7 #1"}
      - {n: 2, heading: "The same week, bigger machines", claim: "The whole run fell from 5 hours to 1.5 hours the week the platform team moved it to larger machines; only his join step, 50 to 20 minutes in the job logs, is his.", visual: scene, slug: career-m3-same-week, register: card, playable: false, predict: false, transfer: "3.2 beat 3 and its predict"}
    outside_beats: [LearningObjectives]
    predict: {type: optional everyday question after beat 2, prompt: "Which part of the change can Tawfiq honestly call his?", note: "answerable from the picture"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show that a true number can still be the wrong thing to claim", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "The two scenes are the diagrams; module diagrams are in 3.2 beat 5 and 3.3 beat 1."

  - id: "03.02"
    title: From a number to a claim card
    module: 3
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "\"Helped grow the business 50 percent\"", claim: "A bare number fails every part of a claim card; embellishing and leaving out to mislead both count as deception.", visual: scene, slug: career-m3-empty-claim-card, register: card, playable: false, predict: false, transfer: "quiz 3.7 #1 (choose the complete card)"}
      - {n: 2, heading: "A percent needs its starting number", claim: "'Up 12 percent' means different things from 25 users and from 10,000; the starting number comes with the percentage.", visual: scene, slug: career-m3-percent-needs-start, register: card, playable: false, predict: false, transfer: "QC1 (name the missing field)"}
      - {n: 3, heading: "Fill the claim card", claim: "A number becomes checkable when it has its metric, before, after, window, source and your share; the team's 70 percent is not Tawfiq's alone.", visual: slot-card, slug: career-m3-claim-card, register: card, playable: true, predict: true, transfer: "quiz 3.7 #1; gate 3.8 'claim card complete'; build 3.6 ledger", note: "existing slug, data revised to match the canon (see its spec)"}
      - {n: 4, heading: "What else changed in the window", claim: "A single before and after cannot separate your change from other changes; name what else changed and what you checked.", visual: scene, slug: career-m3-what-else-changed, register: card, playable: false, predict: false, transfer: "quiz 3.7 #4; gate 3.8 learning log prompt 3"}
      - n: 5
        heading: "One row per claim: the ledger"
        claim: "A claim goes from work to evidence to a claim card, into the kit, gets questioned, and is defended or corrected."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 3.6 (the ledger); 9.3 kit check"
        mermaid: |
          flowchart TD
            W["Work"] --> E["Evidence"]
            E --> C["Claim card"]
            C --> K["Placed in the kit"]
            K --> Q["Questioned"]
            Q --> D["Defended or corrected"]
      - {n: 6, heading: "\"Not measured\" is a complete answer", claim: "'I did not measure that, and here is how I would' is a finished, honest sentence.", visual: scene, slug: career-m3-not-measured, register: card, playable: false, predict: false, transfer: "gate 3.8 'honest gap'; build 3.6 acceptance (at least one gap)"}
    predict: {before_beat: 3, prompt: "Tawfiq's pipeline went from 5 hours to 1.5 hours the week the machines got bigger. What should his claim card's result be?", options: ["His join step, 50 to 20 minutes", "The 70 percent for the whole run"], correct: 0}
    quick_check: ["QC1: choose the complete card among three and name the missing field in the other two."]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner will decide what Tawfiq can claim before the card is filled", budget: 1}
      - {type: CANVAS, slug: career-m3-claim-card, placement: beat 3, purpose: "This proves the learner can put each part of a number in its field and refuse a feeling, a guess and a team number", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: spot the missing field", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "A claim travels from work to defence or correction", placement: beat 5, canvas_decision: "slot card at beat 3 carries the playable claim"}
    density: {beats: 6, scenes: 4, mermaid: 1, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "03.03"
    title: Proof for each kind of work
    module: 3
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Every kind of work leaves a trace"
        claim: "Speed fixes, cleanups and automations each leave a different, nameable trace."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 3.6 inventory 'evidence type' column"
        mermaid: |
          flowchart TD
            W1["Speed fix"] --> T1["Plans and dashboards"]
            W2["Cleanup"] --> T2["Pull requests and test runs"]
            W3["Automation"] --> T3["Timing sheets and counts"]
      - {n: 2, heading: "Match the work to its proof", claim: "Each kind of work has its own proof source; for a security fix the proof is the fix, never the secret.", visual: sorter, slug: career-m3-match-work-to-proof, register: card, playable: true, predict: true, transfer: "QC1; build 3.6 inventory; gate 3.8 're-checkable source'"}
      - {n: 3, heading: "Security proof shows the fix, not the secret", claim: "If a key was ever pushed, assume it is stolen and replace it; show the revocation and the setting, never the key.", visual: scene, slug: career-m3-leaked-key, register: card, playable: false, predict: false, transfer: "quiz 5.7 #5 (the .env file); gate 3.8 checklist 'no secrets'"}
      - {n: 4, heading: "Time saved is net, not gross", claim: "Time saved is the old time minus the new time, minus upkeep, using the median of a task timed as it is done today.", visual: scene, slug: career-m3-time-saved-net, register: card, playable: false, predict: false, transfer: "quiz 3.7 #5 (AI answer gives gross, not net)"}
      - n: 5
        heading: "Cost comes from the bill"
        claim: "A cost claim comes from the bill or cost report for one stated period, filtered by service or tag."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 3.6 (source column for any cost row)"
        mermaid: |
          flowchart TD
            B["Open the cost report"] --> P["Pick one month"]
            P --> S["Filter by one service or tag"]
            S --> N["Read the total for that service"]
            N --> C["Write the figure, the month and the report"]
      - {n: 6, heading: "Ask before you show employer data", claim: "Ask first, remove names and customer data, and keep the number private when in doubt.", visual: scene, slug: career-m3-ask-first, register: card, playable: false, predict: false, transfer: "gate 3.8 checklist 'I asked permission'; build 3.6 'permission' column"}
    predict: {before_beat: 2, prompt: "Where would proof that you fixed a leaked key live?", options: ["The key, kept in a safe place", "The revocation and the setting"], correct: 1}
    quick_check: ["QC1: match two work items to the proof each one leaves."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will say what counts as proof for a security fix before sorting", budget: 1}
      - {type: CANVAS, slug: career-m3-match-work-to-proof, placement: beat 2, purpose: "This proves the learner can match a kind of work to the trace it leaves", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: match two new work items to their proof", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "Work to its trace; a cost figure from the bill", placement: beats 1 and 5, canvas_decision: "sorter at beat 2 carries the playable claim"}
    density: {beats: 6, scenes: 3, mermaid: 2, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "03.04"
    title: Reading a dashboard you did not set up
    module: 3
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Six questions for any number", claim: "Before you quote a number, ask what it measures, which statistic, over what window, where it comes from, what else changed and who owns it.", visual: scene, slug: career-m3-six-questions, register: card, playable: false, predict: false, transfer: "quiz 3.7 #2; gate 3.8 (defend two rows)"}
      - {n: 2, heading: "Averages hide slow requests", claim: "Two services with the same average can have very different tails; the statistic a dashboard graphs decides what you can see.", visual: reuse, slug: sysdesign-m17-same-average, register: card, playable: true, predict: true, transfer: "quiz 3.7 #2 and #3", reuse_reason: "Same claim, same numbers (two services averaging 120 ms; p99 150 ms and 810 ms), wording is generic engineering English with no system-design names. The predict is reworded to match its data. Its second half (Combine A and B) also teaches that percentiles do not average, which beat 5 repeats as a watch-only scene."}
      - {n: 3, heading: "p50, p95 and p99 in plain words", claim: "On a ranked line of 100 requests, p50 is the middle, p95 has 1 in 20 slower, p99 has 1 in 100 slower.", visual: scene, slug: career-m3-percentile-line, register: card, playable: false, predict: false, transfer: "quiz 3.7 #2"}
      - {n: 4, heading: "The window changes the number", claim: "The same traffic looks spiky per second and calm as a one-minute average; a number needs its window.", visual: scene, slug: career-m3-window-changes, register: card, playable: false, predict: false, transfer: "quiz 3.7 #1 (a claim card without a window); gate 3.8 'window'"}
      - {n: 5, heading: "Percentiles do not average", claim: "Averaging each server's p99 gives a number no request had; merge the requests (or add histogram buckets) first.", visual: scene, slug: career-m3-percentiles-dont-average, register: card, playable: false, predict: false, transfer: "quiz 3.7 #3"}
      - {n: 6, heading: "Uptime percent is downtime minutes", claim: "The same percentage means very different bad minutes in a window, and each extra nine cuts the allowance ten times.", visual: reuse, slug: sysdesign-m17-slo-window, register: card, playable: true, predict: false, transfer: "quiz 3.7 #2 (distractor quotes an uptime figure); QC1", reuse_reason: "Same claim and numbers (99 percent of 30 days is 432 minutes, 99.9 is 43.2, 99.99 is about 4.3). It uses the words target and window, which beat 4 and the fold teach. The 25 minute deploy probe is a fair example for a career reader."}
    predict: {before_beat: 2, prompt: "Two services both average 120 ms. One makes 2 of its 20 users wait 700 ms or more. Which number would show that?", options: ["The 99th percentile (p99)", "The average of all requests"], correct: 0}
    quick_check: ["QC1: a tile says 'average response time 120 ms'; which question do you ask first?"]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will say which statistic exposes a slow tail before trying the canvas", budget: 1}
      - {type: CANVAS, slug: sysdesign-m17-same-average, placement: beat 2, purpose: "This proves the learner can see that an average hides slow users and that p99 shows them", budget: 1}
      - {type: CANVAS, slug: sysdesign-m17-slo-window, placement: beat 6, purpose: "This proves the learner can turn a percentage and a window into bad minutes", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: ask the right first question about a tile", budget: 1}
    diagram_plan: {format: scene beats and two reused canvases, claim: "Averages, windows and uptime all hide something unless stated", placement: beats 1 to 6, canvas_decision: "two reused sysdesign canvases carry the playable claims; no new canvas needed"}
    density: {beats: 6, scenes: 4, mermaid: 0, reused_canvas: 2, playables: 2, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "03.05"
    title: Measure it yourself, before and after
    module: 3
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Control the test, not the calendar", claim: "'Last month versus this month' hides other changes; keep the script, data and machine the same and change one thing.", visual: phrase-fixer, slug: career-m3-fair-test-claim, register: card, playable: true, predict: false, transfer: "quiz 3.7 #4; QC1", note: "playable moved here from beat 4 (see career-m3-five-runs)"}
      - {n: 2, heading: "Same script, same data, same machine", claim: "Areej can say the cache did it because only the cache changed: p95 820 ms then 95 ms under the same load.", visual: scene, slug: career-m3-k6-fair-test, register: card, playable: false, predict: true, transfer: "quiz 3.7 #4; gate 3.8 'defence'"}
      - {n: 3, heading: "A query plan pair", claim: "A plan pair with real timings, 3,840 ms then 46 ms, is proof for a database fix; cost units are not milliseconds.", visual: scene, slug: career-m3-plan-pair, register: card, playable: false, predict: false, transfer: "build 3.6 optional measurement; 6.3 bullet (the report bullet)"}
      - {n: 4, heading: "One audit run can mislead", claim: "A page audit varies from run to run; run it several times and quote the median.", visual: scene, slug: career-m3-five-runs, register: card, playable: false, predict: false, transfer: "QC1; gate 3.8 'defence' (a single run is weak proof)", note: "was playable in the brief; now watch-only (see its spec)"}
      - {n: 5, heading: "Time it as it is done today", claim: "Time the task as it is done today, for a stated window, and use the median per task.", visual: scene, slug: career-m3-timing-sheet, register: card, playable: false, predict: false, transfer: "quiz 3.7 #5; build 3.6 invoice row"}
      - {n: 6, heading: "No laptop? Read the export", claim: "The no-install path is a full path: read a supplied export and answer the six questions on a phone.", visual: scene, slug: career-m3-phone-export, register: card, playable: false, predict: false, transfer: "build 3.6 no-install path; gate 3.8 checklist"}
    predict: {before_beat: 2, prompt: "Areej's p95 drops from 820 ms to 95 ms after the cache. What must stay the same for her to say the cache did it?", options: ["Only the date and the time", "The script, data and machine"], correct: 1}
    quick_check: ["QC1: choose the fair test design among three."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will name what must stay fixed before seeing the test", budget: 1}
      - {type: CANVAS, slug: career-m3-fair-test-claim, placement: beat 1, purpose: "This proves the learner can find what makes a test plan untrustworthy and fix it", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: pick the fair test", budget: 1}
    diagram_plan: {format: scene beats, claim: "A fair test changes one thing and states the load, the data and the machine", placement: beats 2 to 5, canvas_decision: "phrase fixer at beat 1; no model-backed canvas (noise runs have no allowed primitive and the claim is carried by beat 4 as a scene)"}
    density: {beats: 6, scenes: 5, mermaid: 0, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  # ===================================================================
  # MODULE 4: A strong project in the AI era
  # ===================================================================

  - id: "04.01"
    title: Set the scene
    module: 4
    type: Read
    archetype: orientation (Read, story register)
    beats:
      - {n: 1, heading: "A ride app in one weekend", claim: "Sireen builds a ride-sharing app in a weekend; the screens are done and no drivers or riders have signed up.", visual: scene, slug: career-m4-ride-app-weekend, register: card, playable: false, predict: false, transfer: "none (story beat); returns in 4.2 beat 3 and 4.3 beat 2"}
      - {n: 2, heading: "\"How does the matching work?\"", claim: "In an interview Sireen scrolls through AI-written code she cannot explain.", visual: scene, slug: career-m4-matching-question, register: card, playable: false, predict: false, transfer: "4.2 beat 2 (speed is not understanding); quiz 4.6 #4"}
    outside_beats: [LearningObjectives]
    predict: {type: optional everyday question after beat 2, prompt: "What would have made her project more convincing than more features?", note: "answerable from the pictures"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show a finished app with nobody using it and a builder who cannot explain it", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "The two scenes are the diagrams; module diagrams are in 4.3 beats 1, 2 and 5 and 4.4 beats 3 and 4."

  - id: "04.02"
    title: When building is fast, what still counts
    module: 4
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Studies of AI coding tools disagree", claim: "Studies measure different tasks, people and tools and reach different answers; promise a record of what you checked, not a speed number.", visual: scene, slug: career-m4-studies-disagree, register: card, playable: false, predict: false, transfer: "quiz 4.6 #5 (the AI answer promises 55 percent faster)"}
      - {n: 2, heading: "Speed is not understanding", claim: "In one trial the AI-assisted group scored 50 percent on a quiz against 67 percent, with the biggest gap on debugging.", visual: scene, slug: career-m4-speed-vs-understanding, register: card, playable: false, predict: true, transfer: "quiz 4.6 #4; QC1"}
      - {n: 3, heading: "A working app alone proves less", claim: "If a working app is cheap to make it proves less; a real user, a number and a decision with its reason are hard to fake.", visual: scene, slug: career-m4-pile-of-apps, register: card, playable: false, predict: false, transfer: "gate 4.7 learning log prompt 2; build 4.5 plan"}
      - {n: 4, heading: "What still counts on a project page", claim: "A project page earns trust through a real user, a result, a decision, a bug fixed, an AI-use log and the hardest part in your words.", visual: slot-card, slug: career-m4-project-page, register: card, playable: true, predict: false, transfer: "quiz 4.6 #4; build 4.5 'what you will show'"}
      - n: 5
        heading: "The AI-use log"
        claim: "One log line records the date, what you asked, what you used, what you checked and one thing the tool got wrong."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 4.5 AI-use log template; gate 4.7 learning log prompt 4"
        mermaid: |
          flowchart TD
            A["Date"] --> B["What I asked the AI"]
            B --> C["What I used"]
            C --> D["What I checked"]
            D --> E["One thing it got wrong"]
    predict: {before_beat: 2, prompt: "Engineers learned a new library, some with AI help. On a quiz right after, how did the AI group do?", options: ["Better", "About the same", "Worse"], correct: 2}
    quick_check: ["QC1: which evidence best shows you understood code an AI drafted?"]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner commits to what happens to understanding when AI does the work before the trial result", budget: 1}
      - {type: CANVAS, slug: career-m4-project-page, placement: beat 4, purpose: "This proves the learner can tell evidence of understanding from a feature count, speed or looks", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the best evidence of understanding", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "An AI-use log is five columns in a fixed order", placement: beat 5, canvas_decision: "slot card at beat 4 carries the playable claim"}
    density: {beats: 5, scenes: 3, mermaid: 1, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "04.03"
    title: The idea filter, and where open source fits
    module: 4
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Four questions before you build"
        claim: "An idea passes only if it is useful to one known person or group on day one, measurable, deep enough to write about, and needs no second side."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 4.6 #1; gate 4.7 'filter applied'"
        mermaid: |
          flowchart TD
            I["An idea"] --> Q1{"Useful to one known person or group on day one?"}
            Q1 -->|yes| Q2{"A result you can measure?"}
            Q2 -->|yes| Q3{"Depth you can explain in writing?"}
            Q3 -->|yes| Q4{"No need for two sides at once?"}
            Q4 -->|yes| P["Build it"]
      - n: 2
        heading: "Why two-sided apps stall"
        claim: "A two-sided app needs both sides at once, and each waits for the other."
        visual: mermaid
        slug: null
        playable: false
        predict: true
        transfer: "quiz 4.6 #2"
        mermaid: |
          flowchart TD
            A["No drivers"] --> B["Riders do not join"]
            B --> C["No riders"]
            C --> D["Drivers do not join"]
            D --> A
      - {n: 3, heading: "Useful with one user", claim: "A tool that works for one person or a small known group is useful on day one; Sireen's school bus schedule has one driver and 14 families.", visual: scene, slug: career-m4-bus-schedule, register: card, playable: false, predict: false, transfer: "quiz 4.6 #2 (reshape to one side)"}
      - {n: 4, heading: "Run five ideas through the filter", claim: "Ideas that need two sides or have nothing to measure fail; a small known group, depth in writing or a mergeable fix passes.", visual: sorter, slug: career-m4-run-the-filter, register: card, playable: true, predict: false, transfer: "quiz 4.6 #1; gate 4.7 written task"}
      - n: 5
        heading: "When open source is the better path"
        claim: "A small contribution is a path with clear steps: a newcomer-labelled issue, a maintained project, CONTRIBUTING, an issue first, then a small fix; it is optional."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 4.5 open source alternative (optional); not quizzed"
        mermaid: |
          flowchart TD
            A["Find an issue labelled for newcomers"] --> B["Check the project is still maintained"]
            B --> C["Read CONTRIBUTING"]
            C --> D["Open an issue first"]
            D --> E["Make a small docs or test fix"]
    predict: {before_beat: 2, prompt: "Sireen's app needs drivers and riders. Which side joins first?", options: ["Neither: each waits", "The drivers join first", "The riders join first"], correct: 0}
    quick_check: ["QC1: choose the idea that passes all four questions."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will say which side of a two-sided app arrives first before the cycle is shown", budget: 1}
      - {type: CANVAS, slug: career-m4-run-the-filter, placement: beat 4, purpose: "This proves the learner can apply the four questions to an idea and name the one it fails", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: pick the idea that passes", budget: 1}
    diagram_plan: {format: MermaidDiagram x3, claim: "The four gates; the two-sided cycle; the open source path", placement: beats 1, 2 and 5, canvas_decision: "sorter at beat 4 carries the playable claim"}
    density: {beats: 5, scenes: 1, mermaid: 3, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "04.04"
    title: Plan it with a time box
    module: 4
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Fix the time, flex the scope", claim: "Decide how much time the problem deserves first, then fit the scope to the box.", visual: scene, slug: career-m4-fixed-box, register: card, playable: false, predict: false, transfer: "quiz 4.6 #3"}
      - {n: 2, heading: "Set the appetite, watch scope fall", claim: "A plan that promises everything fits nothing; a time box, one flow and one number make it checkable.", visual: phrase-fixer, slug: career-m4-scope-sentence, register: card, playable: true, predict: true, transfer: "quiz 4.6 #3; gate 4.7 'scope fits the appetite'"}
      - n: 3
        heading: "One user, one flow, one number"
        claim: "A plan card has one user, one core flow and one number with a baseline from a source."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 4.5 template; gate 4.7 'number and measurement'"
        mermaid: |
          flowchart TD
            U["One user: the print shop owner"] --> F["One flow: record a sale, stock goes down, a warning appears"]
            F --> N["One number: stockouts per month"]
            N --> B["Baseline: 5 in August and September 2025, from the owner's notebook"]
      - n: 4
        heading: "Plan how you will measure it"
        claim: "The plan is a future claim card: a baseline, a log, a comparison and a note of what else changed."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 4.5 'the number to move'; 3.2 claim card (module 3)"
        mermaid: |
          flowchart TD
            A["Baseline from the owner's notebook"] --> B["The tool logs each stockout"]
            B --> C["Compare the two months after launch"]
            C --> D["Note what else changed: season, a new supplier"]
      - {n: 5, heading: "The first real user milestone", claim: "A project someone used proves more than one built fast; name a first real user and a date.", visual: scene, slug: career-m4-first-real-user, register: card, playable: false, predict: false, transfer: "gate 4.7 'first real user'"}
    predict: {before_beat: 2, prompt: "Areej has 6 weeks at 5 hours a week. Which feature should go first when time runs short?", options: ["Supplier ordering for the shop", "The low-stock warning"], correct: 1}
    quick_check: ["QC1: choose the scope that fits a 4-week, 4-hour appetite."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will pick what to keep when time runs short before the plan is fixed", budget: 1}
      - {type: CANVAS, slug: career-m4-scope-sentence, placement: beat 2, purpose: "This proves the learner can cut an over-large plan to one flow, a time box and a number", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the scope that fits the time box", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "The plan card's three slots; the measurement plan from baseline to comparison", placement: beats 3 and 4, canvas_decision: "phrase fixer at beat 2 carries the playable claim"}
    density: {beats: 5, scenes: 2, mermaid: 2, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  # ===================================================================
  # MODULE 5: Show your work so people look
  # ===================================================================

  - id: "05.01"
    title: Set the scene
    module: 5
    type: Read
    archetype: orientation (Read, story register)
    beats:
      - {n: 1, heading: "A GitHub link nobody opens", claim: "Moath's README starts with install commands, so the founder moves on without cloning it.", visual: scene, slug: career-m5-link-nobody-opens, register: card, playable: false, predict: false, transfer: "none (story beat); 5.2 beat 1 and quiz 5.7 #1"}
      - {n: 2, heading: "A minute to wake, then a sign-up", claim: "The demo link is asleep on a free plan, then asks for an account; the founder closes the tab.", visual: scene, slug: career-m5-sleep-then-signup, register: card, playable: false, predict: false, transfer: "5.2 beat 3 (playable) and 5.3 beat 1"}
    outside_beats: [LearningObjectives]
    predict: {type: optional everyday question after beat 2, prompt: "What would have let the founder see the app straight away?", note: "answerable from the pictures; no number of seconds"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show two ways a good app is never seen", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "The two scenes are the diagrams; module diagrams are in 5.2 beat 1, 5.4 beat 4 (README) and 5.5 beats 1, 3 and 4."

  - id: "05.02"
    title: Nobody will run your code
    module: 5
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Nobody will clone and run it"
        claim: "A reader would have to clone, install, set variables and start a database, and most stop at the first step."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 5.7 #1; gate 5.8 'showcase plan'"
        mermaid: |
          flowchart TD
            A["Clone the repository"] --> B["Install packages"]
            B --> C["Set environment variables"]
            C --> D["Start a database"]
            D --> E["See the app"]
            A -.->|"most readers stop here"| X["The reader leaves"]
      - {n: 2, heading: "A deployable unit runs the same anywhere", claim: "A container behaves the same on a laptop and a server, so the README needs one start command.", visual: scene, slug: career-m5-same-box, register: card, playable: false, predict: false, transfer: "build 5.6 showcase plan 'one-command start'; gate 5.8 checklist"}
      - {n: 3, heading: "The stranger's path to a first screen", claim: "A sleeping demo and a sign-up use up a stranger's patience before a useful screen; put a page that needs nothing first.", visual: budget-stack, slug: career-m5-stranger-path, register: card, playable: true, predict: true, transfer: "quiz 5.7 #4; gate 5.8 stranger test"}
      - n: 4
        heading: "A README in reader order"
        claim: "Your README is the first page of the project: what it is, a screenshot or demo link, how to try it in a minute, how it was measured, and what is not done."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 5.7 #1; build 5.6 README outline"
        mermaid: |
          flowchart TD
            A["What it is, in one line"] --> B["A screenshot or short demo link"]
            B --> C["Try it in a minute"]
            C --> D["How it was measured"]
            D --> E["What is not done yet"]
      - {n: 5, heading: "Links that still work in six months", claim: "Free plans sleep, expire and change their rules; link your resume to a static case study page and a recording.", visual: scene, slug: career-m5-links-in-six-months, register: card, playable: false, predict: false, transfer: "quiz 5.7 #4; 6.5 beat 2 (test every link on a phone)"}
    predict: {before_beat: 3, prompt: "Moath's demo is on a free plan that sleeps when idle. What does the founder see first?", options: ["A loading screen, then the app", "The app, ready straight away"], correct: 0}
    quick_check: ["QC1: choose the README opening that lets a reader try the project in a minute."]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner knows what a stranger meets first on a free plan before the path is shown", budget: 1}
      - {type: CANVAS, slug: career-m5-stranger-path, placement: beat 3, purpose: "This proves the learner can reorder a stranger's path so a useful screen comes first", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the README opening", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "Setup steps a reader will not do; the README in reader order", placement: beats 1 and 4, canvas_decision: "budget stack at beat 3 carries the playable claim"}
    density: {beats: 5, scenes: 2, mermaid: 2, budget_stack: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "05.03"
    title: Let them in with one click
    module: 5
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Every extra step is a door to leave", claim: "Sign-up, confirmation and a profile form are four doors to leave by; one button is none.", visual: scene, slug: career-m5-extra-steps, register: card, playable: false, predict: false, transfer: "gate 5.8 stranger test; quiz 5.7 #3"}
      - {n: 2, heading: "Sign in with Google, smallest request", claim: "Asking Google only for name, email and profile picture means no test-user list, no warning and no expiry.", visual: scene, slug: career-m5-google-consent, register: card, playable: false, predict: false, transfer: "quiz 5.7 #3"}
      - {n: 3, heading: "A demo login that can do everything", claim: "A 'Try the demo' button opens the full app on a fake shop; the safety comes from the data and rights around it.", visual: scene, slug: career-m5-demo-login, register: card, playable: false, predict: true, transfer: "quiz 5.7 #2; QC1"}
      - {n: 4, heading: "Remove a control, see the risk", claim: "Fake data, low rights, limits with a reset, and keys kept out of the repository each stop a different harm.", visual: sorter, slug: career-m5-remove-a-control, register: card, playable: true, predict: false, transfer: "quiz 5.7 #2 and #5; gate 5.8 'safety'; build 5.6 demo checklist"}
      - {n: 5, heading: "When you cannot deploy at all", claim: "A static case study page with screenshots and a short recording counts as a showcase.", visual: scene, slug: career-m5-no-hosting, register: card, playable: false, predict: false, transfer: "gate 5.8 learning log prompt 4"}
    predict: {before_beat: 3, prompt: "A shared demo login is printed in the README. What has to be true for that to be safe?", options: ["The password is long and hard to guess", "Everything behind it is fake and limited"], correct: 1}
    quick_check: ["QC1: for a given demo, which missing control is the most dangerous?"]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner will say what makes a printed demo login safe before the controls are shown", budget: 1}
      - {type: CANVAS, slug: career-m5-remove-a-control, placement: beat 4, purpose: "This proves the learner can name the control that stops each harm a stranger could do to a demo", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: spot the most dangerous missing control", budget: 1}
    diagram_plan: {format: scene beats, claim: "Fewer steps in, and a demo that is safe by design", placement: beats 1 to 5, canvas_decision: "sorter at beat 4 carries the playable claim"}
    density: {beats: 5, scenes: 4, mermaid: 0, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "05.04"
    title: A short demo of the core
    module: 5
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Start with the result", claim: "The first frame of a demo shows what the product does for the user, not a logo.", visual: scene, slug: career-m5-start-with-result, register: card, playable: false, predict: false, transfer: "build 5.6 storyboard; gate 5.8 checklist"}
      - {n: 2, heading: "Cut the filler, keep the core", claim: "A demo of 60 to 120 seconds keeps the warning, the sale and the invoice and cuts the logo, the sign-up and the settings tour.", visual: budget-stack, slug: career-m5-demo-storyboard, register: card, playable: true, predict: true, transfer: "QC1; build 5.6 storyboard"}
      - {n: 3, heading: "Show the hard part, not a tour", claim: "Linger on the one thing that was hard to build; a tour of menus proves little.", visual: scene, slug: career-m5-show-the-hard-part, register: card, playable: false, predict: false, transfer: "gate 5.8 drill probe (what would you do differently)"}
      - {n: 4, heading: "Captions, because many watch muted", claim: "Many viewers watch without sound, so captions are needed; they are also an accessibility rule.", visual: scene, slug: career-m5-captions, register: card, playable: false, predict: false, transfer: "build 5.6 storyboard acceptance"}
      - {n: 5, heading: "Screenshot first on weak data", claim: "Show a screenshot first and link the video with its size stated; never autoplay.", visual: scene, slug: career-m5-screenshot-first, register: card, playable: false, predict: false, transfer: "build 5.6 showcase plan 'base layer'"}
    predict: {before_beat: 2, prompt: "Which frame should open a 90-second demo of Raqim Stock?", options: ["A logo and the company name", "The low-stock warning"], correct: 1}
    quick_check: ["QC1: choose the storyboard that fits the rules (result first, within the time, captions)."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner picks the opening frame by its payoff before the storyboard is reordered", budget: 1}
      - {type: CANVAS, slug: career-m5-demo-storyboard, placement: beat 2, purpose: "This proves the learner can reorder frames so the core fits inside the time", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the storyboard that fits the rules", budget: 1}
    diagram_plan: {format: scene beats, claim: "Result first, core only, captions, light page", placement: beats 1 to 5, canvas_decision: "budget stack at beat 2 carries the playable claim"}
    density: {beats: 5, scenes: 4, mermaid: 0, budget_stack: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "05.05"
    title: The case study, a postmortem for a success
    module: 5
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "A postmortem, but for a success"
        claim: "An incident report's fields line up with a case study's sections: what was wrong, what it cost, what you changed and how you know."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "QC1; build 5.6 case study outline"
        mermaid: |
          flowchart TD
            I1["Summary and impact"] --> C1["The problem, and who felt it"]
            I2["Root cause and resolution"] --> C2["What I did, and what the team did"]
            I3["Lessons"] --> C3["Numbers after, and what I would change"]
      - {n: 2, heading: "Build it from a ledger row", claim: "A case study is built from ledger rows: problem, numbers before, what I did, numbers after, what else changed, and what I would do differently.", visual: slot-card, slug: career-m5-case-from-row, register: card, playable: true, predict: false, transfer: "gate 5.8 'case study complete'; quiz 9.5 #5"}
      - n: 3
        heading: "Your part and the team's, in writing"
        claim: "The case study answers 'what did your lead do?' before anyone asks."
        visual: mermaid
        slug: null
        playable: false
        predict: true
        transfer: "QC1; gate 5.8 written option (the stranger's question)"
        mermaid: |
          flowchart TD
            S["Case study section: what I did, and what the team did"] --> A["Areej: found, planned, chose, wrote"]
            S --> L["Her lead: reviewed, scheduled, deployed"]
      - n: 4
        heading: "What you would do differently"
        claim: "Saying what you would change shows iteration."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 5.6 case study 'what I would change'"
        mermaid: |
          flowchart TD
            A["What happened: she found the query in the slow query log"] --> B["What I would change: add a slow-query alert"]
            B --> C["The next slow query is found sooner"]
      - {n: 5, heading: "Permission and removed names", claim: "Ask first, remove the company and table names and any customer data, and say it is shared with permission.", visual: scene, slug: career-m5-redacted-chart, register: card, playable: false, predict: false, transfer: "gate 5.8 checklist 'I asked permission'"}
      - {n: 6, heading: "It still works when the demo sleeps", claim: "The case study page opens on a phone with its images and chart even when the live demo is asleep.", visual: scene, slug: career-m5-demo-asleep, register: card, playable: false, predict: false, transfer: "quiz 5.7 #4; quiz 9.5 #3; gate 5.8 learning log prompt 4"}
    predict: {before_beat: 3, prompt: "A reader wants to know what Areej's lead did. Where should the case study answer that?", options: ["In the 'what I did' section", "In a note after the numbers"], correct: 0}
    quick_check: ["QC1: choose which case study section a given sentence belongs in."]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner knows where a case study states the team's part", budget: 1}
      - {type: CANVAS, slug: career-m5-case-from-row, placement: beat 2, purpose: "This proves the learner can build a case study from ledger rows and refuse a boast", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: place a sentence in its section", budget: 1}
    diagram_plan: {format: MermaidDiagram x3, claim: "Postmortem fields to case study sections; the split of my part and the team's; the change I would make", placement: beats 1, 3 and 4, canvas_decision: "slot card at beat 2 carries the playable claim"}
    density: {beats: 6, scenes: 2, mermaid: 3, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  # ===================================================================
  # MODULE 6: A resume that reads as you
  # ===================================================================

  - id: "06.01"
    title: Set the scene
    module: 6
    type: Read
    archetype: orientation (Read, story register)
    beats:
      - {n: 1, heading: "Lines that could be anyone's", claim: "Waed's resume says 'responsible for coordinating shipments' with an AI-written summary; three other resumes use almost the same words.", visual: scene, slug: career-m6-lines-anyones, register: card, playable: false, predict: false, transfer: "none (story beat); 6.3 beat 1 and 6.4 beat 3"}
      - {n: 2, heading: "The work that is missing", claim: "Waed's tracker cut missed delivery confirmations from about 30 a month to 6, and none of it is on her resume.", visual: scene, slug: career-m6-missing-tracker, register: card, playable: false, predict: false, transfer: "6.3 beat 1 (her owned bullet); 6.4 beat 3"}
    outside_beats: [LearningObjectives]
    predict: {type: optional everyday question after beat 2, prompt: "Which of these would a hiring manager remember?", note: "answerable from the pictures"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show interchangeable lines and a real result left off the page", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "The two scenes are the diagrams; module diagrams are in 6.2 beats 1 and 2, 6.3 beat 3, 6.4 beat 1 and 6.5 beat 1."

  - id: "06.02"
    title: "Structure: strongest proof first"
    module: 6
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "No proven right length"
        claim: "There is no proven right length; put the strongest proof first and cut what does not help this reader."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 6.7 #1"
        mermaid: |
          flowchart TD
            A["One page or two?"] --> B["No proven right length"]
            B --> C["Put the strongest proof first"]
            C --> D["Cut what does not help this reader"]
      - n: 2
        heading: "Order by strength of proof"
        claim: "Across sections, what this reader needs first; within a role, the strongest checkable result first."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 6.7 #1; build 6.6 outline"
        mermaid: |
          flowchart TD
            A["Name and links line"] --> B["Two-line summary"]
            B --> C["Experience: internship first, then freelance"]
            C --> D["Projects: Campus Board"]
            D --> E["Volunteer"]
            E --> F["Skills, one line"]
            F --> G["Education"]
      - {n: 3, heading: "The paste test", claim: "A resume should survive a paste into a plain text editor with its order and words intact.", visual: sorter, slug: career-m6-paste-test, register: card, playable: true, predict: false, transfer: "gate 6.8 checklist 'paste test'; build 6.6 acceptance"}
      - {n: 4, heading: "What tracking software really does", claim: "Tracking software files and filters by rules a person set, and a person decides; 'most resumes are thrown out by a robot' has no source.", visual: scene, slug: career-m6-filing-cabinet, register: card, playable: false, predict: true, transfer: "quiz 6.7 #3"}
      - {n: 5, heading: "A plain file a program can read", claim: "Send a standard file with selectable text and links written out; an image-only file can fail to import.", visual: scene, slug: career-m6-plain-file, register: card, playable: false, predict: false, transfer: "gate 6.8 'standard file'; build 6.6 acceptance"}
    predict: {before_beat: 4, prompt: "What share of resumes are rejected by software before a person reads them?", options: ["About 75 percent, as is often said", "Nobody has a sourced number"], correct: 1}
    quick_check: ["QC1: choose the section order for an early-career fellow with one strong internship result."]
    interactions:
      - {type: PREDICT, placement: before beat 4, purpose: "This proves the learner commits to a belief about robot rejection before the sourcing is shown", budget: 1}
      - {type: CANVAS, slug: career-m6-paste-test, placement: beat 3, purpose: "This proves the learner can tell which layout choices survive a plain-text paste", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: order the sections by strength of proof", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "No proven length, so proof first; Areej's section order", placement: beats 1 and 2, canvas_decision: "sorter at beat 3 carries the playable claim"}
    density: {beats: 5, scenes: 2, mermaid: 2, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "06.03"
    title: Bullets with ownership and honest results
    module: 6
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "\"Responsible for\" is a job description", claim: "A duty says what you were supposed to do; a bullet says what changed because you did it.", visual: scene, slug: career-m6-duty-vs-bullet, register: card, playable: false, predict: false, transfer: "quiz 6.7 #2"}
      - {n: 2, heading: "Build a bullet from a claim card", claim: "A bullet says what you owned, the change with its before and after, the window, how, and your share.", visual: slot-card, slug: career-m6-build-a-bullet, register: card, playable: true, predict: true, transfer: "quiz 6.7 #2; gate 6.8 rubric 'bullets'"}
      - n: 3
        heading: "Before, after and window in few words"
        claim: "Put the source and window in a short bracket; the full detail lives in the ledger and the case study."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 6.7 #2; build 6.6 mapping table"
        mermaid: |
          flowchart TD
            B["Bullet: ... (14 days before and after, team dashboard)"] --> L["Ledger row: source and how to re-check it"]
            B --> C["Case study: the full story"]
      - {n: 4, heading: "Say your share, without shrinking it", claim: "Stating the team's part makes your part believable; blurring 'we' into 'I' is a failure and embellishment is deception.", visual: reuse, slug: career-m2-found-vs-team, register: card, playable: false, predict: false, transfer: "quiz 6.7 #5 (the AI rewrite drops her share); QC1", reuse_reason: "Same claim and the same seven steps of the report fix, from module 2.3. Repeating it here, now applied to a resume bullet, is deliberate spaced repetition. No new spec is needed."}
      - {n: 5, heading: "No number? Show the change another way", claim: "Never invent a number; a checkable action or an honest gap is a good bullet.", visual: scene, slug: career-m6-no-number-bullet, register: card, playable: false, predict: false, transfer: "build 6.6 (the key bullet); gate 6.8 rubric 'bullets'"}
    predict: {before_beat: 2, prompt: "Which of two bullets survives the question 'how was that measured?'", options: ["Cut the report p95 from 4.6 s to 0.41 s", "Improved backend speed by 90 percent"], correct: 0}
    quick_check: ["QC1: choose the bullet with ownership, before, after and window."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner can tell which bullet survives a measurement question before building one", budget: 1}
      - {type: CANVAS, slug: career-m6-build-a-bullet, placement: beat 2, purpose: "This proves the learner can assemble a bullet from a claim card and refuse vague or empty lines", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the owned, measured bullet", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "A short bracket in the bullet points to the ledger row and the case study", placement: beat 3, canvas_decision: "slot card at beat 2 carries the playable claim"}
    density: {beats: 5, scenes: 2, reused_scene: 1, mermaid: 1, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "06.04"
    title: Drafting with AI, and the empty sentence edit
    module: 6
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Your material in, structure out"
        claim: "AI may restructure your own material; anything not in the inputs is deleted."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 6.6 'AI on own material'; quiz 6.7 #5"
        mermaid: |
          flowchart TD
            A["Your arc and ledger rows"] --> B["AI tool: restructure only"]
            B --> C{"Is every fact in my inputs?"}
            C -->|no| D["Delete it"]
            C -->|yes| E["A draft you edit yourself"]
      - {n: 2, heading: "What an empty sentence looks like", claim: "Remove every word a reader cannot check from Areej's old bullet and almost nothing is left.", visual: scene, slug: career-m6-old-bullet-marked, register: card, playable: false, predict: true, transfer: "QC1; quiz 6.7 #5"}
      - {n: 3, heading: "Tap the empty phrases", claim: "A summary can read well and hold no checkable fact; each empty phrase must become something the writer can back up.", visual: phrase-fixer, slug: career-m6-empty-phrases, register: card, playable: true, predict: false, transfer: "QC1; quiz 6.7 #5; gate 6.8 'bullets'", note: "existing slug, data revised to match the canon (see its spec)"}
      - {n: 4, heading: "Three adjectives or one fact", claim: "One fact a reader can check gives them a question; adjectives never do.", visual: scene, slug: career-m6-adjectives-or-fact, register: card, playable: false, predict: false, transfer: "gate 6.8 learning log prompt 3"}
      - {n: 5, heading: "Never write to sound unlike a model", claim: "A humaniser changes style and adds no facts; the question is whether it says something only you could say.", visual: scene, slug: career-m6-humaniser-no, register: card, playable: false, predict: false, transfer: "quiz 1.5 #5 and quiz 6.7 #5"}
    predict: {before_beat: 2, prompt: "Remove every word from Areej's old bullet that a reader cannot check. What is left?", options: ["Her role and a result", "Almost nothing"], correct: 1}
    quick_check: ["QC1: choose the edit that keeps the information and drops the empty phrases."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will estimate how much checkable content a stock sentence holds before it is marked", budget: 1}
      - {type: CANVAS, slug: career-m6-empty-phrases, placement: beat 3, purpose: "This proves the learner can find the empty phrases in an AI-written summary and replace each with a fact", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the edit that keeps information", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "Inputs in, structure out, gate on anything not in the inputs", placement: beat 1, canvas_decision: "phrase fixer at beat 3 carries the playable claim"}
    density: {beats: 5, scenes: 3, mermaid: 1, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "06.05"
    title: Links and tailoring
    module: 6
    type: Learn
    archetype: concept (Learn, beats)
    beats:
