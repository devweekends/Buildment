# Interaction map: career-brand (course 16)
#
# Every Learn and Read chapter is mapped beat by beat. For each beat: heading (8 words or fewer), the claim the
# picture proves, the visual kind, the slug (specs in canvas-specs/<slug>.md hold the data in full, as one JSON block
# that maps onto data.ts), whether it is playable, whether the chapter's predict sits right before it, and the
# transfer check (the quiz item or gate task that later tests the claim). Mermaid beats carry their source here.
# Build, Check and Gate chapters follow in other_chapters (no canvas in a quiz or gate chapter).
#
# Visual kinds used: scene, mermaid, sorter, phrase-fixer, budget-stack, slot-card, and three reused slugs.
# No custom canvas and no factor renderer. Card register everywhere (the illustrated register is custom code).
