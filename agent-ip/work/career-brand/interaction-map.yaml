  - id: "07.02"
    title: Your profile, field by field
    module: 7
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "The headline travels with your name", claim: "The headline shows on your profile and in search results, so say what you do and who for in its first words.", visual: scene, slug: career-m7-headline-travels, register: card, playable: false, predict: false, transfer: "quiz 7.6 #1; gate 7.7 'profile rebuilt'"}
      - {n: 2, heading: "Write a headline a stranger understands", claim: "A headline works when its first words give the role, the tools and what you do; adjectives and 'open to opportunities' tell a stranger nothing.", visual: slot-card, slug: career-m7-headline-parts, register: card, playable: true, predict: true, transfer: "quiz 7.6 #1; build 7.5 profile worksheet"}
      - n: 3
        heading: "About: mission, motivation, skills"
        claim: "About is one or two short paragraphs: what you do and for whom, two proofs, one human line and what you are looking for."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "QC1; build 7.5 profile worksheet"
        mermaid: |
          flowchart TD
            A["Paragraph 1: what I do, and for whom"] --> B["Two proofs with numbers"]
            B --> C["Paragraph 2: one human line"]
            C --> D["What I am looking for"]
      - n: 4
        heading: "Featured is where your proof goes"
        claim: "Featured holds the case study, the repository and later your post; a link, a document or your own post is not described as paid."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 7.5 profile; gate 7.7 checklist 'Featured holds my case study link'"
        mermaid: |
          flowchart TD
            F["Featured"] --> A["The case study link"]
            F --> B["The Campus Board repository link"]
            F --> C["Later: your post"]
      - {n: 5, heading: "Experience: accurate, real, with proof", claim: "Name organisations accurately, list real ties, and attach a ledger bullet and skills to each entry.", visual: scene, slug: career-m7-experience-entry, register: card, playable: false, predict: false, transfer: "gate 7.7 'every number is in my ledger'"}
      - n: 6
        heading: "Open to Work and your profile address"
        claim: "Open to Work has three audiences, and the first includes people at your current company; a custom address can be changed only a few times."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 7.5 'Open to Work decision'; not quizzed"
        mermaid: |
          flowchart TD
            O["Open to Work"] --> A["All members: adds the frame and includes people at your current company"]
            O --> B["Recruiters only: privacy at your company is not guaranteed"]
            O --> C["Only you"]
    predict: {before_beat: 2, prompt: "Which headline tells a founder what you do in the first words?", options: ["Passionate, curious developer and lifelong learner", "Freelance web developer (Laravel, WordPress)"], correct: 1}
    quick_check: ["QC1: choose the About opening that leads with proof."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner can say which headline works in its first words before building one", budget: 1}
      - {type: CANVAS, slug: career-m7-headline-parts, placement: beat 2, purpose: "This proves the learner can build a headline from role, tools and a proof habit and refuse empty phrases", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the About opening that leads with proof", budget: 1}
    diagram_plan: {format: MermaidDiagram x3, claim: "About in four parts; Featured with three items; the three Open to Work audiences", placement: beats 3, 4 and 6, canvas_decision: "slot card at beat 2 carries the playable claim"}
    density: {beats: 6, scenes: 2, mermaid: 3, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "07.03"
    title: Posts and comments that add something
    module: 7
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "Each feed is built for one viewer", claim: "LinkedIn builds a different feed for each person from their profile and engagement; no outsider has an exact recipe.", visual: scene, slug: career-m7-different-feeds, register: card, playable: false, predict: false, transfer: "quiz 7.6 #5"}
      - {n: 2, heading: "Folklore, and what LinkedIn says", claim: "Treat any exact number from a guide as a guess; LinkedIn's own tips say be relevant, avoid being overly promotional, and comment on others' posts.", visual: scene, slug: career-m7-folklore-cards, register: card, playable: false, predict: true, transfer: "quiz 7.6 #5; gate 7.7 learning log prompt 3"}
      - n: 3
        heading: "A post about real work"
        claim: "A short LinkedIn post about real work holds the problem, one number with its source, a screenshot and what you would change."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 7.5 four-week plan; 8.2 (the long version)"
        mermaid: |
          flowchart TD
            A["The problem"] --> B["One number, with its source"]
            B --> C["A screenshot"]
            C --> D["What I would change"]
      - {n: 4, heading: "A comment that adds one thing", claim: "A good comment adds one useful thing, a small true example or a question that shows you read the post; a pitch adds nothing.", visual: phrase-fixer, slug: career-m7-comment-edit, register: card, playable: true, predict: false, transfer: "quiz 7.6 #2; QC1; build 7.5 five comments"}
      - {n: 5, heading: "What the rules forbid", claim: "Bots, auto-comment tools, groups that agree in advance to like each other's posts and fake accounts can get an account restricted.", visual: scene, slug: career-m7-rules-forbid, register: card, playable: false, predict: false, transfer: "quiz 7.6 #4; gate 7.7 'rules respected'"}
    predict: {before_beat: 2, prompt: "A guide says posts with links get no reach. What does LinkedIn's own help page say about links?", options: ["It says links are punished", "It says nothing of the kind"], correct: 1}
    quick_check: ["QC1: choose the comment that adds something."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will test a folklore claim against a first-party source before reading it", budget: 1}
      - {type: CANVAS, slug: career-m7-comment-edit, placement: beat 4, purpose: "This proves the learner can turn an empty comment into one that adds a small true example", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the comment that adds something", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "A short post has four parts", placement: beat 3, canvas_decision: "phrase fixer at beat 4 carries the playable claim"}
    density: {beats: 5, scenes: 3, mermaid: 1, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "07.04"
    title: Outreach and honest growth
    module: 7
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "People say yes more than you expect", claim: "In studies of asking for help, people underestimated, by as much as 50 percent in some, how often others say yes to a direct, small request.", visual: scene, slug: career-m7-more-yes, register: card, playable: false, predict: true, transfer: "build 7.5 outreach drafts; gate 7.7 learning log prompt 2"}
      - n: 2
        heading: "Start with people you once knew"
        claim: "Start with people you once knew, then people you know a little; it is about who is in your network, not proof that messaging strangers works."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "QC1; build 7.5 outreach card 'tie type'"
        mermaid: |
          flowchart TD
            A["People you once knew well: teachers, past leads, classmates"] --> B["People you know a little"]
            B --> C["Strangers: comment first, then ask"]
      - {n: 3, heading: "Free accounts: connections and few notes", claim: "A free account can message connections only and has a few personalised notes a month; plan for three and count them.", visual: scene, slug: career-m7-free-account, register: card, playable: false, predict: false, transfer: "quiz 7.6 #3"}
      - {n: 4, heading: "Spend a small note budget", claim: "Keep your few notes for people you have a specific reason to write to; connect plainly when you already talk and comment first with strangers.", visual: sorter, slug: career-m7-spend-the-notes, register: card, playable: true, predict: false, transfer: "quiz 7.6 #3; QC1; gate 7.7 'drafts'"}
      - n: 5
        heading: "A message a busy person can answer"
        claim: "A short message says who you are in one line, why this person, one specific question and an easy way to say no."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 7.5 three outreach drafts; gate 7.7 rubric 'drafts'"
        mermaid: |
          flowchart TD
            A["Who you are, in one line"] --> B["Why this person"]
            B --> C["One specific question"]
            C --> D["An easy way to say no"]
      - {n: 6, heading: "Grow slowly, measure eight weeks", claim: "No one has proof of what grows an audience; post real work, comment well and log your own results for eight weeks.", visual: scene, slug: career-m7-eight-week-log, register: card, playable: false, predict: false, transfer: "gate 7.7 learning log prompt 4; build 7.5 eight-week log"}
    predict: {before_beat: 1, prompt: "You ask someone you barely know for one small, specific piece of advice. Compared with what you expect, how often do people say yes?", options: ["More often than you expect", "Less often than you expect"], correct: 0}
    quick_check: ["QC1: with three notes left this month, choose who gets one of them."]
    interactions:
      - {type: PREDICT, placement: before beat 1, purpose: "This proves the learner commits to how likely a small ask is to succeed before the studies", budget: 1}
      - {type: CANVAS, slug: career-m7-spend-the-notes, placement: beat 4, purpose: "This proves the learner can decide who gets a note and how to reach everyone else", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose who gets one of three notes", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "Contact rings from known to strangers; the four parts of an answerable message", placement: beats 2 and 5, canvas_decision: "sorter at beat 4 carries the playable claim"}
    density: {beats: 6, scenes: 3, mermaid: 2, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

