      flowchart TD
        A["Career arc document (private)"] --> B["Claim ledger (module 3)"]
        A --> C["Resume (module 6)"]
        A --> D["LinkedIn profile (module 7)"]
        A --> E["Post and website plan (module 8)"]
    note: "Steps, the nine-part Markdown template, Areej's arc as the worked example, at most two Callouts. No openquestion mid-build."
