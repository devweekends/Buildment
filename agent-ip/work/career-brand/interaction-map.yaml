# Existing slugs: career-m1-first-look (1.2 beat 3), career-m3-claim-card (3.2 beat 3) and
# career-m6-empty-phrases (6.4 beat 3) keep their slugs and are used in these chapters. Their data conflicts with the
# canon (invented numbers and characters), so their specs give revised data.

