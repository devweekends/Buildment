  - id: "08.02"
    title: A post about your own work
    module: 8
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - {n: 1, heading: "A visitor judges you by your writing", claim: "One post shows a visitor the problem, the test and the trade-off, and so how its author thinks.", visual: scene, slug: career-m8-visitor-judges, register: card, playable: false, predict: false, transfer: "gate 8.8 'post' part"}
      - n: 2
        heading: "Problem, what I tried, numbers, change"
        claim: "A post has four parts: the problem, what I tried, the numbers with their source, and what I would change."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 8.7 #1; QC1; build 8.5 spine"
        mermaid: |
          flowchart TD
            A["The problem: a slow events list"] --> B["What I tried: a 30-second cache"]
            B --> C["The numbers: p95 820 ms to 95 ms, same test"]
            C --> D["What I would change: test on production-like data"]
      - {n: 3, heading: "Start where the reader's question is", claim: "A busy reader keeps reading when the problem and the result come first, then how you know.", visual: budget-stack, slug: career-m8-open-with-problem, register: card, playable: true, predict: true, transfer: "quiz 8.7 #1; build 8.5 acceptance"}
      - {n: 4, heading: "Plain words, short sentences", claim: "Write for a tired colleague: short words, active verbs, one idea per sentence; plain is not childish.", visual: scene, slug: career-m8-plain-words, register: card, playable: false, predict: false, transfer: "build 8.5 acceptance 'plain language'"}
      - {n: 5, heading: "The say-it-back test", claim: "Ask someone to say your post back in their own words; if they cannot, rewrite, and test at least twice.", visual: scene, slug: career-m8-say-it-back, register: card, playable: false, predict: false, transfer: "gate 8.8 'say-it-back'"}
      - n: 6
        heading: "Say when AI helped"
        claim: "End the post with one honest line about how AI helped, and check every number and decision yourself."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 8.5 'AI-use line'; quiz 8.7 #5"
        mermaid: |
          flowchart TD
            A["Your notes and numbers"] --> B["AI tool: restructure into sections"]
            B --> C["You check every number and decision"]
            C --> D["Last line: say how AI helped"]
    predict: {before_beat: 3, prompt: "A busy reader opens your post. Which opening keeps them: the history of the project, or the problem and the result?", options: ["The history of the project", "The problem and the result"], correct: 1}
    quick_check: ["QC1: choose the post outline that has all four parts."]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner chooses an opening by the reader's question before the paragraphs are reordered", budget: 1}
      - {type: CANVAS, slug: career-m8-open-with-problem, placement: beat 3, purpose: "This proves the learner can reorder a post so the problem and result come first", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the outline with all four parts", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "The four-part spine of Areej's post; the AI-use line comes after your own checks", placement: beats 2 and 6, canvas_decision: "budget stack at beat 3 carries the playable claim"}
    density: {beats: 6, scenes: 3, mermaid: 2, budget_stack: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "08.03"
    title: Publish once, share in about ten places
    module: 8
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Your own page is the original"
        claim: "Publish on a page you own first and share copies that lead back to it."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 8.7 #3; build 8.5 channel plan row 1"
        mermaid: |
          flowchart TD
            H["Your own page: the original"] --> L["LinkedIn: short version and a link"]
            H --> D["DEV: full copy with canonical_url"]
            H --> M["Medium: full copy, originally published elsewhere"]
            H --> G["Repository README: a link"]
      - {n: 2, heading: "Search picks one copy, with no penalty", claim: "Google picks one version to show, which may be another site's copy; a canonical link is a hint, and copies are not penalised.", visual: scene, slug: career-m8-search-picks-one, register: card, playable: false, predict: true, transfer: "quiz 8.7 #2"}
      - {n: 3, heading: "Where a canonical field exists", claim: "DEV, Medium and LinkedIn each point back in their own way; where a setting is unverified, use the 'first published at' line.", visual: scene, slug: career-m8-canonical-fields, register: card, playable: false, predict: false, transfer: "quiz 8.7 #3; QC1"}
      - {n: 4, heading: "Map your ten channels", claim: "Each channel gets the version that suits it, and every copy has a way back to your page.", visual: sorter, slug: career-m8-channel-versions, register: card, playable: true, predict: false, transfer: "build 8.5 channel plan; gate 8.8 'channel plan'"}
      - {n: 5, heading: "One honest line on every copy", claim: "Write 'First published at [your site]' with a link at the top or bottom of every copy.", visual: scene, slug: career-m8-first-published-line, register: card, playable: false, predict: false, transfer: "quiz 8.7 #3; gate 8.8 checklist 'copy says where first published'"}
    predict: {before_beat: 2, prompt: "You publish the same article on your site and on two platforms. What does Google do with the copies?", options: ["Picks one version to show", "Penalises you for the copies"], correct: 0}
    quick_check: ["QC1: a platform has no canonical field; choose what to do."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner commits to what search does with copies before the myth is tested", budget: 1}
      - {type: CANVAS, slug: career-m8-channel-versions, placement: beat 4, purpose: "This proves the learner can give each channel the right version and keep a way back to the original", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: share honestly where no canonical field exists", budget: 1}
    diagram_plan: {format: MermaidDiagram, claim: "Your own page at the centre, copies pointing back", placement: beat 1, canvas_decision: "sorter at beat 4 carries the playable claim"}
    density: {beats: 5, scenes: 3, mermaid: 1, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  - id: "08.04"
    title: A website that is clearly yours
    module: 8
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "A few pages are enough"
        claim: "A personal site is a few pages: home, work, writing, about and contact."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 8.6 pages; gate 8.8 'website plan'"
        mermaid: |
          flowchart TD
            H["Home"] --> W["Work"]
            H --> R["Writing"]
            H --> A["About"]
            H --> C["Contact"]
      - {n: 2, heading: "Specifics make it yours", claim: "A visitor believes a site is yours when it has your number, your screenshot and your mistake; passing a detector is not the goal.", visual: scene, slug: career-m8-specifics-or-template, register: card, playable: false, predict: true, transfer: "quiz 8.7 #4 and #5"}
      - {n: 3, heading: "Swap generic for specific", claim: "Put a specific in each place a template puts a generic: a real screenshot, your own line, dates, a number and an honest mistake.", visual: slot-card, slug: career-m8-swap-generic, register: card, playable: true, predict: false, transfer: "quiz 8.7 #4; build 8.6 'at least four specifics'"}
      - n: 4
        heading: "A free static host, checked"
        claim: "A free static host is enough; its limits matter and carry a check date."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 8.6 'host with a check date'"
        mermaid: |
          flowchart TD
            H["A free static host, checked 2026-10"] --> G["GitHub Pages: up to 1 GB, not for commercial transactions"]
            H --> C["Cloudflare Pages free: 500 builds a month"]
            H --> V["Vercel Hobby: personal, non-commercial only"]
      - {n: 5, heading: "Small, dated and alive", claim: "The site is home to your originals and the base for your resume links; one small update a month keeps it alive.", visual: scene, slug: career-m8-small-and-alive, register: card, playable: false, predict: false, transfer: "build 8.6 'update plan'; gate 8.8 learning log prompt 3"}
    predict: {before_beat: 2, prompt: "What makes a visitor believe you wrote your site yourself?", options: ["It passes an AI detector check", "It has specifics only you have"], correct: 1}
    quick_check: ["QC1: choose the home page line that shows first-hand work."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner will say what makes a site believable before specifics are shown", budget: 1}
      - {type: CANVAS, slug: career-m8-swap-generic, placement: beat 3, purpose: "This proves the learner can replace generic site parts with specifics only the writer has", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the first-hand home page line", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "The five-page site map; free static hosts with their limits", placement: beats 1 and 4, canvas_decision: "slot card at beat 3 carries the playable claim"}
    density: {beats: 5, scenes: 2, mermaid: 2, slot_card: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

  # ===================================================================
  # MODULE 9: Capstone: your kit, defended
  # ===================================================================

  - id: "09.01"
    title: Set the scene
    module: 9
    type: Read
    archetype: orientation (Read, story register)
    beats:
      - {n: 1, heading: "\"Where did 40 percent come from?\"", claim: "A mentor points at Ismail's line 'reduced escaped bugs by 40 percent' and asks where the number came from.", visual: scene, slug: career-m9-line-picked, register: card, playable: false, predict: false, transfer: "none (story beat); the capstone defence 9.4"}
      - {n: 2, heading: "He opens the ledger", claim: "Ismail shows the row: 10 per release over five releases before and 6 over five after, his checklist, and the team's code review in the same period.", visual: scene, slug: career-m9-ledger-row-shown, register: card, playable: false, predict: false, transfer: "9.4 defence; 9.5 quiz #1 and #2"}
    outside_beats: [LearningObjectives, "capstone brief (prose, not a quiz): the eight parts, should-haves, five-minute demo, defence questions, kit requirements, five rubric dimensions and the pass rule"]
    predict: {type: optional everyday question after beat 2, prompt: "What made his answer believable?", note: "answerable from the pictures"}
    interactions:
      - {type: SCENE, count: 2, placement: one per beat, purpose: "Show a picked line and the ledger row that answers it", budget: 2}
      - {type: LEARNING_OBJECTIVES, placement: module start, purpose: "Module outcome in three lines", budget: 1}
    density: {beats: 2, scenes: 2, mermaid: 0, playables: 0, predicts: 0, quiz_questions: 0, big_word_alerts: 0, assessment_interactions: 0}
    diagram_plan: "The two scenes are the diagrams; the module diagram is in 9.2 beats 1 and 4."

  - id: "09.02"
    title: From feedback to your next step
    module: 9
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "Strengths first, then fixes"
        claim: "A feedback card runs in order: strengths, what to do better with a fix, notes per focus area, things to watch, and three next steps."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "9.4 defence; gate 9.6 learning log prompt 1"
        mermaid: |
          flowchart TD
            A["Strengths to build on"] --> B["What to do better, each with a fix"]
            B --> C["Notes per focus area"]
            C --> D["Things to watch: flags with your own words"]
            D --> E["Three next steps"]
      - {n: 2, heading: "Tap a flag, see your words", claim: "Each flag points at your own words and has a fix: name your part, source the number or write an honest gap, or explain the term.", visual: phrase-fixer, slug: career-m9-tap-the-flag, register: card, playable: true, predict: true, transfer: "QC1; 9.4 defence 'one fix'"}
      - {n: 3, heading: "One change to the kit", claim: "Turn a flag into one change: fix the line and the ledger row it came from, not only the spoken answer.", visual: scene, slug: career-m9-one-change, register: card, playable: false, predict: false, transfer: "9.4 defence 'one fix'; quiz 9.5 #2"}
      - n: 4
        heading: "One thing to build or measure next"
        claim: "Choose the next step that closes a ledger gap or moves the project plan's number, and give it a date."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "gate 9.6 learning log prompt 3 (the next thing and by when)"
        mermaid: |
          flowchart TD
            A["Three next steps from the feedback"] --> B["Pick the one that closes a ledger gap"]
            B --> C["One action with a date: ask the shop owner for two weeks of timestamps"]
      - {n: 5, heading: "When the feedback is wrong", claim: "A model can be wrong; you decide, with reasons, and the mentor's review counts.", visual: scene, slug: career-m9-keep-the-term, register: card, playable: false, predict: false, transfer: "9.4 defence; gate 9.6 written task"}
    predict: {before_beat: 2, prompt: "The interviewer flags 'unsupported number' on one of your lines. What is the best first move?", options: ["Cut the number and move on, quietly", "Find its source, or say it is a gap"], correct: 1}
    quick_check: ["QC1: choose the best next step for a given flag."]
    interactions:
      - {type: PREDICT, placement: before beat 2, purpose: "This proves the learner picks a repair for an unsupported number before the flags are tapped", budget: 1}
      - {type: CANVAS, slug: career-m9-tap-the-flag, placement: beat 2, purpose: "This proves the learner can turn each flag into a fix that uses only facts already in the kit", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: choose the best next step for a flag", budget: 1}
    diagram_plan: {format: MermaidDiagram x2, claim: "The order of a feedback card; from three next steps to one dated action", placement: beats 1 and 4, canvas_decision: "phrase fixer at beat 2 carries the playable claim"}
    density: {beats: 5, scenes: 2, mermaid: 2, phrase_fixer: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

