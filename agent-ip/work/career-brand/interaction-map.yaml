      - {n: 2, heading: "A group that likes everything", claim: "A group that agrees in advance to like each other's posts brings the same few likes and no replies from founders.", visual: scene, slug: career-m7-like-group, register: card, playable: false, predict: false, transfer: "7.3 beat 5; quiz 7.6 #4"}
