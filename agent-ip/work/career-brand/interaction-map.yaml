# =====================================================================
# CHANGES TO THE MODULE BRIEFS (visual kind or wording; no claim changed)
# =====================================================================
changes_to_module_briefs:
  - {beat: "all 'Static picture' beats", brief: "Static picture", now: "mermaid (a fixed relationship or order) or a scene (something that moves between actors)", why: "A static picture is not an allowed visual kind; each beat's claim is unchanged."}
  - {beat: "all Read chapters", brief: "illustrated register allowed", now: "card register scene", why: "The illustrated register is custom React code and the pack allows at most two custom canvases in the course (prefer none)."}
  - {beat: "1.3 beat 3", brief: "Cards include 'AWS certificate'", now: "A case study card replaces it", why: "A certificate is checkable with its issuer but shows little; a two-bin sorter would teach a half truth. Certificates are covered in beat 4."}
  - {beat: "1.4 beat 5", brief: "beat-choice toggles on a bio", now: "phrase fixer on Areej's old opening", why: "The phrase fixer shows the same facts counter 0 to 3 and uses the course's own character."}
  - {beat: "2.2 beat 3", brief: "drag claims under three pillars; grey and cracked", now: "sorter: holds a pillar / needs a proof first", why: "The sorter has no pillar visual; the grey state is the second bucket."}
  - {beat: "2.3 beat 2, 3.2 beat 3, 5.5 beat 2, 6.3 beat 2", brief: "card filler on the sorter primitive", now: "slot card", why: "The slot card is the primitive built for filling labelled fields."}
  - {beat: "3.2 beat 2", brief: "10 to 11.2 users", now: "25 to 28 users", why: "10 to 11.2 is a fractional person; 25 to 28 is exactly 12 percent."}
  - {beat: "3.2 beat 3", brief: "seven fields including what else changed", now: "six slots; what else changed is beat 4", why: "A slot card holds six slots at most."}
  - {beat: "3.4 beat 2", brief: "slider or picture-slider: 1 in 20 twenty times slower", now: "reuse sysdesign-m17-same-average", why: "Same claim; no allowed primitive is a slider. The 50 ms example stays in the fold."}
  - {beat: "3.4 beat 6", brief: "watch-only dial, or a second playable if the budget allows", now: "reuse sysdesign-m17-slo-window (playable)", why: "Same claim and numbers."}
  - {beat: "3.5 beat 4", brief: "playable audit runs with noise", now: "watch-only scene; the chapter's playable moves to beat 1 (phrase fixer)", why: "No allowed primitive can show run-to-run noise; a custom canvas is not worth one beat."}
  - {beat: "4.2 beat 4", brief: "toggle evidence on and off", now: "slot card: fill six fields of the project page", why: "Same idea in reverse with a visible 'checkable parts' counter."}
  - {beat: "4.3 beat 4", brief: "five ideas through four gates (sorter or state machine)", now: "sorter with eight ideas and three outcomes", why: "A sorter holds 6 to 8 cards and up to 4 buckets; the five brief ideas are all included."}
  - {beat: "4.4 beat 2", brief: "slider: appetite 2 to 12 weeks, features fall out", now: "phrase fixer on an over-large plan sentence", why: "No slider primitive; a budget stack would label unbuilt features 'not seen'."}
  - {beat: "5.2 beat 3", brief: "state machine or block map: toggle obstacles", now: "budget stack: reorder the stranger's path (unit: taps)", why: "Unit is taps, not seconds, because the brief gives no number of seconds for a founder's patience."}
  - {beat: "5.3 beat 4", brief: "switch a control off and see the risk", now: "sorter: name the control that stops each risk", why: "Same pairs seen from the other side."}
  - {beat: "5.4 beat 2", brief: "sorter with a time bar", now: "budget stack (seconds of demo)", why: "The budget stack is built for frames against a running time."}
  - {beat: "6.2 beat 3", brief: "paste one of two sample files into a text box", now: "sorter: which layout choices paste cleanly", why: "No primitive pastes a file; the cautious habit is the same."}
  - {beat: "6.3 beat 2", brief: "seven parts", now: "five slots (owned, change, window, how, my share)", why: "Source stays in the ledger and the verb joins the thing owned."}
  - {beat: "6.4 beat 3", brief: "Waed's summary and Areej's old bullet", now: "Waed's AI summary and duty line; Areej's old bullet is beat 2", why: "Matches the canon exactly; the existing data invented a shop and numbers (see its spec)."}
  - {beat: "6.5 beat 4", brief: "pick one of two postings", now: "one posting (the backend role) in a budget stack", why: "A budget stack has one goal; the second posting is described in the beat text."}
  - {beat: "7.2 beat 2", brief: "fragments on a profile picture", now: "slot card with Amjad's headline", why: "Three slots plus refusal reasons; Amjad's worked headline is the canon's."}
  - {beat: "7.3 beat 4", brief: "sorter: five comments adds something / adds nothing", now: "phrase fixer on one draft comment", why: "7.4 already uses a sorter; varies the primitive in consecutive chapters."}
  - {beat: "7.4 beat 4", brief: "note tokens and a warning", now: "sorter with three outcomes (note, connect only, comment first)", why: "The budget (three notes) is in the prompt and the end note."}
  - {beat: "8.2 beat 3", brief: "sorter with parts dragged into order", now: "budget stack of post paragraphs", why: "The budget stack is built for paragraphs against a reader's room."}
  - {beat: "8.3 beat 4", brief: "block map with channels", now: "sorter: which version each channel gets (8 of the 10)", why: "No block-map variant in the allowed list."}
  - {beat: "8.4 beat 3", brief: "beat-choice toggles", now: "slot card: five specific parts, four generic refusals", why: "Same meter idea via 'checkable parts: N of 5'. The football notebook is left out because the canon allows one use, in About."}
  - {beat: "9.2 beat 2", brief: "feedback card with four fixes per flag", now: "phrase fixer with three flags in one answer", why: "One fix per flag, from Areej's canon."}
  - {beat: "career-m1-first-look, career-m3-claim-card, career-m6-empty-phrases", brief: "existing data", now: "revised data in their specs", why: "The existing data invent numbers and characters that contradict the canon (Bashar's Order API p95, Tawfiq's 50 to 15 minutes and 14 nights, a five-person online shop for Waed). Slugs do not change."}

# =====================================================================
# PLATFORM GAPS AND NOTES FOR THE CANVAS BUILDER
# =====================================================================
platform_gaps:
  - "No allowed primitive shows run-to-run noise or a slider; the two beats that wanted it are a reused sysdesign canvas (3.4 beat 2) and a watch-only scene (3.5 beat 4). No new custom canvas is requested."
  - "The scene renderer has the card register only. The illustrated register used by sysdesign-m1-launch-day-illustrated is custom code, so no Read chapter uses it. If the architect wants illustrated Read scenes, that would be up to two custom canvases and needs a decision."
  - "The phrase fixer's counter always reads 'Facts a reader can check: N'. It fits 1.4, 3.5, 6.4, 7.3 and 9.2 well and is looser in 4.4 (a plan sentence: one flow, a time box, a number). Acceptable; if the builder adds a counter label option, 4.4 would use 'Checkable parts'."
  - "The slot card holds six slots at most and slot labels of 11 characters; the 3.2 claim card could not hold the brief's seventh field."
  - "Every scene was checked with the scene geometry tests' own functions (no overlaps at any frame, chips placeable mid-flight, labels within the length limits); every sorter, phrase fixer, budget stack and slot card was checked with its model's check function."
conventions:
  slugs: "career-m<module>-<short-name>; specs in canvas-specs/<slug>.md with the data as one JSON block (title, purpose, limits, and either config or scene) that maps directly onto data.ts"
  register: "card register for every scene; no illustrated register"
  limits: "every spec carries its limits in the `limits` field of the JSON; the short 'Limits' heading in each spec only points to it"
  fictional: "every spec's limits name its fictional character; the chapter writer marks 'is a fictional fellow' once per chapter where the character appears"
  dates: "every platform or tool fact in a spec carries 'checked 2026-10'; the chapter says trust your own screen over any list"
  dashes: "no em or en dashes anywhere"
