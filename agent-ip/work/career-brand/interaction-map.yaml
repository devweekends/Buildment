      - {n: 2, heading: "Three people, one story", claim: "Three past colleagues each describe Ruqaya turning messy research into one clear page; the repeated words are her first pillar.", visual: scene, slug: career-m2-three-replies, register: card, playable: false, predict: false, transfer: "2.4 beat 3 (best-self asks); quiz 2.6 #4"}
