    title: Values, pillars and what makes you different
    module: 2
    type: Learn
    archetype: concept (Learn, beats)
    beats:
      - n: 1
        heading: "A pillar is a strength with proof"
        claim: "A pillar stands on two proofs and one number a stranger could check."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "quiz 2.6 #1; gate 2.7 'two proofs'"
        mermaid: |
          flowchart TD
            P["Pillar: I make slow things fast, and I measure it"] --> A["Proof 1: report query, p95 4.6 s to 0.41 s"]
            P --> B["Proof 2: events endpoint cache, p95 820 ms to 95 ms"]
            A --> N["A number a stranger can check"]
            B --> N
      - {n: 2, heading: "Two or three pillars, not ten", claim: "Fewer pillars are easier for a reader to remember and for you to prove.", visual: scene, slug: career-m2-ten-or-three, register: card, playable: false, predict: false, transfer: "gate 2.7 (one pillar with two proofs)"}
      - {n: 3, heading: "Claims without proof turn grey", claim: "A claim can hold a pillar only with a proof attached; 'great communicator' cannot until an example is.", visual: sorter, slug: career-m2-claims-under-pillars, register: card, playable: true, predict: true, transfer: "quiz 2.6 #1; QC1"}
      - n: 4
        heading: "Values show in what you did"
        claim: "A value is believable when an action and a proof stand behind it."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "2.7 learning log prompt 1; build 2.5 part 1"
        mermaid: |
          flowchart TD
            V1["Honest numbers"] --> A1["Wrote the 20 May release into her claim card"]
            V2["Finishing what she starts"] --> A2["Revoked the leaked key, then turned on push protection"]
            V3["Teaching what she learns"] --> A3["Trained two new club organisers on the form"]
      - n: 5
        heading: "What makes you different, in one line"
        claim: "The line assembles from a role, a habit and a proof style, and a reader can test it by opening the work."
        visual: mermaid
        slug: null
        playable: false
        predict: false
        transfer: "build 2.5 part 3; module 7 headline (7.2)"
        mermaid: |
          flowchart TD
            R["Role: full-stack developer"] --> L["A full-stack developer who measures before and after, and writes it down."]
            H["Habit: measures before and after"] --> L
            S["Proof style: writes it down"] --> L
    predict: {before_beat: 3, prompt: "Which of Areej's claims could hold up a pillar on its own?", options: ["A great communicator and leader", "A number with a place to check it"], correct: 1}
    quick_check: ["QC1: choose the pillar statement that is backed by a proof and a number, and say what the other one needs."]
    interactions:
      - {type: PREDICT, placement: before beat 3, purpose: "This proves the learner can tell which claim stands on proof before sorting", budget: 1}
      - {type: CANVAS, slug: career-m2-claims-under-pillars, placement: beat 3, purpose: "This proves the learner can separate claims that hold a pillar from words that need proof", budget: 1}
      - {type: QUIZ, placement: end, purpose: "QC1: pick the backed pillar statement", budget: 1}
    diagram_plan: {format: MermaidDiagram x3, claim: "Pillar to proof to number; value to action to proof; role plus habit plus proof style to one line", placement: beats 1, 4, 5, canvas_decision: "sorter at beat 3 carries the playable claim"}
    density: {beats: 5, scenes: 1, mermaid: 3, sorter: 1, playables: 1, predicts: 1, quiz_questions: 1, big_word_alerts: 0, assessment_interactions: 2}

