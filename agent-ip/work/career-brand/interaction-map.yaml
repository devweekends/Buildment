      - {n: 2, heading: "A website nobody believes", claim: "Diala's template site has stock photos, no dates and no numbers, and says 'I am a passionate DevOps engineer who loves solving problems'.", visual: scene, slug: career-m8-template-site, register: card, playable: false, predict: false, transfer: "8.4 beat 2 and quiz 8.7 #4"}
    outside_beats: [LearningObjectives]
