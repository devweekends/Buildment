# Model routing for this run. Two model families are available: the drafting
# family (main session and its subagents, in a larger and a smaller size) and
# a second, independent family run headless through a local command-line agent.
# The second family runs the blind answer-key check and at least one critic, so
# those checks do not share the drafters' blind spots. A human key check and
# human review are still required before publishing.
orchestrator: drafting model (main session); does not write course content
research: smaller drafting-family model, two separate agents with web search (topics A to F, topics G to K)
curriculum_architect: drafting model, separate agent (roadmap, then blueprint and module briefs)
prerequisites_timeline: folded into the curriculum architect's roadmap (minutes per chapter, prerequisites); checked by the orchestrator against the brief
project_designer: not applicable as a software project; the kit specification is part of the blueprint
interaction_designer: smaller drafting-family model, separate agent (interaction map and canvas specs)
assessment_designer: smaller drafting-family model, separate agent (assessment plan, AI drill rubrics, gate rubrics)
interactive_canvas_builder: drafting model, separate agent for new reusable primitives; data-only canvases written by chapter writers on existing renderers
chapter_writers: smaller drafting-family model, parallel agents split by module
critic_a: second model family where available (pedagogy, assessment, canvas); otherwise a smaller drafting-family agent with no writer rationale, recorded as a risk
critic_b: smaller drafting-family model, separate agent, no writer rationale (slop, readability, continuity, accuracy against the dossier, tone)
blind_key_check: second model family, keyless batches only
technical_validator: scripts and tests (validate:source, content:audit, audit-course.mjs, canvas tests, canvas text QA, import, click-through)
same_family:
  drafting_and_critic_b: true (recorded as risk R1; critic A or the key check runs on the second family)
  drafting_and_blind_keys: false
