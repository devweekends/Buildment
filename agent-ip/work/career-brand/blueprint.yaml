artifact: blueprint
course: career-brand
version: 1
status: draft
owner: curriculum-architect
roadmap_version: 1
roadmap_confirmed: false
roadmap_note: >-
  G2B instructor sign-off is pending. On the sponsor's instruction the blueprint and chapters are drafted
  before sign-off and follow every roadmap recommendation (roadmap-confirmation.md). Nothing here changes
  the roadmap; every module, chapter, minute count and outcome traces to curriculum-roadmap.md and
  courses/career-brand/course.yaml.
canon: module-briefs/00-areej-and-cast.md
module_briefs: module-briefs/01-what-a-reader-sees-first.md to module-briefs/09-capstone-your-kit-defended.md

outcomes:
  - id: O1
    statement: Say what a founder or hiring manager checks first, and arrange their own material so shipped, measured work is seen first.
    level: application
    evidence: [quiz 1.5, ten-second test at gate 1.6 (baseline), ten-second test at gate 7.7, kit check 9.3]
    modules: [1, 7, 9]
  - id: O2
    statement: Write a career arc document that feeds every later piece of the kit.
    level: creation
    evidence: [build 2.5, quiz 2.6, gate 2.7, used as input in 6.6 and 7.5]
    modules: [2]
  - id: O3
    statement: Turn work into claim cards, read numbers they did not set up, plan a measurement, and say how each number was measured.
    level: analysis
    evidence: [build 3.6 claim ledger, quiz 3.7, gate 3.8 drill or written, ledger check 9.3]
    modules: [3, 9]
  - id: O4
    statement: Choose and plan one strong project with an idea filter that favours real use or written depth over two-sided apps.
    level: evaluation
    evidence: [build 4.5 project plan, quiz 4.6, gate 4.7]
    modules: [4]
  - id: O5
    statement: Make work easy to see with a deployable unit, instant access, a short demo of the core and a case study as the base layer.
    level: creation
    evidence: [build 5.6 case study, showcase plan and stranger test, quiz 5.7, gate 5.8]
    modules: [5]
  - id: O6
    statement: Write a structured, plain resume with owned bullets, honest results and links, tailored to one real posting.
    level: creation
    evidence: [build 6.6, quiz 6.7, gate 6.8 drill flags compared with gate 1.6]
    modules: [6]
  - id: O7
    statement: Build a LinkedIn profile and use it within the rules for posts, useful comments, outreach and a measured posting rhythm.
    level: application
    evidence: [build 7.5, quiz 7.6, gate 7.7]
    modules: [7]
  - id: O8
    statement: Write a blog post about their own work, plan publishing it across about ten channels, and plan a clean personal website.
    level: creation
    evidence: [build 8.5, build 8.6, quiz 8.7, gate 8.8]
    modules: [8]
  - id: O9
    statement: Defend the kit by answering how each number was measured and what their part was, and turn feedback into the next thing to build or measure.
    level: evaluation
    evidence: [defence 9.4, final gate 9.6 compared with 1.6, drills at 1.6, 3.8, 5.8 and 6.8]
    modules: [1, 3, 5, 6, 9]

constructor_profile:
  profile: debug-first
  why: >-
    Fellows arrive with a resume and profile that are not working. Module 1 diagnoses the current kit the way a
    reader sees it (ten-second test, baseline drill); the course then rebuilds it from evidence. No prose artifact
    is written before the claim ledger it draws from exists, which guards against fixing the surface without
    understanding. Each set-the-scene chapter is a short case of a fictional fellow's kit failing a reader.

module_spine:
  - {n: 1, key: module-01-what-a-reader-sees-first, purpose: diagnosis and baseline, chapters: 6, minutes_ai: 135, minutes_written: 130, gate_evidence: ten-second test and baseline drill or written baseline}
  - {n: 2, key: module-02-your-career-arc-document, purpose: the private source document, chapters: 7, minutes_ai: 190, minutes_written: 190, gate_evidence: one pillar with two proofs and a privacy list}
  - {n: 3, key: module-03-honest-numbers-and-proof-of-work, purpose: claim cards and the claim ledger, chapters: 8, minutes_ai: 250, minutes_written: 245, gate_evidence: ledger and the drill or written defence of two rows}
  - {n: 4, key: module-04-a-strong-project-in-the-ai-era, purpose: one believable project plan, chapters: 7, minutes_ai: 185, minutes_written: 185, gate_evidence: the idea through the filter and the first real user named}
  - {n: 5, key: module-05-show-your-work-so-people-look, purpose: reachable, safe showcase and case study, chapters: 8, minutes_ai: 240, minutes_written: 235, gate_evidence: stranger test and the drill or written answers}
  - {n: 6, key: module-06-a-resume-that-reads-as-you, purpose: the resume from the ledger, chapters: 8, minutes_ai: 240, minutes_written: 235, gate_evidence: resume, tailored copy, drill flags against the baseline}
  - {n: 7, key: module-07-linkedin, purpose: profile and honest outreach, chapters: 7, minutes_ai: 185, minutes_written: 185, gate_evidence: second ten-second test against the baseline}
  - {n: 8, key: module-08-writing-and-distribution, purpose: post, channels and website plan, chapters: 8, minutes_ai: 205, minutes_written: 205, gate_evidence: say-it-back result and a published link if any}
  - {n: 9, key: module-09-capstone-your-kit-defended, purpose: assemble, check, defend, chapters: 6, minutes_ai: 155, minutes_written: 155, gate_evidence: comparison with the 1.6 baseline and mentor follow-ups}

