time_budget:
  budget_from_brief: about 5 to 6 hours a week for about 5 weeks (25 to 30 hours)
  core_ai_path_minutes: 1785
  core_written_path_minutes: 1765
  estimated_hours_in_manifest: 30
  drill_minutes: {with_key: 20, written_option: 15, gates: ["01.06", "03.08", "05.08", "06.08"]}
  capstone_defence_minutes: 40
  stretch: >-
    Not timed in the core: deploying the planned project with a demo account, publishing the post on more channels,
    a second case study, a live website, an open source first contribution.
  contingency: >-
    None inside the 30 hours; week 2 is the heaviest at 6.6 hours. Roadmap open decision 22 tells fellows to plan
    30 hours over 5 to 6 weeks.
  weeks:
    - {week: 1, chapters: "01.01 to 02.07", minutes: 325}
    - {week: 2, chapters: "03.01 to 04.05", minutes: 395}
    - {week: 3, chapters: "04.06 to 06.03", minutes: 340}
    - {week: 4, chapters: "06.04 to 07.07", minutes: 365}
    - {week: 5, chapters: "08.01 to 09.06", minutes: 360}

interaction_grammar:
  read:
    beats: 1 to 2
    blocks: [one scene visual (illustrated register allowed), LearningObjectives in every set-the-scene (module start)]
    extras: 01.01 also carries ProjectPreview (the finished kit) and Roadmap (the nine modules), and names the course's wellbeing contact person (instructors supply the name)
    questions: at most one predict in everyday words ("what do you notice?"); never a mechanism question
  learn:
    format: beats
    beats: 4 to 8, one visual each, heading of 8 words or fewer, at most 70 visible words, optional GoDeeper fold
    words: 300 to 700 visible, at least 900 with folds
    teaching_contract: one predict right before the key beat; one or two quiz questions after the last beat
    playable: at least one playable beat (the roadmap's "Playable beat" column)
    budget: at most 40 JSX tags, 3 assessment interactions, no BigWordAlert (GlossaryTerm or beat text)
    suggested_visual_kinds:
      - playable canvas on existing primitives where they fit (sorter, block-map, beat-choice, picture-slider, slider renderer, factor renderer)
      - watch-only scene (scene renderer, card register for concepts)
      - static MermaidDiagram for fixed relationships (flowcharts, a claim lifecycle)
      - state machine renderer for lifecycles (a claim from work to defence)
    note: the interaction designer turns each suggested visual into a canvas spec or an existing renderer; no slug is invented in a chapter
  build:
    step_type: Build
    prose: at least 1,200 words
    blocks: [Steps, a template the learner fills (a Markdown table or document outline in a code fence or table), one worked example from Areej, Callout (at most two), at most one diagram]
    budget: at most 6 top-level components, 25 JSX tags, 3 assessment interactions
    required_parts: [the artifact and its parts, the template, how AI may be used on own material, the Areej path, acceptance criteria, one progressive hint, an "if you are stuck" check]
    assessment: none in 02.05 to 08.06 (the artifact is checked at the gate); 09.03 and 09.04 each end with one submission openquestion (the kit index; the defence and its fix); never an openquestion mid-build
  quiz:
    content: activities only, five MCQ quiz fences, one reason per option, titled by topic without "Quiz:"
    rules: test application, comparable option lengths, varied correct positions, one "check the AI's answer" item per quiz
  gate:
    blocks: [Checklist, LearningLog (four prompts), ChapterRecap, one openquestion (the written task), aiinterview fence where the roadmap places a drill]
    openquestion_rule: >-
      One openquestion per gate. Where the gate has a drill, the written option is a clearly marked optional section
      of the same openquestion ("If you did not finish the AI drill, also answer..."), so the chapter keeps one
      open question and the written path completes the gate.
    prose: at least 700 words
    drills: {gates: ["01.06", "03.08", "05.08", "06.08"], settings: see the roadmap AI drills table, required: false}
  capstone_build_09_04:
    aiinterview: context resume-and-project, maxTurns 15, whyDepth 4, required false
    alternative: recorded five-minute walkthrough (audio only accepted) or a written defence plus a short live call, through an openquestion with submissionMode url or text and minWords 0 for a link-only answer
  per_module:
    must_read: one official page per module where it helps (examples - Google SRE SLO chapter in module 3, OWASP Secrets Management cheat sheet in module 5, LinkedIn Professional Community Policies in module 7, Google canonical guidance in module 8)
    real_world_event: only where the dossier gives a real dated event (for example LinkedIn removing the creator mode toggle in March 2024 [P14] in module 7, the METR study of July 2025 [S26] in module 4); never invented; omit in modules without one
    diagrams: at least one per module
  dates: every platform or tool fact carries "checked 2026-10" and tells the learner to trust the screen over any list
  cross_links:
    course_7: "Professional & Business Communication: 07.04 (etiquette, first LinkedIn basics)"
    course_13: "Learn and Build with AI: 04.04 (six-month weekly learning plan), 08.02 (a week of commits into an article, saying when AI helped)"
    course_14: "The Founder Interview: 03.02 and 03.08 (defending numbers aloud), module 5 (a demo they can open), 09.02 (reading feedback critically)"

capstone:
  ships: [career arc document, proof-of-work inventory and claim ledger, project plan, showcase plan and one case study, resume and one tailored version, LinkedIn profile, blog post and channel plan, website plan]
  should_have: [project started and deployed with a demo account, post published on at least one channel, website live]
  demo: >-
    A mentor opens the resume, profile, case study, post and project plan, picks any line, and the learner shows
    the ledger row and its source and says what part was theirs.
  defence: 09.04, full AI interview or recorded five-minute walkthrough, then one fix the feedback named
  kit_requirements:
    - every number in the resume and profile maps to a ledger row or an honest "not measured" line
    - no private data, client names or secrets in anything public
    - every public link opens on a phone without setup
    - anything shown is safe for a stranger
    - no step needs a paid plan, a paid domain or LinkedIn Premium
  rubric_dimensions: [evidence, ownership, clarity, access and safety, defence]
  pass_rule: >-
    All eight parts exist; every resume and profile number maps to a ledger row or an honest gap; the stranger test
    passes on a phone; the mentor's one to three follow-up questions are answered. Drill flags are feedback, never a
    pass criterion (roadmap open decision 5).
  review_time: under 30 minutes per kit

risks:
  - risk: Fellows with no shareable work stall at modules 2 and 3.
    mitigation: Areej's material at every practice chapter; the ledger needs only one own row (open decision 1).
  - risk: Fellows invent or round up numbers to fill the ledger.
    mitigation: the honest "not measured" line is taught as complete; embellishment and omission are named as deception (3.2); every gate rubric checks sources.
  - risk: Employer data appears in public.
    mitigation: the permission rule in 3.3, redacted defaults, the privacy check in 9.3.
  - risk: AI keys fail or are refused from Gaza.
    mitigation: written option at every drill; no VPN advice; the fallback ladder from research-platforms.md topic K.
  - risk: Platform facts go stale (LinkedIn limits, free tiers, consent rules).
    mitigation: every fact dated "checked 2026-10", "trust your screen", re-check owner (open decision 17).
  - risk: Overlap with course 14 feels repetitive for fellows who took it first.
    mitigation: 3.2 and module 5 cross-link and keep their recap beats short; defence aloud stays in course 14.
  - risk: Week 2 load (6.6 hours) and second-language reading speed.
    mitigation: plan 30 hours over 5 to 6 weeks; Build chapters give a minimum viable artifact first.
  - risk: Learn chapters drift into text walls on a topic that is mostly writing.
    mitigation: every beat opens with a visual of the learner's artifact (a card, a profile, a resume), and the module briefs name each beat's picture.
  - risk: Same-family critics miss errors.
    mitigation: routing.yaml puts the blind key check and critic A on the second model family.
