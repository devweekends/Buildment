rubrics:
  - id: R1.8
    chapter: "1.8"
    instrument: OPEN_QUESTION
    outcomes: [O1]
    submission: "text, voice note or labelled-diagram link; minWords 0 so a link-only answer reaches the mentor"
    anchor: "The learner's own numbers. Nothing in the answer can be written without running the commands."
    dimensions:
      - dimension: numbers
        weight: 0.35
        descriptors:
          4: "All five numbers (address, mask, gateway, DNS server, the address a website sees) are written, match the learner's own my-numbers.txt or Wi-Fi screen, and the mask is also given as a prefix length."
          3: "All five numbers are written and match; the prefix length is missing or one number differs from my-numbers.txt."
          2: "Three or four of the five numbers are written."
          1: "Two or fewer numbers, or numbers copied from the course examples."
      - dimension: map
        weight: 0.25
        descriptors:
          4: "Each device (at least laptop, phone, router) is shown with its own address, and the router with both an inside and an outside address; the provider is named."
          3: "Devices and router are shown; the outside address or the provider is missing."
          2: "Devices are listed with no relation to the router."
          1: "No map, or prose only."
      - dimension: "two views"
        weight: 0.2
        descriptors:
          4: "Names the address the computer uses and the address a website sees, says they sit on different sides of the router, or states which branch applies (IPv6 result, a 100. address)."
          3: "Names both addresses; the reason is missing or wrong."
          2: "Names only one of the two."
          1: "Confuses the two or omits them."
      - dimension: "open questions"
        weight: 0.2
        descriptors:
          4: "Three questions, each about the learner's own numbers (for example why the router's outside address starts with 100.) and each answerable by a later module."
          3: "Three questions, one of them generic."
          2: "One or two questions."
          1: "None, or 'I have no questions'."
  - id: R2.7
    chapter: "2.7"
    instrument: OPEN_QUESTION
    outcomes: [O2]
    submission: "text with speech input, voice note or labelled-diagram link; minWords 0"
    anchor: "The learner's own phone address and one date from 2.1."
    dimensions:
      - dimension: shortage
        weight: 0.25
        descriptors:
          4: "Says the free pool ran out, names one registry date, and says addresses are now traded and shared, not that the internet stopped."
          3: "Says there are not enough addresses and that the free pool is empty, with no date."
          2: "Says 'the internet ran out of addresses' or gives a vague shortage."
          1: "Missing or wrong."
      - dimension: "private ranges"
        weight: 0.3
        descriptors:
          4: "Names 192.168.0.0/16 and 10.0.0.0/8 as ranges reused inside many networks and never routed on the public internet, and says why reuse is safe."
          3: "Names the ranges and the reuse, but not that they are never routed publicly."
          2: "Names one range only, or says private means secure."
          1: "No ranges, or treats them as secret."
      - dimension: "the NAT question"
        weight: 0.3
        descriptors:
          4: "States the question: when many devices share one outside address, how does a reply find the right device? Links it to a router rewriting the source address."
          3: "Says something must translate between private and public addresses, without the reply problem."
          2: "Says 'NAT hides addresses' with no question."
          1: Missing.
      - dimension: "clarity for a friend"
        weight: 0.15
        descriptors:
          4: "No unexplained term, one worked number (their own phone's address), about 250 words or three minutes of voice."
          3: "One unexplained term."
          2: "Jargon throughout."
          1: "Copied definitions."
  - id: R3.12
    chapter: "3.12"
    instrument: OPEN_QUESTION
    outcomes: [O3]
    submission: "text with speech input, voice note or labelled-diagram link; minWords 0"
    anchor: "The learner's own 3.10 plan, with addresses."
    dimensions:
      - dimension: size
        weight: 0.3
        descriptors:
          4: "States that 40 devices need a /26 (62 usable) and why a /27 (30 usable) is too small."
          3: "States the /26 without the reason."
          2: "Gives a size one step off."
          1: "No size."
      - dimension: placement
        weight: 0.3
        descriptors:
          4: "Places the new block at a named, aligned free /26 in the learner's own plan and shows it overlaps nothing."
          3: "Names the right block; alignment or the overlap check is not shown."
          2: "Names a block that overlaps or is misaligned."
          1: "No placement."
      - dimension: "cost of the change"
        weight: 0.2
        descriptors:
          4: "Says what changes (one new row, nothing renumbered) and why."
          3: "Says nothing changes, without why."
          2: "Renumbers existing networks without need."
          1: Absent.
      - dimension: "no space left"
        weight: 0.2
        descriptors:
          4: "Names which block would shrink or which growth margin would be given up, with the consequence."
          3: "Names a block without the consequence."
          2: "Says 'get more space'."
          1: Absent.
  - id: R4.10
    chapter: "4.10"
    instrument: OPEN_QUESTION
    outcomes: [O4]
    submission: "text, voice note or labelled-diagram link; minWords 0; public hops may be scrubbed"
    anchor: "The learner's own trace from 4.1 and the challenge 2 capture."
    dimensions:
      - dimension: "hop classification"
        weight: 0.3
        descriptors:
          4: "At least five hops are classified private, shared or public with the address range as the reason, and at least one is tied to the learner's own network."
          3: "Three or four hops classified with a reason."
          2: "Hops classified with no reason."
          1: "Fewer than three hops."
      - dimension: "how traceroute works"
        weight: 0.25
        descriptors:
          4: "Explains TTL 1, 2, 3 and ICMP Time Exceeded, and says each line is the device that stopped the probe."
          3: "Mentions TTL but not who replies."
          2: "Says traceroute 'pings each router'."
          1: Absent.
      - dimension: stars
        weight: 0.2
        descriptors:
          4: "Explains * * * as no answer or a filter, not a broken path, and cites a later hop that did answer."
          3: "Explains * * * as silence without the later-hop evidence."
          2: "Says the path is broken."
          1: Absent.
      - dimension: "honest open questions"
        weight: 0.25
        descriptors:
          4: "Each hop the learner cannot explain has a question and a concrete check (a command or a place to look)."
          3: "Questions without checks."
          2: "'I do not know' with no question."
          1: None.
  - id: R5.8
    chapter: "5.8"
    instrument: OPEN_QUESTION
    outcomes: [O4]
    submission: "text, voice note or labelled-diagram link; minWords 0"
    anchor: "One line of the learner's own challenge 3 capture."
    dimensions:
      - dimension: "the five numbers"
        weight: 0.35
        descriptors:
          4: "Names protocol, both addresses and both ports with the values from their own line and says what each is for."
          3: "All five are named; one role is missing."
          2: "Three or four are named."
          1: "Fewer than three."
      - dimension: "source port"
        weight: 0.2
        descriptors:
          4: "Says the client's system chooses the source port from the ephemeral range and why it differs from the server's port."
          3: "Says it differs from the server's port, without why."
          2: "Says it is random, with no link to the server."
          1: "Wrong or absent."
      - dimension: "flags and numbers"
        weight: 0.25
        descriptors:
          4: "Ties the flags and sequence numbers on that line to its step of the handshake and says what the number acknowledges."
          3: "Names the handshake step, not the numbers."
          2: "Names the flag only."
          1: Absent.
      - dimension: "listening address"
        weight: 0.2
        descriptors:
          4: "Links the line to the server's listening address and says what would happen on 127.0.0.1."
          3: "Mentions the listening address."
          2: "Mentions only the port."
          1: Absent.
  - id: R6.11
    chapter: "6.11"
    instrument: OPEN_QUESTION
    outcomes: [O5]
    submission: "text, voice note or labelled-diagram link; minWords 0"
    anchor: "One inside line, one outside line and one conntrack line from the learner's own challenge 4 results."
    dimensions:
      - dimension: "the rewrite"
        weight: 0.25
        descriptors:
          4: "States that the source address is always rewritten to the router's outside address and quotes one inside and one outside line that show it."
          3: "States the rewrite and quotes one line."
          2: "States the rewrite with no evidence."
          1: "Wrong direction or absent."
      - dimension: "the port rule"
        weight: 0.2
        descriptors:
          4: "Says the port is kept unless two conversations clash, and quotes the conntrack line with the new port."
          3: "States the rule, without a line."
          2: "Says ports are always, or never, changed."
          1: Absent.
      - dimension: replies
        weight: 0.2
        descriptors:
          4: "Explains that the table row sends the reply to the right device by its address and port."
          3: "Mentions the table without how."
          2: "Says 'the router remembers'."
          1: Absent.
      - dimension: inbound
        weight: 0.2
        descriptors:
          4: "Says why an outside host cannot start a connection (no row and no route to a private range) and how a forward rule opens one port."
          3: "Gives one of the two."
          2: "Says NAT is a firewall."
          1: Absent.
      - dimension: "provider NAT"
        weight: 0.15
        descriptors:
          4: "One sentence on provider NAT with 100.64.0.0/10 as a sign, not proof."
          3: "Mentions provider NAT."
          2: "Confuses it with the home router's NAT."
          1: Absent.
  - id: R7.8
    chapter: "7.8"
    instrument: OPEN_QUESTION
    outcomes: [O6]
    submission: "text, voice note or labelled-diagram link; minWords 0"
    anchor: "Commands run on the learner's own computer and network, labelled On your computer."
    dimensions:
      - dimension: layers
        weight: 0.25
        descriptors:
          4: "Six layers in order: link, address, gateway, route, DNS, HTTP."
          3: "Five layers in order."
          2: "Four layers, or the order is wrong."
          1: "Fewer than four."
      - dimension: "a command per layer"
        weight: 0.3
        descriptors:
          4: "Each layer has one command for the learner's own operating system, exactly as typed, and at least one was run on the real network."
          3: "Commands for all but one layer."
          2: "Commands are vague ('check the router')."
          1: "No commands."
      - dimension: "good and bad outputs"
        weight: 0.25
        descriptors:
          4: "Each layer has a good output, a bad output (pasted or exactly described) and what the bad output means."
          3: "Both outputs for every layer; meanings missing for some."
          2: "Good outputs only."
          1: None.
      - dimension: "usable by someone else"
        weight: 0.2
        descriptors:
          4: "A family member could follow it: plain words, the order stated, 'stop at the first failing layer'."
          3: "Usable with one unexplained step."
          2: "Assumes the module's vocabulary."
          1: "A list of vague actions."
  - id: R8.7
    chapter: "8.7"
    instrument: OPEN_QUESTION
    outcomes: [O1, O7]
    submission: "submissionMode video_demo; link-only answers need minWords 0; the three probes arrive as mentor feedback and the learner answers by resubmitting"
    anchor: "The learner's own captures, the seed in their write-up, and the course question."
    dimensions:
      - dimension: "demo follows the template"
        weight: 0.35
        descriptors:
          4: "Five minutes or less; shows (does not read) the address plan, a lease, a curl with captures on both sides and the conntrack line, and one injected fault; every command is labelled On your computer or In the lab."
          3: "Within five minutes and complete; one part is read aloud instead of shown."
          2: "Over time, or one required part is missing."
          1: "Reads a script, or shows commands not run by the learner."
      - dimension: "probe answers"
        weight: 0.4
        descriptors:
          4: "Each of the three probes is answered by pointing at the learner's own capture or conntrack line, without notes."
          3: "Two probes are answered from the learner's evidence; one is answered in general terms."
          2: "Answers restate the course and do not match the learner's own capture."
          1: "A probe is unanswered or contradicts the capture."
      - dimension: "the course question"
        weight: 0.25
        descriptors:
          4: "Answers 'how do home devices reach the internet without public addresses' in about 20 seconds using the learner's own numbers."
          3: "Correct answer with course numbers rather than their own."
          2: "Partly correct (for example NAT is a firewall)."
          1: "Missing or wrong."
  - id: R9.5
    chapter: "9.5"
    instrument: OPEN_QUESTION
    outcomes: [O2]
    submission: "text, about 80 to 150 words with an honest minWords; link-only answers need minWords 0"
    anchor: "Only facts from the course and the dossier: the four exhaustion dates, 100.64.0.0/10, the Google share on 28 March 2026, the dated cellular CGN study, and the learner's own phone."
    dimensions:
      - dimension: "a reason IPv6 helps"
        weight: 0.35
        descriptors:
          4: "A reason (no shortage, every device its own address, no NAT needed) tied to a number or an observation from the course or the learner's phone."
          3: "A correct reason with no number."
          2: "A slogan ('IPv6 is better or faster')."
          1: Wrong.
      - dimension: "a reason IPv4 and NAT will last"
        weight: 0.35
        descriptors:
          4: "A reason tied to a number: about half of Google's users still reach it over IPv4 (IPv6 was 50.10 percent on 28 March 2026), or provider NAT on 100.64.0.0/10 (CGN in over 92 percent of cellular networks in a dated study)."
          3: "A correct reason with no number."
          2: "A slogan ('legacy', 'lazy')."
          1: Wrong.
      - dimension: "honest with sources"
        weight: 0.15
        descriptors:
          4: "States the date or scope of each figure and adds no fact beyond the course and the dossier."
          3: "A figure without its date."
          2: "An invented figure."
          1: "Contradicts the course."
      - dimension: "both are true at once"
        weight: 0.15
        descriptors:
          4: "Both reasons and a one-sentence conclusion that both statements are true together."
          3: "Both reasons, no conclusion."
          2: "Only one reason."
          1: Neither.
capstone_rubric:
  id: C8
  artifact: "the challenge 6 repository, fault write-up and committed captures (8.2 to 8.5)"
  outcomes: [O6, O7]
  reviewer: "mentor, under 30 minutes (about 3 on the plan, 6 on the network, 5 on captures, 6 on diagnosis, 8 on explanation)"
  reproducibility: "The break.sh seed is in the write-up, so the mentor can reproduce the three injected faults; the mentor runs the tests from a clean lab."
  dimensions:
    - dimension: "address plan"
      weight: 0.15
      descriptors:
        4: "Every link has its own subnet with no overlap, each size is justified, pools sit inside their subnets and leave room for static addresses, public-looking addresses come only from the documentation ranges, and the plan matches ip addr on the running network."
        3: "No overlap and sizes mostly justified; one pool or size is unexplained; matches ip addr."
        2: "An unexplained size or a pool outside its subnet."
        1: "Overlapping ranges, or a plan that differs from the running network."
    - dimension: "working network"
      weight: 0.3
      descriptors:
        4: "All four test sets pass from a clean lab (build, test, teardown) and each part's must-fail test fails for the right reason."
        3: "All tests pass from a clean lab; one must-fail test fails for a different reason."
        2: "Tests pass only after a manual fix."
        1: "Tests do not run, or a must-fail test fails for a different reason in more than one part."
    - dimension: "captures as evidence"
      weight: 0.15
      descriptors:
        4: "Captures from both sides of the router are committed, labelled with where they ran, with a one-line reading each and the conntrack -L line."
        3: "Both sides committed and labelled; some readings missing."
        2: "One side only, or unlabelled."
        1: "Output pasted but not read, or absent."
    - dimension: diagnosis
      weight: 0.2
      descriptors:
        4: "The write-up gives the seed and, for each fault, the symptom, the finder command with its output, the fix and a passing re-run, in layer order."
        3: "All three faults with symptom, finder and fix; the re-run or the order is missing for one."
        2: "A fix with no evidence of how it was found, or a symptom fixed instead of the cause."
        1: "Guesses, or fixes combined so the cause cannot be told."
    - dimension: explanation
      weight: 0.2
      descriptors:
        4: "In the demo and the probes the learner explains why the server sees one address and when the port changes, pointing at their own capture without notes."
        3: "Correct, points at their own capture, uses a few notes."
        2: "Restates the lecture without pointing at their capture."
        1: "Answers that contradict their own capture."
feedback_plan:
  principles: "Immediate for auto-graded items, specific and delayed for open work, faded over the course."
  by_instrument:
    - instrument: PREDICT
      when: "immediate, in the next beat"
      form: "the picture is the answer; a short sentence says whether the prediction held and why, in plain words"
      fades: "no score is shown; a learner who guessed wrong is pointed to the beat that showed the premise"
    - instrument: "QUIZ and CHECK"
      when: immediate
      form: "one reason per option (the importer's explanations list) saying why the right option is right and why the tempting one is wrong"
      fades: "Check chapters show only the reason for the chosen option after the first attempt"
    - instrument: CODE
      when: immediate
      form: "tests name the failing case; the failure-mode test has its own message; hint ladder (nudge, concept, command); reference helper after three failed attempts so later exercises never depend on a failed one"
      fades: "hints are shorter from 3.7 on"
    - instrument: CHALLENGE
      when: immediate
      form: "the test script names the failing gap and the part; a stuck diagnostic and a restore point (toolkit/restore.sh N.P) are in every README"
      fades: "guided (challenges 0, 1), gapped (2 to 5), open with hints (6)"
    - instrument: LAB
      when: immediate
      form: "each check passes or fails with its name; the lab never gives the answer"
      fades: "hint ladder only"
    - instrument: OPEN_QUESTION
      when: "within three days (decision 9)"
      form: "the mentor scores with the rubric and writes one specific next step; every answer has a follow-up step in which the learner answers the mentor's questions"
      fades: "mentor comments move from prompts to questions"
    - instrument: CAPSTONE
      when: "within three days, under 30 minutes of mentor time"
      form: "rubric C8, three probes, a short written summary"
      fades: "n/a"
  spacing: "Check chapters 2.6 to 7.7 each mix in two questions from the previous module; 8.6 combines two or more modules in each question; module 9's Check mixes IPv4 and NAT cases."
integrity:
  - instrument: PREDICT
    risk: "A guess costs nothing and a learner can click through."
    check: "Not scored, so there is nothing to game; the next beat reveals the answer and the chapter quiz is the transfer check. Time on the canvas is never completion."
    residual: low
  - instrument: "QUIZ (in a chapter)"
    risk: "Guessing among three or four options; answering by option length."
    check: "Scenario stems; one reason per option; option lengths comparable and the correct position varied; across each quiz set the correct option is not the longest in half or more of the questions; answer keys re-answered blind."
    residual: "medium; one or two questions per chapter, so a lucky guess matters little, and Check sets re-test the idea later"
  - instrument: CHECK
    risk: "Copying answers from a peer or searching for them."
    check: "Stems use real outputs from the reference captures (numbers differ from any public text); two questions come from the previous module, so rote answers from the current module do not carry; five questions at most."
    residual: medium
  - instrument: CODE
    risk: "Copying a known solution or having a model write it."
    check: "Hidden tests include the edge cases and the failure-mode test; each exercise is paired with unassisted hand questions on the same skill in the next Check chapter (2.6, 3.11, 4.9, 6.10), so a learner who copied code still has to show the hand skill."
    residual: "medium; accepted because code is one of several instruments for each outcome"
  - instrument: CHALLENGE
    risk: "Copying another learner's results.md or running someone else's scripts."
    check: "The captures contain the learner's own host numbers (from 1.3), their own MACs and conntrack ports; the gate questions ask about lines in the learner's own results; the mentor spot-checks a clean-lab rerun."
    residual: "low to medium"
  - instrument: LAB
    risk: "Sharing the fixed fault list."
    check: "The lab asks the learner to commit to the first command before any output appears, grades the commands chosen and the order, and (proposal) shuffles scenario order and addresses per learner seed."
    residual: "low to medium"
  - instrument: "OPEN_QUESTION (gates)"
    risk: "A model writes the answer; a generic answer from a peer."
    check: "Every gate asks for the learner's own numbers, capture lines or plan; voice notes and labelled diagrams are accepted; the mentor's follow-up questions are about the learner's own lines; a generic answer scores 2 at best on the rubric."
    residual: medium
  - instrument: "CAPSTONE and 8.7"
    risk: "Someone else built it; the learner cannot explain it."
    check: "The seed is in the write-up and the mentor reproduces the faults; every command in the write-up is one the learner ran; the demo must show, not read; three live probes point at the learner's own capture; tests run from a clean lab."
    residual: low
