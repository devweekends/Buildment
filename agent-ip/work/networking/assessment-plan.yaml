answer_key_check:
  required: "Every quiz question, predict and Check question is re-answered blind before publish, and every model answer is checked against the reference build."
  how:
    - "Extract keyless batches and a separate keys file with node agent-ip/scripts/blind-keys.mjs extract courses/networking <out-dir>; give the reviewer only the batches; run compare."
    - "The reviewer is a person or a model from a different family than the drafters; a model from the drafters' own family does not count, even a smaller one. If no other family is available a person checks the keys."
    - "Any disagreement or ambiguity is a defect until the question, the options or the key is fixed; open every item the reviewer marks medium or low in its chapter."
    - "Check each key against the reference build: the capstone network and the [addr] library are the answer key for address, mask, route, NAT-table and DNS questions; numbers are checked by script (agent-ip/work/networking/tools)."
    - "Length and position: in each quiz set and each Check set the correct option is not the longest by default in half or more of the questions, option lengths are comparable, and the correct position varies."
  status: "not run: no quiz or predict wording exists yet at G3; run when the chapters are drafted. The PR names who checked the keys; if no person did, it asks a reviewer for a human key check before publish."
decisions_for_sponsor:
  - id: D1
    topic: "Drills and O3"
    detail: "The roadmap lists the unassisted drills in 2.2, 2.3, 3.2 and 3.5 as graded evidence for O3. The canvas spec for 2.2 (`canvas-specs/net-m2-address-bits.md`) says the drill is practice, not graded, and that the chapter's quiz is the graded check. This plan follows the canvas spec: the drill stores seed, answers and set score but does not count for completion, and each of those chapters keeps a graded hand-arithmetic quiz question. O3 loses no evidence because 3.7, 3.8, 3.10 and 3.11 remain. The sponsor can instead ask for a threshold (for example 4 of 5 on one set) to count as completion."
  - id: D2
    topic: "Module 9 and O2"
    detail: "Module 9 is evidence for O2 only (quiz 9.4 and gate 9.5, roadmap v3.1). The IPv6 reading skill (9.2) has formative evidence only (the v6 drill, one quiz question and the Check). No new outcome is created."
  - id: D3
    topic: "Evidence the roadmap does not list"
    detail: "Supporting items beyond the roadmap's table (the Check chapters and the gates 5.8, 7.8, 3.12) are marked role supporting; they do not replace the primary evidence."
