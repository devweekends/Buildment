---
artifact: assessment-plan
course: networking
version: 1
owner: assessment-designer
agent_ip_version: 0.5.3
roadmap_version: 3.1
gate: G3
---

principles:
  - "Every outcome O1 to O7 has at least one primary instrument at its level, and every instrument below serves an outcome (module 9 serves O2)."
  - "The evidence ladder: recall, comprehension, application, analysis, evaluation, creation. The lowest level that proves the outcome is used; builds and the capstone carry creation, labs and traces carry analysis, quizzes and code carry application."
  - "Learn and Read chapters carry light evidence: one predict before the key beat (not scored) and one or two auto-graded quiz questions at the end. The hand-arithmetic questions in 2.2, 2.3, 3.2 and 3.5 are the only Learn-chapter questions listed as graded evidence (O3). Concentrated evidence is in the Check chapters, labs, challenges and gates."
  - "This plan contains no quiz wording and no answer keys. Wording and keys are written at chapter drafting and re-answered blind."
  - "Gate evidence may be written, a voice note or a labelled diagram (decision 9); a diagram is submitted as a link until the platform has an image mode."
levels: {recall: 1, comprehension: 2, application: 3, analysis: 4, evaluation: 5, creation: 6}
paths:
  foundations: "Every Learn chapter, lab, drill, quiz and replay; each Code exercise solved or, on a phone, replaced by reading the reference solution and answering three questions. Graded evidence for O2, O3, O4, O5 and O6; O1 only from phone settings; not O7."
  full: "Foundations plus challenges 0 to 6 (decision 8)."
outcomes:
  - id: O1
    statement: "Read their own computer's address, mask, gateway, DNS server and public address, and explain where each came from"
    level: application
    level_note: "Application for reading and recording the numbers; comprehension for the explanation, which is only complete at the demo (the lease, the DNS option and the NAT rewrite are taught in modules 6 and 7)."
    evidence:
      - type: CHALLENGE
        chapter: "1.2"
        level: application
        role: enabling
        proves: "The lab runs and the setup checker passes, so the learner can use the lab checker on their numbers."
      - type: CHALLENGE
        chapter: "1.3"
        level: application
        role: primary
        proves: "The learner's own address, mask, gateway and DNS server pasted from their computer pass the lab checker, which prints the prefix."
      - type: OPEN_QUESTION
        chapter: "1.8"
        level: application
        role: primary
        proves: "A map of the learner's devices, router and provider with real numbers, and the two views of one device (computer's address versus the address a website sees). Rubric R1.8."
      - type: CAPSTONE
        chapter: "8.7"
        level: comprehension
        role: primary
        proves: "At the demo the learner points at the lease line and the address plan and says where each number came from. Rubric R8.7 and C8."
      - type: PREDICT
        chapter: "1.1"
        level: recall
        role: formative
        proves: "Formative: commits to a guess about the two addresses before seeing them."
      - type: QUIZ
        chapter: "1.1"
        level: recall
        role: formative
        proves: "Formative: reads an annotated output; one question."
      - type: CHECK
        chapter: "1.7"
        level: application
        role: supporting
        proves: "Picks the right address, port or layer for five real outputs."
    foundations_path: "From phone settings only (Foundations level, decision 8)."
    rubrics: [R1.8, R8.7]
  - id: O2
    statement: "Classify an address as public, private, shared or special against the IANA registry, and explain why private ranges and NAT exist"
    level: application
    level_note: "Application for classification; comprehension for the explanation."
    evidence:
      - type: CODE
        chapter: "2.5"
        level: application
        role: primary
        proves: "Implements ipToNumber, numberToIp and classify against the stated prefix list; hidden tests include the range edges."
      - type: CHECK
        chapter: "2.6"
        level: application
        role: primary
        proves: "Converts, sizes and classifies addresses by hand, with two questions from module 1."
      - type: OPEN_QUESTION
        chapter: "2.7"
        level: comprehension
        role: primary
        proves: "Explains to a friend why a phone starts with 192.168 or 10, why that is allowed, and the question NAT must answer. Rubric R2.7."
      - type: CHECK
        chapter: "9.4"
        level: application
        role: supporting
        proves: "Shortens IPv6 addresses and predicts what a server sees with and without NAT."
      - type: OPEN_QUESTION
        chapter: "9.5"
        level: evaluation
        role: primary
        proves: "One reason IPv6 removes the need for NAT and one reason IPv4 and NAT will last, each tied to a number. Rubric R9.5."
      - type: QUIZ
        chapter: "2.4"
        level: application
        role: formative
        proves: "Formative: one question on a range edge."
      - type: QUIZ
        chapter: "2.1"
        level: comprehension
        role: formative
        proves: "Formative: what 'ran out' means."
    rubrics: [R2.7, R9.5]
  - id: O3
    statement: "Do CIDR arithmetic (network, broadcast, size, host range, same subnet, split, overlap) by hand without a calculator, and in code"
    level: application
    level_note: "Hand arithmetic and code at application level; the planning lab is analysis."
    evidence:
      - type: DRILL
        chapter: "2.2"
        level: application
        role: formative
        proves: "Unassisted practice: byte and bit conversion with instant feedback and a set score. Practice, not completion (see decision_for_sponsor)."
      - type: QUIZ
        chapter: "2.2"
        level: application
        role: primary
        proves: "Graded: two unassisted hand questions on the dotted form and the single number."
      - type: DRILL
        chapter: "2.3"
        level: application
        role: formative
        proves: "Unassisted practice: size and mask of a /n."
      - type: QUIZ
        chapter: "2.3"
        level: application
        role: primary
        proves: "Graded: one unassisted hand question on the size and mask of a prefix."
      - type: DRILL
        chapter: "3.2"
        level: application
        role: formative
        proves: "Unassisted practice: network, broadcast and same-subnet by hand."
      - type: QUIZ
        chapter: "3.2"
        level: application
        role: primary
        proves: "Graded: one unassisted hand question on the broadcast address of a non-octet prefix."
      - type: DRILL
        chapter: "3.5"
        level: application
        role: formative
        proves: "Unassisted practice: split by host counts and boundaries."
      - type: QUIZ
        chapter: "3.5"
        level: application
        role: primary
        proves: "Graded: one unassisted hand question on sizing a block for a host count."
      - type: CODE
        chapter: "3.7"
        level: application
        role: primary
        proves: "Implements network, broadcast, size and contains, including /0, /31 and /32."
      - type: CODE
        chapter: "3.8"
        level: application
        role: primary
        proves: "Implements splitBlock and overlaps."
      - type: LAB
        chapter: "3.10"
        level: analysis
        role: primary
        proves: "Plans a school network in one /22 with alignment, no overlap and a stated growth margin; graded checks."
      - type: CHECK
        chapter: "3.11"
        level: application
        role: primary
        proves: "Does subnet arithmetic by hand, predicts an ARP exchange and spots an overlap."
      - type: OPEN_QUESTION
        chapter: "3.12"
        level: evaluation
        role: supporting
        proves: "Defends the 3.10 plan against a fourth lab. Rubric R3.12."
    rubrics: [R3.12]
  - id: O4
    statement: "Trace a packet from laptop to server (gateway decision, ARP, longest prefix match, TTL, ports, TCP handshake) and confirm each step with commands"
    level: analysis
    level_note: "Analysis: reading a real trace and a real capture and saying which rule explains each line."
    evidence:
      - type: CODE
        chapter: "4.6"
        level: application
        role: primary
        proves: "Implements longest prefix match with a default route and a metric tie rule; the failure-mode test is the /0 shift."
      - type: CHALLENGE
        chapter: "4.7"
        level: creation
        role: primary
        proves: "Challenge 2: a router from namespaces, forwarding and routes, with the MAC change in a capture."
      - type: LAB
        chapter: "4.8"
        level: analysis
        role: primary
        proves: "Finds three faults (mask, gateway, return route) by commands and output; graded checks."
      - type: CHECK
        chapter: "4.9"
        level: application
        role: primary
        proves: "Chooses routes and predicts each hop's addresses in three situations, with two questions from module 3."
      - type: OPEN_QUESTION
        chapter: "4.10"
        level: analysis
        role: primary
        proves: "Explains the learner's own traceroute and names questions for the hops they cannot yet explain. Rubric R4.10."
      - type: CHALLENGE
        chapter: "5.6"
        level: analysis
        role: primary
        proves: "Challenge 3: listening addresses and the handshake in the learner's capture, read with ss on both sides."
      - type: CHECK
        chapter: "5.7"
        level: application
        role: primary
        proves: "Matches replies to sockets, picks TCP or UDP for three apps, and two questions from module 4."
      - type: OPEN_QUESTION
        chapter: "5.8"
        level: analysis
        role: supporting
        proves: "Explains every number in one line of the learner's own capture. Rubric R5.8."
      - type: PREDICT
        chapter: "4.2 to 4.4 and 5.2 to 5.5"
        level: analysis
        role: formative
        proves: "Formative: a committed prediction before each key beat (MAC per hop, longest prefix, silent router, socket, listening address, resend, loss)."
    rubrics: [R4.10, R5.8]
  - id: O5
    statement: "Demonstrate NAT: show the source address rewritten (and the port when two devices clash) in a router they built, read the real NAT table, explain why the internet cannot reach a home device, and recognise carrier-grade NAT"
    level: analysis
    level_note: "Analysis for reading the table and the capture; creation for the router build (challenge 4)."
    evidence:
      - type: CODE
        chapter: "6.6"
        level: application
        role: primary
        proves: "Implements a NAT table with expiry; the failure-mode test is the expiry boundary."
      - type: CHALLENGE
        chapter: "6.7"
        level: creation
        role: primary
        proves: "Challenge 4 part 1: masquerade, both sides captured, conntrack -L read, same-source-port clash predicted and read."
      - type: CHALLENGE
        chapter: "6.8"
        level: creation
        role: primary
        proves: "Challenge 4 part 2: a forwarded port, an unforwarded port refused, a guest network kept from the home subnet."
      - type: LAB
        chapter: "6.9"
        level: analysis
        role: primary
        proves: "Forwards a port after an injected fault, shares one address between two servers, explains why provider NAT stops forwarding."
      - type: CHECK
        chapter: "6.10"
        level: application
        role: primary
        proves: "Predicts addresses on both sides of one and two NATs and whether the port changes, with two questions from module 5."
      - type: OPEN_QUESTION
        chapter: "6.11"
        level: analysis
        role: primary
        proves: "Answers the course question with the learner's own capture and conntrack line. Rubric R6.11."
      - type: PREDICT
        chapter: "6.1 to 6.5"
        level: analysis
        role: formative
        proves: "Formative: a committed prediction before each key beat (one address, the port clash, route leak, two rewrites, the idle timer)."
    rubrics: [R6.11]
  - id: O6
    statement: "Explain DHCP and DNS (including caching and TTL), and diagnose 'no internet' layer by layer"
    level: analysis
    level_note: "Analysis: choosing commands and reading their output to name the broken layer."
    evidence:
      - type: LAB
        chapter: "7.5"
        level: analysis
        role: primary
        proves: "Diagnoses six broken networks by choosing commands and reading output in order; graded checks."
      - type: LAB
        chapter: "6.9"
        level: analysis
        role: supporting
        proves: "The fault level (level 1) of the NAT lab: finds one injected fault before forwarding."
      - type: CHALLENGE
        chapter: "7.6"
        level: creation
        role: primary
        proves: "Challenge 5: dnsmasq on the learner's router gives a lease and a name; must-fail with dnsmasq stopped."
      - type: CHALLENGE
        chapter: "8.5"
        level: analysis
        role: primary
        proves: "Capstone part 4: finds three seeded faults from evidence and writes what was seen. Rubric C8 (diagnosis)."
      - type: CHECK
        chapter: "7.7"
        level: application
        role: supporting
        proves: "Orders the steps from joining Wi-Fi to the first byte and diagnoses three outputs, with two questions from module 6."
      - type: OPEN_QUESTION
        chapter: "7.8"
        level: creation
        role: supporting
        proves: "Writes a runbook for the family's Wi-Fi: a command, a good output, a bad output and a meaning per layer. Rubric R7.8."
      - type: PREDICT
        chapter: "7.2 to 7.4"
        level: analysis
        role: formative
        proves: "Formative: pool exhaustion, the resolver's walk, how long the old answer survives."
    rubrics: [R7.8, C8]
  - id: O7
    statement: "Build a network from Linux network namespaces (subnets, router, NAT, port forwarding, isolation, DHCP, DNS) and prove it works and fails with tests and captures"
    level: creation
    level_note: "Creation: the learner ships a repository that builds and passes from a clean lab; each part has a must-fail test."
    evidence:
      - type: CHALLENGE
        chapter: "1.4"
        level: creation
        role: primary
        proves: "Challenge 1 part 1: two namespaces on a virtual cable; ping works and the nobody-owns-it ping fails."
      - type: CHALLENGE
        chapter: "3.9"
        level: creation
        role: primary
        proves: "Challenge 1 part 2: disagreeing masks give two different failures."
      - type: CHALLENGE
        chapter: "4.7"
        level: creation
        role: primary
        proves: "Challenge 2: a router."
      - type: CHALLENGE
        chapter: "6.7"
        level: creation
        role: primary
        proves: "Challenge 4 part 1: masquerade."
      - type: CHALLENGE
        chapter: "6.8"
        level: creation
        role: primary
        proves: "Challenge 4 part 2: forwarding and a guest network."
      - type: CHALLENGE
        chapter: "7.6"
        level: creation
        role: primary
        proves: "Challenge 5: DHCP and DNS."
      - type: CAPSTONE
        chapter: "8.2 to 8.5"
        level: creation
        role: primary
        proves: "Challenge 6: four checkpointed parts, each with tests, a must-fail test and committed captures. Rubric C8."
      - type: CAPSTONE
        chapter: "8.7"
        level: evaluation
        role: primary
        proves: "Five-minute demo and three mentor probes. Rubric R8.7."
    foundations_path: "Not available on the Foundations level (decision 8); needs a laptop."
    rubrics: [R8.7, C8]
