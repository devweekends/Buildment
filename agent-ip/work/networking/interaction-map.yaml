never_ask_check:
  rule: "Every question (predict, quiz, open question) must be answerable from what earlier chapters taught, or from everyday intuition and what the picture shows (`03-authoring-standards.md`, never ask before you teach)."
  method: "Each Predict and quiz question in the nine briefs was read against the chapters before it, with the module's own beats counted only when they come before the question. A question that still needed a mechanism nobody had taught was reworded, replaced or moved; every other predict was moved from 'PREDICT first' to just before the key beat."
  counts:
    predicts_total: 40
    predicts_fixed: 11
    predicts_moved_only: 19
    predicts_unchanged: 10
    quiz_questions_fixed: 2
    gate_questions_fixed: 1
  fixed:
    - chapter: "1.1"
      instrument: QUIZ
      before: "Read an annotated output and pick the gateway line."
      after: "Read an annotated output and pick the line that is the router your computer hands everything else to."
      reason: "'Gateway' is named in the chapter's own annotations, but the question should not need the word before the picture teaches it."
    - chapter: "1.4"
      instrument: PREDICT
      before: "You ping once. Will the capture show only the ping?"
      after: "For one ping with -c1, how many lines do you expect in the capture?"
      reason: "The old question was only answerable by someone who already knew about ARP, which module 3 teaches. The new one is answered by everyday intuition (two lines), so the extra ARP lines in the learner's own capture are the surprise."
    - chapter: "2.5"
      instrument: PREDICT
      before: "Before the exercise: what does 255 << 24 print?"
      after: "Same question, placed after a callout that says JavaScript bit operators work on signed 32-bit numbers and the top bit is the sign bit (2.2 showed 128.0.0.0 as the top bit, 2,147,483,648)."
      reason: "Without the sign-bit premise the answer (-16777216) cannot be derived from anything taught."
    - chapter: "3.1"
      instrument: PREDICT
      before: "What does the mask decide? (options named 'which addresses your laptop treats as neighbours')"
      after: "Your numbers changed when you changed Wi-Fi. What do you think the mask is for? Options in everyday words, no term 3.2 has not taught."
      reason: "A Read chapter may ask 'what do you think' in everyday words; the old options used a mechanism the module has not taught."
    - chapter: "3.1"
      instrument: QUIZ
      before: "Turn 0xffffffc0 into dotted form (255.255.255.192)."
      after: "Turn 0xffff0000 into dotted form (255.255.0.0)."
      reason: "Reading c0 as 192 needs hex arithmetic the chapter does not teach; ff is 255 and 00 is 0 are the pairs the annotated picture shows."
    - chapter: "3.4"
      instrument: PREDICT
      before: "A staff laptop sends one broadcast. How many other devices hear it, flat and split? (599 and 99)"
      after: "Asked after beat 2 showed 599 on the flat network: in the split picture (three switches joined by a router box), how many other devices hear it?"
      reason: "Nothing taught earlier says a router stops a broadcast. The question now rests on the picture of three separate switches, and the flat count is shown, not asked."
    - chapter: "3.7"
      instrument: PREDICT
      before: "What does 1 << 32 print?"
      after: "Without >>> 0, will the number for 128.0.0.1 come out positive or negative? The 1 << 32 trap moves into a Callout that teaches it before the /0 test."
      reason: "Shift counts wrapping at 32 is a JavaScript quirk no earlier chapter teaches and nothing lets the learner derive. The sign-bit question follows from 2.2 and 2.5."
    - chapter: "3.9"
      instrument: PREDICT
      before: "Which side fails at once and which fails silently?"
      after: "After the line that says neither namespace has a gateway: which computer thinks the other is NOT on its own network, the one with /24 or the one with /28?"
      reason: "Predicting 'at once' versus 'silent' needs the idea of a route and ARP behaviour that this chapter teaches. The new question is the mask AND from 3.2; the two failure styles are what the build then shows."
    - chapter: "4.3"
      instrument: PREDICT
      before: "Predict comes before any explanation, with the /8 listed first (module risk line)."
      after: "Placed after beat 2, which shows three rows containing 10.1.2.3, so the learner reasons from 2.3 and 3.6 that a /16 sits inside a /8."
      reason: "The answer was asked before the chapter showed that several rows match."
    - chapter: "5.3"
      instrument: PREDICT
      before: "Options: works, refused, no answer."
      after: "Options: it works, it fails. The refusal is shown by the picture and named in the beat text."
      reason: "Telling 'refused' from 'no answer' is a mechanism no earlier chapter teaches (6.3 and 6.8 come later)."
    - chapter: "6.3"
      instrument: PREDICT
      before: "A friend sends to your router's public address, no rule, no earlier outbound packet: refused, silent timeout, or your laptop's page?"
      after: "The outside network is given a route to your home range and a friend sends straight to 192.168.1.23: does it reach your laptop? Beat 2 shows the refusal before it."
      reason: "Refused versus silent timeout cannot be derived. The new question follows from 4.7 (a router with forwarding on forwards what it has a route for) and is the chapter's real surprise: NAT is not a firewall."
    - chapter: "7.1"
      instrument: PREDICT
      before: "Which of three statements must be true (link is up / gateway answers / names resolve)?"
      after: "Same question with 'names resolve' replaced by 'the website's name can be turned into an address'."
      reason: "Read chapters use everyday words; 'resolve' is taught in 7.3."
    - chapter: "8.4"
      instrument: PREDICT
      before: "Can guest1 still get names from the router while it cannot reach 192.168.1.20? (because the drop rule is in the forward chain and a query to the router itself is not forwarded)"
      after: "The guest-to-home rule drops packets from 192.168.50.0/24 to 192.168.1.0/24. A guest asks the router at 192.168.50.1 for a name: does the rule match that packet?"
      reason: "The old answer relied on the forward-chain versus router-itself distinction, which no earlier chapter teaches. The new question is answered by reading the rule."
    - chapter: "2.7"
      instrument: OPEN_QUESTION
      before: "Gate asks the learner to name the question NAT must answer."
      after: "2.4 beat 5 now states that question in its text (many devices share one outside address: how does a reply find the right one?)."
      reason: "The gate asked for something the module had not said in words."
