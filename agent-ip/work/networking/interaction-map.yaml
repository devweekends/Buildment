chapters:
  - id: "1.1"
    title: "Which address is yours?"
    module: 1
    type: Read
    minutes: 15
    archetype: "orientation (read)"
    format: beats
    frontmatter: {stepType: Read, format: beats}
    beats:
      - n: 1
        heading: "Your computer and a website disagree"
        visual: {component: MermaidDiagram, id: mmd-1-1-two-numbers}
        mode: fixed
        playable: false
        shows: "the laptop at 192.168.1.23 and the website at 203.0.113.45 sit on different sides of the router"
        touch: "none, the picture plays or is fixed"
      - n: 2
        heading: "Read your own numbers on your computer"
        visual: {component: VisualDiagram, id: net-m1-own-numbers-annotated}
        mode: fixed
        playable: false
        shows: "annotated Windows, macOS, Linux and phone outputs with address, mask, gateway, DNS server and the address a website sees marked"
        touch: "the learner runs the commands and copies five numbers into the LearningLog"
    interactions:
      - type: PREDICT
        placement: before-beat-1
        ask: "Before you look: in most homes, will the website print the address your computer shows?"
        options: ["yes, the same address", "no, a different one", "it depends on the website"]
        answerable_from: "everyday intuition only; the learner has seen one computer and one website and has to commit before any number is shown"
        purpose: "This proves that the learner commits to an answer before beat 1 shows it."
        budget: 1
      - type: QUIZ
        placement: end
        ask: "Read an annotated output and pick the line that is the router your computer hands everything else to, in plain words"
        taught_in: "beat 2 annotations"
        purpose: "This proves that the learner can apply what beat 2 annotations showed to a new case."
        budget: 1
      - type: LEARNING_OBJECTIVES
        component: LearningObjectives
        detail: LearningObjectives
        placement: chapter-start
        purpose: "This states the module's three outcomes once, at the module start."
      - type: LEARNING_LOG
        component: LearningLog
        detail: LearningLog
        placement: end
        purpose: "This proves that the learner reflects on what the picture showed in their own words."
      - type: CALLOUT
        count: 1
        placement: "in a beat fold"
        purpose: "This states a limit or a near miss in one sentence."
    glossary_terms: [gateway, "DNS server", "public address", "documentation range"]
    near_miss: "Result is IPv6, or `-4` fails; the address starts with `100.` (shared space, one sign, not proof, S11); a VPN is on; the learner runs `curl` inside the lab, which shows the lab's view, not theirs (dossier tested only `traceroute` there; `curl` is untested, verify at G3). The Callout says the documentation range is a stand-in (decision 11). The echo service is a third party [S52]: optional, never graded."
    diagram_plan:
      format: "beat diagrams (MermaidDiagram, VisualDiagram or TraceRequest)"
      beats: [1, 2]
      claim: "the laptop at 192.168.1.23 and the website at 203.0.113.45 sit on different sides of the router"
    text_budget:
      beats: "1 to 2 (this chapter 2)"
      per_beat_max_visible_words: 70
      visible_words: "at most 70 per beat; the commands the chapter asks for stay as code fences"
      words_with_folds: "depth in the GoDeeper folds"
