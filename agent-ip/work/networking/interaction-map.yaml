  - id: "5.4"
    title: "TCP: a conversation that survives loss"
    module: 5
    type: Learn
    minutes: 40
    archetype: concept
    format: beats
    frontmatter: {stepType: Learn, format: beats}
    beats:
      - n: 1
        heading: "Any network can lose a packet"
        visual: {component: InteractiveCanvas, slug: net-m5-scene-lossy-link, renderer: scene}
        mode: watch
        playable: false
        shows: "a file crosses a link that drops a packet, and the download still arrives whole"
        touch: "none, the picture plays or is fixed"
      - n: 2
        heading: "Three packets open a conversation"
        visual: {component: MermaidDiagram, id: mmd-5-4-handshake}
        mode: fixed
        playable: false
        shows: "SYN seq 1000, SYN-ACK seq 5000 ack 1001, ACK ack 5001: each side acknowledges the other's number plus one; an ack names the next byte expected"
        touch: "none, the picture plays or is fixed"
      - n: 3
        heading: "The receiver names the next byte it expects"
        visual: {component: InteractiveCanvas, slug: net-m5-tcp-loss-ack, renderer: sequence}
        mode: step
        playable: false
        shows: "three 100-byte segments from seq 1001; segment 2 (1101) is lost; the server keeps acknowledging 1101"
        touch: "step through the segments"
      - n: 4
        heading: "The same ack again means: send it again"
        visual: {component: InteractiveCanvas, slug: net-m5-tcp-loss-resend, renderer: sequence}
        mode: step
        playable: false
        shows: "the sender notices the repeated acknowledgement and sends 1101 again; the next ack jumps to 1301"
        touch: "step through the resend"
      - n: 5
        heading: "Which segments must be sent again?"
        visual: {component: InteractiveCanvas, slug: net-m5-sort-resend, renderer: sorter}
        mode: play
        playable: true
        shows: "a short exchange of segments and acks; each segment is arrived or must be resent"
        touch: "sort each segment given the acks"
    interactions:
      - type: PREDICT
        placement: before-beat-3
