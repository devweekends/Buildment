        placement: end
        ask: "Which field changes when you ping a different address"
        taught_in: "beat 5"
        purpose: "This proves that the learner can apply what beat 5 showed to a new case."
        budget: 1
      - type: CALLOUT
        count: 1
        placement: "in a beat fold"
        purpose: "This states a limit or a near miss in one sentence."
