  - id: "1.5"
    title: "What one ping actually sent"
    module: 1
    type: Learn
    minutes: 35
    archetype: concept
    format: beats
    frontmatter: {stepType: Learn, format: beats}
    beats:
      - n: 1
        heading: "One ping is more than one packet"
        visual: {component: MermaidDiagram, id: mmd-1-5-ping-packets}
        mode: fixed
        playable: false
        shows: "ARP request, ARP reply, echo request and echo reply between laptop and phone"
        touch: "none, the picture plays or is fixed"
      - n: 2
        heading: "A DNS query carries two ports"
        visual: {component: InteractiveCanvas, slug: net-m1-packet-dns, renderer: packet}
        mode: play
        playable: true
        shows: "a real DNS query with source address, destination address, TTL, source port and destination port 53"
        touch: "tap a field to see what it is, who set it and which module explains it"
      - n: 3
        heading: "A ping has addresses and TTL, no ports"
        visual: {component: InteractiveCanvas, slug: net-m1-packet-echo, renderer: packet}
        mode: play
        playable: true
        shows: "the ICMP echo from challenge 1: addresses, TTL and type, and no port field"
        touch: "tap each field of the echo"
      - n: 4
        heading: "Match your own capture to the fields"
        visual: {component: InteractiveCanvas, slug: net-m1-packet-own-lines, renderer: packet}
        mode: play
        playable: true
        shows: "three tcpdump -n -v lines (ARP request, echo request, echo reply) with the matching fields lit"
        touch: "tap a capture line to light its fields"
      - n: 5
        heading: "Change the target, see what changes"
        visual: {component: InteractiveCanvas, slug: net-m1-packet-change, renderer: packet}
        mode: play
        playable: true
        shows: "the same echo sent to a different address: only the destination address and the MACs change"
        touch: "pick a new destination and watch which fields change"
    interactions:
      - type: PREDICT
        placement: before-beat-3
        ask: "Does a ping packet carry a source port?"
        options: ["yes", "no", "only sometimes"]
        answerable_from: "beat 2 has just shown that a port names the app at each end; the learner reasons about whether ping talks to an app. Nothing about ICMP is assumed"
        purpose: "This proves that the learner commits to an answer before beat 3 shows it."
        budget: 1
      - type: QUIZ
        placement: end
        ask: "Match three of your own tcpdump -n -v lines to fields (address, TTL, type)"
        taught_in: "beat 4"
        purpose: "This proves that the learner can apply what beat 4 showed to a new case."
        budget: 1
