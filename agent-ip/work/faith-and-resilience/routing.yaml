# Model routing for this run. Two model families are available: the drafting
# family (main session and its subagents) and a second, independent family run
# headless through a local command-line agent. The second family is used for
# the blind answer-key check and for one of the two critics, so those checks do
# not share the drafters' blind spots. The other critic is a separate agent from
# the drafting family with no writer rationale (recorded as risk R1). A
# qualified Islamic scholar and a human key check are still required.
orchestrator: drafting model (main session)
research: drafting model, separate agent with web search
curriculum_architect: drafting model (main session)
interaction_designer: drafting model (main session)
interactive_canvas_builder: chapter writers (data and spec on existing renderers); registration and tests by the orchestrator
chapter_writers: drafting model, parallel agents split by module
critic_a: drafting model family, smaller review model, separate agent, no writer rationale (pedagogy, assessment)
critic_b: second model family, separate agent, no writer rationale (slop, continuity, accuracy against the dossier, safety and tone)
blind_key_check: second model family, keyless batches only
technical_validator: scripts and tests (validate:source, content:audit, audit-course.mjs, canvas tests, import, click-through)
subject_review: a qualified Islamic scholar (human, pending)
