  - dir: 22-chat-presence-and-notifications
    title: "Chat, presence and notifications"
    summary: "Run the design loop on a chat app: estimate messages, open connections and storage, sketch gateways, a chat service, a store and a registry, then go deep on connections, ordering, receipts, offline sync, presence and a notification service with preferences, retries and dedupe."
    lessons:
      - file: 22.01-set-the-scene-and-requirements.md
        title: "Set the scene and requirements"
        goal: "Turn daily users into messages a second, open connections at peak, gateways and storage, and find the number that drives the design."
      - file: 22.02-high-level-design.md
        title: "High-level design"
        goal: "Draw gateways, chat service, store, registry and notifier, size each at peak, and explain why a tick means the message is saved and why a group is one write."
      - file: 22.03-deep-dive-connections-at-scale.md
        title: "Deep dive: connections at scale"
        goal: "Route a message to the gateway that holds a user, restart gateways without a reconnect storm, drain a gateway, and catch a line that died without saying goodbye."
      - file: 22.04-deep-dive-ordering-receipts-and-presence.md
        title: "Deep dive: ordering, delivery receipts and presence"
        goal: "Order messages with a counter per conversation, make a retry safe with a client id, report sent, delivered and read as cursors, catch up offline phones, and show online status without drowning the servers in pings."
      - file: 22.05-deep-dive-a-notification-system.md
        title: "Deep dive: a notification system"
        goal: "Fan out push, email and SMS with preferences, a dedupe key, a queue per channel, retries with backoff, dead letters and time limits, and one alert for many messages."
      - file: 22.06-code-per-conversation-sequencing-and-dedupe.md
        title: "Code: per-conversation sequencing and dedupe"
        goal: "Implement createConversationLog and createInbox and pass the tests on numbering, duplicates, gaps and a shuffled stream."
      - file: 22.09-quiz.md
        title: "Chat and notifications"
        goal: "Answer graded scenarios on sizing gateways, message order, the cost of presence, a lost registry and an SMS outage."
      - file: 22.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write a design for a delivery app's rider chat and order alerts with one defended trade-off."
