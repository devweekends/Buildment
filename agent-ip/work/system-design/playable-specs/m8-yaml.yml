  - dir: 08-replication
    title: "Replication"
    summary: "Copy data for safety and fast reads, and handle what replication lag and failover do to users."
    lessons:
      - file: 08.01-set-the-scene-my-comment-disappeared.md
        title: "Set the scene: my comment disappeared"
        goal: "See a user post a comment, reload, find it missing and post again, and meet the leader and replicas behind it."
      - file: 08.02-single-leader-replication.md
        title: "Single-leader replication"
        goal: "Follow writes from the leader to its followers in log order, send reads to any copy, and explain why followers add room for reads but not for writes."
      - file: 08.03-synchronous-and-asynchronous-replication.md
        title: "Synchronous and asynchronous replication"
        goal: "Trade write latency against the data lost on failover, and choose how many followers must confirm a write."
      - file: 08.04-replication-lag-and-its-anomalies.md
        title: "Replication lag and its anomalies"
        goal: "Reproduce read-your-writes and monotonic reads violations on lagging replicas, and fix each with a routing rule whose cost you can name."
      - file: 08.05-failover-and-split-brain.md
        title: "Failover and split brain"
        goal: "Explain detection, promotion, lost writes and two leaders, and how a fencing number stops the old one."
      - file: 08.06-multi-leader-replication.md
        title: "Multi-leader replication"
        goal: "Explain why two regions writing the same record conflict, how last writer wins loses an edit, and where multi-leader fits."
      - file: 08.07-leaderless-replication-a-first-look.md
        title: "Leaderless replication, a first look"
        goal: "See writes go to many nodes with no leader, and say when R + W is enough for a read to see the newest write."
      - file: 08.08-code-a-read-your-writes-router.md
        title: "Code: a read-your-writes router"
        goal: "Write createRouter: route reads to a replica at or above the user's token, raise the token on reads, cap leader fallback, and quarantine a replica whose position moves backwards."
      - file: 08.09-challenge-7-replicas-and-lag.md
        title: "Challenge 7: replicas and lag"
        goal: "Run a PostgreSQL primary and replica in Docker, induce lag, reproduce the read-your-writes bug, and fix it with log position tokens."
      - file: 08.10-quiz.md
        title: "Replication"
        goal: "Answer graded scenarios on synchronous waits, position tokens, promotion, conflicts between regions and quorums."
      - file: 08.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write a replication plan for a social app: which writes wait for a copy, where each read goes, and what happens when the leader dies."
