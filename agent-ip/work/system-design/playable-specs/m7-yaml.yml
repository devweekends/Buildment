  - dir: 07-databases-and-concurrency-control
    title: "Databases and concurrency control"
    summary: "Choose a database, understand indexes and transactions, and stop two writers from corrupting data."
    lessons:
      - file: 07.01-set-the-scene-two-people-buy-the-last-ticket.md
        title: "Set the scene: two people buy the last ticket"
        goal: "See a lost update sell the last ticket twice."
      - file: 07.02-choosing-a-database.md
        title: "Choosing a database"
        goal: "Match relational, key-value, document, wide-column, time-series, graph and search stores to the way data is read, and sort workloads to the store that fits."
      - file: 07.03-indexes-b-trees-and-lsm-trees.md
        title: "Indexes: B-trees and LSM trees"
        goal: "Explain why an index cuts page reads, why a B-tree changes pages in place while an LSM tree appends and merges later, and where a Bloom filter saves reads."
      - file: 07.04-transactions-and-isolation-levels.md
        title: "Transactions and isolation levels"
        goal: "Wrap steps in a transaction, and name the anomaly each isolation level allows: dirty read, lost update and write skew."
      - file: 07.05-locks-mvcc-and-compare-and-set.md
        title: "Locks, MVCC and compare-and-set"
        goal: "Fix a lost update with a row lock, with a version check and bounded retries, and with one statement, and choose by how often writers collide."
      - file: 07.06-the-database-scaling-path.md
        title: "The database scaling path"
        goal: "Order the steps of indexes, cache, read replicas, partitioning and special stores, and add each one when its bottleneck appears."
      - file: 07.07-code-compare-and-set-inventory.md
        title: "Code: compare-and-set inventory"
        goal: "Implement a versioned store and a reserveSeats function with a bounded retry loop, and pass the race tests."
      - file: 07.08-challenge-6-the-last-ticket.md
        title: "Challenge 6: the last ticket"
        goal: "Reproduce a lost update in PostgreSQL, fix it with a row lock, compare-and-set and SERIALIZABLE with retries, and measure the cost of each."
      - file: 07.09-quiz.md
        title: "Databases and concurrency"
        goal: "Answer graded scenarios on store choice, indexes, isolation levels, locks and compare-and-set, and the scaling path."
      - file: 07.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write the store and the concurrency control for an inventory service, with its cost and a number to measure, and link your challenge 6 results."
