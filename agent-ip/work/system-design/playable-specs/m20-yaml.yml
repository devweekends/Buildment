  - dir: 20-url-shortener-and-paste-service
    title: "URL shortener and paste service"
    summary: "Run the design loop on a link shortener: estimate the load, sketch the write and read paths, choose how to make short codes, and keep redirects fast with a cache, the right status code and counting off the path. Then reuse it all for a paste service."
    lessons:
      - file: 20.01-set-the-scene-and-requirements.md
        title: "Set the scene and requirements"
        goal: "Turn short links into numbers: writes, reads at peak and storage over five years, and find the number that drives the design."
      - file: 20.02-high-level-design.md
        title: "High-level design"
        goal: "Draw the write path and the read path, size the blocks for 100,000 redirects a second, and extend the design to pastes."
      - file: 20.03-deep-dive-generating-short-codes.md
        title: "Deep dive: generating short codes"
        goal: "Compare hashing, counters in base62, counter blocks and pre-made random codes, size the code length, and choose by whether codes must resist guessing."
      - file: 20.04-deep-dive-the-read-path-at-scale.md
        title: "Deep dive: the read path at scale"
        goal: "Size a cache from its hit rate and p99, choose between a 301 and a 302, count clicks without slowing redirects, and survive a cold cache."
      - file: 20.05-code-base62-and-a-key-range-allocator.md
        title: "Code: base62 and a key range allocator"
        goal: "Implement encodeBase62, decodeBase62 and createRangeAllocator and pass the tests."
      - file: 20.07-quiz.md
        title: "URL shortener"
        goal: "Answer graded scenarios on peak load, code length, redirects, hit rate and p99, and counting off the path."
      - file: 20.08-checklist.md
        title: "Checklist and learning log"
        goal: "Write a design for a paste service with one defended trade-off."
