  - dir: 13-leaderless-stores-dynamo-and-conflict-resolution
    title: "Leaderless stores, Dynamo and conflict resolution"
    summary: "Build an always-writable store and settle the conflicts it creates: quorums, sloppy quorums and hints, last write wins and the data it loses, siblings, and CRDTs."
    lessons:
      - file: 13.01-set-the-scene-the-cart-that-must-always-accept.md
        title: "Set the scene: the cart that must always accept"
        goal: "See a cart with one leader refuse an add during a failure, and a cart with no leader accept two adds and end with two versions."
      - file: 13.02-the-dynamo-design-end-to-end.md
        title: "The Dynamo design end to end"
        goal: "Walk a key through the ring, the preference list that skips repeated machines, the coordinator, W confirmations and R answers, and choose N, R and W for a job."
      - file: 13.03-sloppy-quorums-hinted-handoff-read-repair-and-merkle-trees.md
        title: "Sloppy quorums, hinted handoff, read repair and Merkle trees"
        goal: "Explain how a store keeps writing through failures, why a read can then miss a write, and how hints, read repair and Merkle trees heal the copies."
      - file: 13.04-dynamodb-today-versus-the-dynamo-paper.md
        title: "DynamoDB today versus the Dynamo paper"
        goal: "Explain how the managed service differs from the 2007 paper: a leader per partition, two kinds of read, conditional writes, and a hot partition that stays capped."
      - file: 13.05-last-write-wins-and-lost-data.md
        title: "Last-write-wins and lost data"
        goal: "Show how last write wins with a slow clock silently drops the later write, count the wrong winners, and say when the rule is still fine."
      - file: 13.06-siblings-and-application-merges.md
        title: "Siblings and application merges"
        goal: "Keep concurrent versions with vector clocks, merge them with the context, see a deleted item come back, and compare four merge rules."
      - file: 13.07-crdts.md
        title: "CRDTs"
        goal: "Explain why a G-Counter, a PN-Counter and an OR-Set merge to the same result in any order, and what no CRDT can promise."
      - file: 13.08-code-crdts.md
        title: "Code: CRDTs"
        goal: "Implement a G-Counter, a PN-Counter and an OR-Set, and pass exact tests and property tests for commutative, associative and idempotent merges."
      - file: 13.09-challenge-12-a-leaderless-key-value-store.md
        title: "Challenge 12: a leaderless key-value store"
        goal: "Build a leaderless store on the simulated network, measure stale reads for N, R and W, keep writing through failures with hints, compare last write wins with siblings, and run an OR-Set cart."
      # 13.10 (Lab: a distributed key-value store) is skipped until the sandbox exists.
      - file: 13.11-quiz.md
        title: "Leaderless stores and conflicts"
        goal: "Answer graded scenarios on N, R and W, sloppy quorums, DynamoDB against the paper, last write wins with a slow clock, and a cart that merges itself."
      - file: 13.12-checklist.md
        title: "Checklist and learning log"
        goal: "Write which conflict strategy you choose for a cart, a like counter and a delivery address, with a number, a cost and a trigger to change."
