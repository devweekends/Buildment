  - dir: 21-news-feed-and-timelines
    title: "News feed and timelines"
    summary: "Run the design loop on a news feed: estimate feed opens and posts, sketch the write and read paths, choose between fan-out on write and on read with real follower numbers, then rank, cache and page the feed and keep it up when a part fails."
    lessons:
      - file: 21.01-set-the-scene-and-requirements.md
        title: "Set the scene and requirements"
        goal: "Turn daily users into feed opens and posts a second at peak, and find the number that drives the design."
      - file: 21.02-high-level-design.md
        title: "High-level design"
        goal: "Separate post storage, the social graph and timelines, draw the write and read paths, and keep the newest timeline slice in memory."
      - file: 21.03-deep-dive-fan-out-on-write-or-on-read.md
        title: "Deep dive: fan-out on write or on read"
        goal: "Compare push and pull with numbers, see why one huge account breaks push, set the hybrid threshold from two limits, and run the hybrid."
      - file: 21.04-deep-dive-ranking-and-freshness.md
        title: "Deep dive: ranking and freshness"
        goal: "Build a candidate, rank, serve pipeline, cache the finished page without stale surprises, page a ranked list without repeats, and degrade when the ranker is slow."
      - file: 21.05-code-merge-k-sorted-timelines.md
        title: "Code: merge k sorted timelines"
        goal: "Implement createHeap and mergeTimelines with a cursor and pass the tests."
      - file: 21.07-quiz.md
        title: "News feed"
        goal: "Answer graded scenarios on peak load, fan-out time, slow-lookup chance, paging a ranked list and recovering from an empty cache."
      - file: 21.08-checklist.md
        title: "Checklist and learning log"
        goal: "Write a design for a feed of study circles with one defended trade-off."
