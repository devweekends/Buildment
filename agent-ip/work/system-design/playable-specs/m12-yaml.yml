  - dir: 12-consensus-leader-election-and-coordination
    title: "Consensus, leader election and coordination"
    summary: "Get many machines to agree, elect one leader safely, and keep track of who is alive."
    lessons:
      - file: 12.01-set-the-scene-two-schedulers-in-charge.md
        title: "Set the scene: two schedulers in charge"
        goal: "See a standby scheduler take over from a main one that only looked dead, and a customer billed twice."
      - file: 12.02-why-agreement-is-hard.md
        title: "Why agreement is hard"
        goal: "Explain why a slow node and a dead node look the same, and what a short and a long timeout each cost."
      - file: 12.03-quorums.md
        title: "Quorums"
        goal: "Use majorities and W + R > N, and count the failures a cluster survives."
      - file: 12.04-leader-election-leases-and-fencing-tokens.md
        title: "Leader election, leases and fencing tokens"
        goal: "Stop an old leader after a long pause with a fencing token that storage checks."
      - file: 12.05-raft-part-1-terms-and-elections.md
        title: "Raft, part 1: terms and elections"
        goal: "Explain terms, votes, randomised timeouts and split votes."
      - file: 12.06-raft-part-2-log-replication-and-commit.md
        title: "Raft, part 2: log replication and commit"
        goal: "Explain how entries commit and why a partitioned old leader's entries are overwritten."
      - file: 12.07-paxos-and-multi-leader-setups.md
        title: "Paxos and multi-leader setups"
        goal: "Walk single-decree Paxos with two proposers, and compare Multi-Paxos with Raft and with multi-leader replication."
      - file: 12.08-gossip-and-failure-detection.md
        title: "Gossip and failure detection"
        goal: "Explain how gossip spreads in about log N rounds, how SWIM checks before it blames, and why it suspects before it declares death."
      - file: 12.09-service-discovery-and-coordination-services.md
        title: "Service discovery and coordination services"
        goal: "Explain registration, leases, heartbeats and watches with etcd, ZooKeeper or Consul, and where plain DNS fits."
      - file: 12.10-code-raft-voting-rules.md
        title: "Code: Raft voting rules"
        goal: "Implement handleRequestVote, the up-to-date check, the quorum maths and the commit rule, and pass the scenario tests."
      - file: 12.11-challenge-11-raft.md
        title: "Challenge 11: Raft"
        goal: "Run a five-node Raft cluster on the simulated network, measure election time and commit time, and see which writes survive a partition."
      - file: 12.12-quiz.md
        title: "Consensus and coordination"
        goal: "Answer graded scenarios on majorities, leases and fencing, terms, commits and the choice between gossip and consensus."
      - file: 12.13-checklist.md
        title: "Checklist and learning log"
        goal: "Write how your job scheduler makes sure only one copy runs, and link your challenge 11 results."
