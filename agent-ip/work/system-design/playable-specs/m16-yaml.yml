  - dir: 16-microservices-and-resilience
    title: "Microservices and resilience"
    summary: "Decide when to split a system into services, and keep it standing when a part is slow or broken."
    lessons:
      - file: 16.01-set-the-scene-one-slow-service-took-the-site-down.md
        title: "Set the scene: one slow service took the site down"
        goal: "See a slow optional service use up every worker in a checkout server, and say what you would try first."
      - file: 16.02-monolith-modular-monolith-microservices.md
        title: "Monolith, modular monolith, microservices"
        goal: "Choose a shape by team size, release collisions and how stable the boundaries are."
      - file: 16.03-service-boundaries-and-data-ownership.md
        title: "Service boundaries and data ownership"
        goal: "Draw service lines, give each service one owner for its data, and choose between waiting for an answer and sending a message."
      - file: 16.04-timeouts-retries-backoff-and-jitter.md
        title: "Timeouts, retries, backoff and jitter"
        goal: "Choose a time limit from latency percentiles, and prevent retry storms with one retrying layer, full jitter and a retry budget."
      - file: 16.05-circuit-breakers-bulkheads-and-load-shedding.md
        title: "Circuit breakers, bulkheads and load shedding"
        goal: "Contain a failing dependency with a breaker, separate worker pools and load shedding, and pick the right tool for each failure."
      - file: 16.06-fault-tolerance-and-graceful-degradation.md
        title: "Fault tolerance and graceful degradation"
        goal: "Decide which features degrade and what the fallback is, and keep enough spare capacity for redundancy to work."
      - file: 16.07-code-a-circuit-breaker-and-a-retry-budget.md
        title: "Code: a circuit breaker and a retry budget"
        goal: "Implement fullJitterDelay, createRetryBudget and createBreaker with closed, open and half-open states, and pass the edge-case tests."
      - file: 16.08-challenge-15-resilience.md
        title: "Challenge 15: resilience"
        goal: "Run a checkout service against a slow and failing dependency and measure what timeouts, a jittered retry budget, a breaker and bulkheads do to p99, to the load on the dependency and to payments."
      - file: 16.09-quiz.md
        title: "Microservices and resilience"
        goal: "Answer graded scenarios on shared tables, retry amplification, the breaker's probe, load shedding and fallbacks."
      - file: 16.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write a split-or-not decision for a growing product, with its protections, and link your challenge 15 results."
