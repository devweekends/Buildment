  - dir: 28-the-system-design-interview
    title: "The system design interview"
    summary: "Turn the whole course into interview skill: split 45 minutes into six time boxes, ask short questions and estimate out loud, let the biggest number pick one deep dive, name a cost and a failure, answer follow-ups such as 10 times the traffic with numbers, hold your ground with evidence, avoid six common mistakes, and rehearse with eight timed prompts, one for each case study."
    lessons:
      - file: 28.01-set-the-scene-45-minutes-one-blank-board.md
        title: "Set the scene: 45 minutes, one blank board"
        goal: "See what an interviewer can write down about a silent candidate and about one who talks first, and how the round is scored."
      - file: 28.02-a-framework-that-fits-the-clock.md
        title: "A framework that fits the clock"
        goal: "Give the design loop six time boxes for 45 minutes, ask four short questions, estimate out loud with units, let the driving number pick one deep dive, close with a cost and a failure, and recover when you fall behind."
      - file: 28.03-follow-up-probes-and-how-to-answer-them.md
        title: "Follow-up probes and how to answer them"
        goal: "Answer 'what if traffic grows 10 times?' and 'what breaks first?' in four moves with numbers, answer pushback with evidence, own a flaw, say a trade-off with a cost and a switch point, avoid six common mistakes, and rehearse with eight timed prompts with model answers."
      - file: 28.06-quiz.md
        title: "Interview craft"
        goal: "Choose the stronger answer in graded scenarios on a late start, a spoken estimate, the first part to break, a hard follow-up and a closing trade-off."
      - file: 28.07-checklist.md
        title: "Checklist and learning log"
        goal: "Run one timed mock round from the practice bank with one assumption changed, and write it up in about 300 words or record it."
