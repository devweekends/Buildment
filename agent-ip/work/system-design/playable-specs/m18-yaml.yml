  - dir: 18-running-it-linux-containers-kubernetes-ci-cd-and-the-cloud
    title: "Running it: Linux, containers, Kubernetes, CI/CD and the cloud"
    summary: "Package, ship and run a service: what a container really is, small images, Kubernetes basics, pipelines, release strategies and the cloud blocks behind them."
    lessons:
      - file: 18.01-set-the-scene-works-on-my-machine.md
        title: "Set the scene: works on my machine"
        goal: "See a deploy break because two machines differ, and the idea of one image run everywhere."
      - file: 18.02-linux-under-containers-namespaces-cgroups-limits-and-signals.md
        title: "Linux under containers: namespaces, cgroups, limits, signals"
        goal: "Explain what a container really is, how memory and CPU limits differ, and how graceful shutdown works."
      - file: 18.03-docker-images-and-containers.md
        title: "Docker images and containers"
        goal: "Build small images with good layer caching, a non-root user and a health check."
      - file: 18.04-kubernetes-essentials.md
        title: "Kubernetes essentials"
        goal: "Explain pods, deployments, services, probes, rolling updates and autoscaling."
      - file: 18.05-ci-cd-pipelines.md
        title: "CI/CD pipelines"
        goal: "Design a pipeline with ordered stages, gates, one built image and a smoke test."
      - file: 18.06-deployment-strategies.md
        title: "Deployment strategies"
        goal: "Compare rolling, blue-green, canary and feature flags by blast radius and rollback time."
      - file: 18.07-cloud-building-blocks.md
        title: "Cloud building blocks"
        goal: "Map compute, storage, networking, managed data and queues to AWS names, and use local emulators."
      - file: 18.08-challenge-17-ship-it.md
        title: "Challenge 17: ship it"
        goal: "Containerise a service, run a pipeline, deploy to a local Kubernetes cluster, and try S3 and SQS locally."
      - file: 18.09-quiz.md
        title: "Running it"
        goal: "Answer graded scenarios on containers, Kubernetes, pipelines, releases and cloud blocks."
      - file: 18.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write a deploy and rollback plan for a service."
