  - dir: 04-scaling-out-load-balancing-and-statelessness
    title: "Scaling out: load balancing and statelessness"
    summary: "Grow past one server, spread load fairly, and survive a server dying."
    lessons:
      - file: 04.01-set-the-scene-one-server-is-full.md
        title: "Set the scene: one server is full"
        goal: "See why buying a bigger server stops working."
      - file: 04.02-vertical-versus-horizontal-scaling.md
        title: "Vertical versus horizontal scaling"
        goal: "Compare one large instance with many small ones on capacity, cost and failure."
      - file: 04.03-stateless-services-and-where-state-goes.md
        title: "Stateless services and where state goes"
        goal: "Move sessions out of the server and explain the cost of sticky sessions."
      - file: 04.04-load-balancers-l4-l7-and-health-checks.md
        title: "Load balancers: L4, L7 and health checks"
        goal: "Explain what each layer sees and how health checks remove a bad server."
      - file: 04.05-balancing-algorithms.md
        title: "Balancing algorithms"
        goal: "Compare round robin, least connections, power of two choices and hashing under uneven requests."
      - file: 04.06-autoscaling.md
        title: "Autoscaling"
        goal: "Explain scaling signals, warm-up, cooldown and why scaling lags a spike."
      - file: 04.07-code-load-balancing-pickers.md
        title: "Code: load balancing pickers"
        goal: "Implement round robin, least connections and power of two choices and pass the tests."
      - file: 04.08-challenge-3-a-load-balancer.md
        title: "Challenge 3: a load balancer"
        goal: "Build an L7 proxy with health checks, kill a backend and record the p99."
      - file: 04.10-quiz.md
        title: "Scaling out"
        goal: "Answer graded scenarios on sizing for failure, state, health checks, algorithms and routing."
      - file: 04.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write a defence of a three-tier design for 10,000 requests a second."
