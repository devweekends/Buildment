version: 2

models:
  - name: stg_price_reports
    description: One row per report_id (the latest send), with types cast.
    columns:
      - name: report_id
        data_tests: [unique, not_null]
      - name: price
        data_tests: [not_null]
      - name: reported_date
        data_tests: [not_null]

  - name: stg_markets
    description: The latest extracted row for each market.
    columns:
      - name: market_code
        data_tests: [unique, not_null]

  - name: stg_volunteers
    description: The latest extracted row for each volunteer (no name, no phone).
    columns:
      - name: volunteer_id
        data_tests: [unique, not_null]
