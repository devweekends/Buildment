# Model routing for this run. Two model families are available: the drafting
# family (main session and its subagents) and a second family through a
# separate CLI. The second family does the blind answer-key check and one of
# the two critics, so drafting and critique do not rely on one family alone.
orchestrator: drafting model (main session)
research: drafting model, cheaper tier, three separate agents with web search, one per dossier part
curriculum_architect: drafting model (main session acting in the architect role, roadmap only)
interaction_designer: drafting model (main session), canvas specs on template 14A in the writer pack
interactive_canvas_builder: drafting model, cheaper tier, separate agent for the new shared primitives; chapter writers write data-only canvases
chapter_writers: drafting model, cheaper tier, parallel agents, one or two modules each, from one writer pack
critic_a_pedagogy_and_assessment: review model from the second family (different family from the drafters), blind, files only
critic_b_slop_and_red_team: drafting family, cheaper tier, separate agent with no writer rationale
blind_key_check: review model from the second family, keyless batches from agent-ip/scripts/blind-keys.mjs
technical_validator: scripts and tests (content:validate:source, content:audit, audit-course.mjs, canvas tests, bias check, import, click-through)
shared_family_note: critic B shares the drafting family; critic A and the blind key check do not.

