# Model routing for this run. Two model families are available: the drafting
# family (main session and its subagents) and a second, independent family run
# headless through a local command-line agent. The second family runs the blind
# answer-key check and critic B, so those checks do not share the drafters'
# blind spots. Critic A is a separate agent from the drafting family with no
# writer rationale (recorded as risk R1). A human key check and human review are
# still required before publishing.
orchestrator: drafting model (main session)
research: smaller drafting-family model, two separate agents with web search (part A, part B)
curriculum_architect: drafting model (main session)
interaction_designer: drafting model (main session)
interactive_canvas_builder: specimen kit and model canvases by the orchestrator; course canvases as data and spec by chapter writers; registration and tests by the orchestrator
chapter_writers: smaller drafting-family model, parallel agents, one module each
critic_a: smaller drafting-family model, separate agent, no writer rationale (pedagogy, assessment, canvas)
critic_b: second model family, keyless context in one scratch folder (slop, continuity, accuracy against the dossier, tone, second-language readability)
blind_key_check: second model family, keyless batches only
technical_validator: scripts and tests (validate:source, content:audit, audit-course.mjs, canvas tests, import, click-through)
